<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kids App — Hub World Prototype (internal, not shipped)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500..700;1,6..72,500..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Caveat:wght@500;700&display=swap');

/* ============================================================
   INTERNAL DEMO. Never shipped -- not in stage-site.mjs's PUBLISH
   allow-list; tests/stage-site.test.mjs asserts it stays unpublished.

   v2, after Scott's second round of feedback on v1:
     "its not super HD, the buildings/art does not resize with the
     screen for different window sizes, i think the islands should
     slowly bob up and down/float and things should move slightly as
     if it was all alive."

   Three real fixes here, not just a bigger picture:
   1. RESOLUTION: regenerated at 2752x1536 (2K) instead of 1376x768.
      NOTE: this is a FRESH generation, not an upscale of the exact
      image Scott approved -- the layout drifted slightly (same 5
      landmarks + fox, similar arrangement, not pixel-identical).
      Disclosed, not hidden.
   2. RESIZE BUG (the real bug under "doesn't resize"): the old version
      positioned tap zones as CSS percentages of the viewport while the
      background used object-fit:cover -- cover crops by a DIFFERENT
      amount at every aspect ratio, so a hotspot built for one window
      size silently drifts off its landmark at any other size. Fixed by
      computing the image's actual rendered/cropped rect in JS (the
      same cover math the browser does internally) and positioning
      every hotspot from THAT, recomputed on resize.
   3. "ALIVE": the source art is still one flat image (see the honest
      limitation noted in the commit this file lives in -- true
      per-building independent motion needs layer-separated art). What
      IS achievable from a single image, and built here: three vertical
      slices of the SAME approved picture, each in its own clipped
      "window" with a slow independent bob (different duration/phase),
      so distinct parts of the island drift at their own pace instead
      of the whole picture moving as one rigid block. Hotspots live
      INSIDE their slice's window so they bob together with what they
      point at, never drifting off it.
   ============================================================ */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden; }

.mock-toolbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  background: #14121f; color: #fff;
  padding: 10px 14px; font-size: 12.5px; line-height: 1.5;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.mock-toolbar b { color: #FFD27A; }
.mock-toolbar .sub { color: rgba(255,255,255,0.6); }

.world {
  position: relative;
  width: 100vw; height: 100vh; height: 100dvh;
  background: #cfd9e8;
  overflow: hidden;
}

/* Each .band is a clipped "window" onto its own slice of the SAME
   source image -- sized/positioned in JS to match the real cover-fit
   rect, so it always lines up with the picture regardless of window
   size. The slow bob is applied HERE (the whole slice), so its image
   content and its hotspot children move together, always in sync. */
.band {
  position: absolute; overflow: hidden;
  animation: bob 6s ease-in-out infinite;
  opacity: 0;
}
.band.ready { animation-name: bandIn, bob; animation-duration: 900ms, 6s; animation-timing-function: cubic-bezier(.22,1,.36,1), ease-in-out; animation-iteration-count: 1, infinite; animation-fill-mode: both, none; }
@keyframes bandIn { to { opacity: 1; } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(var(--bob-amp, -8px)); } }
.band img { position: absolute; top: 0; display: block; max-width: none; }

/* ---------- greeting + chrome, sitting IN the world, not on a card - */
.greeting {
  position: absolute; top: calc(60px + env(safe-area-inset-top)); left: 24px; z-index: 20;
  color: #4a2e12; text-shadow: 0 2px 10px rgba(255,255,255,0.55), 0 1px 2px rgba(255,255,255,0.8);
  opacity: 0; animation: fadeDown 700ms ease 300ms both;
}
@keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.greeting .hand { font-family: 'Caveat', cursive; font-size: 24px; display: block; }
.greeting .where { font-family: 'Newsreader', serif; font-style: italic; font-weight: 600; font-size: clamp(26px, 4.5vw, 38px); }

.avatar-pill {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: 16px; z-index: 50;
  display: flex; align-items: center; gap: 10px; border: none; cursor: pointer; font-family: inherit;
  padding: 8px 16px 8px 8px; border-radius: 999px;
  background: rgba(255,255,255,0.5); backdrop-filter: blur(8px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  opacity: 0; animation: fadeDown 700ms ease 900ms both;
}
.pill-avatar { width: 40px; height: 40px; border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 35%, #fff, #FFC56B); }
.pill-name { font-size: 13px; font-weight: 800; color: #4a2e12; display: block; }
.pill-age  { font-size: 10.5px; color: #7a5a30; display: block; }

.exit-btn {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 16px; z-index: 50;
  width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; font-size: 18px;
  background: rgba(255,255,255,0.5); backdrop-filter: blur(8px); box-shadow: 0 6px 16px rgba(0,0,0,0.16);
  opacity: 0; animation: fadeDown 700ms ease 900ms both;
}

/* ---------- tap zones (children of a .band, positioned as % of the
   band's OWN box -- always correct because the band itself is sized
   from the real rendered-image rect, recomputed on resize) --------- */
.spot {
  position: absolute; z-index: 15;
  border: none; background: transparent; cursor: pointer; padding: 0;
  transform: translate(-50%, -50%);
}
.spot .ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 0 rgba(255,224,140,0.0); transition: box-shadow 200ms ease; }
.spot:hover .ring, .spot.tapped .ring { box-shadow: 0 0 0 10px rgba(255,224,140,0.35), 0 0 40px 14px rgba(255,200,90,0.45); }
.spot .glow {
  position: absolute; inset: -18%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,235,180,0.0) 55%, rgba(255,235,180,0.0) 100%);
  transition: background 220ms ease; pointer-events: none;
}
.spot:hover .glow, .spot.tapped .glow {
  background: radial-gradient(circle, rgba(255,235,180,0.55) 0%, rgba(255,235,180,0.0) 72%);
  animation: glowPulse 1.1s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.75; } }
.spot .label {
  position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%) translateY(-6px);
  white-space: nowrap; padding: 6px 14px; border-radius: 999px;
  background: rgba(20,15,10,0.82); color: #FFF1C8; font-weight: 800; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity 160ms ease, transform 160ms ease;
}
.spot:hover .label, .spot.tapped .label { opacity: 1; transform: translateX(-50%) translateY(-12px); }

.toast {
  position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(20px);
  background: #14121f; color: #fff; padding: 12px 22px; border-radius: 14px; font-weight: 800;
  font-size: 15px; opacity: 0; transition: opacity 200ms ease, transform 200ms ease; z-index: 600;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  .band { animation-name: bandIn !important; opacity: 1 !important; }
  * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>

<div class="mock-toolbar">
  <b>HUB WORLD PROTOTYPE v2</b> — higher-res art, hotspots now track the picture at any window size, and the island drifts in 3 independent slow-floating pieces.
  <span class="sub">Tap any building or the fox — it glows, labels itself, and confirms where it would go.</span>
</div>

<div class="world" id="world">
  <!-- 3 bands built + positioned entirely in JS from the real image rect -->

  <div class="greeting">
    <span class="hand">Hi ✦</span>
    <span class="where">Where shall we go?</span>
  </div>

  <button type="button" class="avatar-pill">
    <span class="pill-avatar">🦊</span>
    <span>
      <span class="pill-name">Ava</span>
      <span class="pill-age">6 yrs 2mo</span>
    </span>
  </button>
  <button type="button" class="exit-btn">🚪</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const IMG_SRC = 'redesign-hub-bg.jpg';
  const NATURAL_W = 2752, NATURAL_H = 1536;

  // Bands: non-overlapping horizontal slices of the SAME image, cut through
  // empty sky/path gaps so no building straddles a seam. Each carries the
  // hotspots that visually sit inside it (spot x/y given as a FRACTION of
  // the FULL image -- converted to band-local % below) and its own bob
  // amplitude/duration so the three drift independently, not in lockstep.
  const BANDS = [
    {
      x0: 0, x1: 0.32, bobAmp: '-7px', bobDur: '5.2s',
      spots: [ { label: 'Games', route: 'games/index.html', fx: 0.195, fy: 0.44 } ],
    },
    {
      x0: 0.32, x1: 0.58, bobAmp: '-10px', bobDur: '6.8s',
      spots: [
        { label: 'Learn', route: 'learning/index.html', fx: 0.436, fy: 0.251 },
        { label: 'Watch', route: 'videos/index.html', fx: 0.494, fy: 0.790 },
        { label: 'You',   route: null,                 fx: 0.501, fy: 0.521 },
      ],
    },
    {
      x0: 0.58, x1: 1.0, bobAmp: '-8px', bobDur: '6.0s',
      spots: [
        { label: 'Art',    route: 'art/index.html',    fx: 0.647, fy: 0.296 },
        { label: 'Listen', route: 'listen/index.html', fx: 0.873, fy: 0.467 },
      ],
    },
  ];

  const worldEl = document.getElementById('world');
  const bandEls = [];

  function build() {
    BANDS.forEach((band, i) => {
      const el = document.createElement('div');
      el.className = 'band';
      el.style.setProperty('--bob-amp', band.bobAmp);
      el.style.animationDuration = '900ms, ' + band.bobDur;
      el.style.animationDelay = (i * 120) + 'ms, ' + (i * -1800) + 'ms';

      const img = document.createElement('img');
      img.src = IMG_SRC;
      img.alt = '';
      el.appendChild(img);

      band.spots.forEach((s) => {
        const localX = (s.fx - band.x0) / (band.x1 - band.x0);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'spot';
        btn.dataset.label = s.label;
        if (s.route) btn.dataset.route = s.route;
        btn.style.left = (localX * 100) + '%';
        btn.style.top = (s.fy * 100) + '%';
        // Hit-box scales with the rendered image so it stays landmark-sized
        // at any window width, instead of a fixed px box that's too small
        // on a big screen or too big on a small one.
        btn.style.width = '13vmax';
        btn.style.height = '18vmax';
        btn.innerHTML =
          '<span class="glow"></span>' +
          '<span class="ring" style="position:absolute;inset:0;border-radius:50%;"></span>' +
          '<span class="label">' + s.label + '</span>';
        btn.addEventListener('click', () => {
          document.querySelectorAll('.spot.tapped').forEach((sEl) => sEl.classList.remove('tapped'));
          btn.classList.add('tapped');
          const toast = document.getElementById('toast');
          toast.textContent = s.route ? ('→ would open ' + s.route) : 'That\'s your fox! 🦊';
          toast.classList.add('show');
          clearTimeout(toast._t);
          toast._t = setTimeout(() => { toast.classList.remove('show'); btn.classList.remove('tapped'); }, 1400);
        });
        el.appendChild(btn);
      });

      worldEl.insertBefore(el, worldEl.firstChild); // bands go behind the greeting/pill/exit chrome
      bandEls.push(el);
    });
    requestAnimationFrame(layout);
    // Stagger the entrance-in class so bands weren't already mid-bob before they fade in.
    requestAnimationFrame(() => bandEls.forEach((el) => el.classList.add('ready')));
  }

  // The core fix for "doesn't resize": replicate object-fit:cover's math by
  // hand so every band + every hotspot is positioned from the image's REAL
  // rendered rect, not a viewport percentage that silently drifts once the
  // crop changes at a different aspect ratio.
  function layout() {
    const cw = window.innerWidth, ch = window.innerHeight;
    const scale = Math.max(cw / NATURAL_W, ch / NATURAL_H);
    const renderedW = NATURAL_W * scale, renderedH = NATURAL_H * scale;
    const offsetX = (cw - renderedW) / 2, offsetY = (ch - renderedH) / 2;

    BANDS.forEach((band, i) => {
      const el = bandEls[i];
      const bandW = (band.x1 - band.x0) * renderedW;
      el.style.left = (offsetX + band.x0 * renderedW) + 'px';
      el.style.top = offsetY + 'px';
      el.style.width = bandW + 'px';
      el.style.height = renderedH + 'px';
      const img = el.querySelector('img');
      img.style.width = renderedW + 'px';
      img.style.height = renderedH + 'px';
      img.style.left = (-band.x0 * renderedW) + 'px';
    });
  }

  window.addEventListener('resize', layout);
  build();
</script>
</body>
</html>
