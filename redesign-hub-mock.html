<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kids App — Hub World Prototype (internal, not shipped)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500..700;1,6..72,500..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Caveat:wght@500;700&display=swap');

/* ============================================================
   INTERNAL DEMO. Never shipped -- not in stage-site.mjs's PUBLISH
   allow-list; tests/stage-site.test.mjs asserts it stays unpublished.

   Scott's verdict on the CSS card-grid mocks (redesign-mocks.html):
   "still flat boxes on a screen... not 3d worlds you are interracting
   with." Then, on the hub-world sample: "I LOVE the place with the fox
   and the different buildings/tree. that is absolutely perfect."

   This is the first REAL interactive version of that concept: one
   generated background (redesign-hub-bg.jpg, Nano Banana Pro, few
   cents), five tap zones over the real landmarks, mapped to this app's
   actual five sections. Landmark positions are eyeballed percentages
   against the 1376x768 source image -- good enough to prove the
   concept is tappable and alive; a production version would want the
   art generated in separate layers so buildings can truly "light up"
   and the fox can walk toward whichever one is tapped.
   ============================================================ */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden; }

.mock-toolbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  background: #14121f; color: #fff;
  padding: 10px 14px; font-size: 12.5px; line-height: 1.5;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.mock-toolbar b { color: #FFD27A; }
.mock-toolbar .sub { color: rgba(255,255,255,0.6); }

.world {
  position: relative;
  width: 100vw; height: 100vh; height: 100dvh;
  background: #cfd9e8;
  overflow: hidden;
}
.world img.bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover; object-position: center 40%;
  opacity: 0; transform: scale(1.04);
  animation: bgIn 900ms cubic-bezier(.22,1,.36,1) both;
}
@keyframes bgIn { to { opacity: 1; transform: scale(1); } }

/* ---------- greeting + chrome, sitting IN the world, not on a card - */
.greeting {
  position: absolute; top: calc(60px + env(safe-area-inset-top)); left: 24px; z-index: 20;
  color: #4a2e12; text-shadow: 0 2px 10px rgba(255,255,255,0.55), 0 1px 2px rgba(255,255,255,0.8);
  opacity: 0; animation: fadeDown 700ms ease 300ms both;
}
@keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.greeting .hand { font-family: 'Caveat', cursive; font-size: 24px; display: block; }
.greeting .where { font-family: 'Newsreader', serif; font-style: italic; font-weight: 600; font-size: clamp(26px, 4.5vw, 38px); }

.avatar-pill {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: 16px; z-index: 50;
  display: flex; align-items: center; gap: 10px; border: none; cursor: pointer; font-family: inherit;
  padding: 8px 16px 8px 8px; border-radius: 999px;
  background: rgba(255,255,255,0.5); backdrop-filter: blur(8px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  opacity: 0; animation: fadeDown 700ms ease 900ms both;
}
.pill-avatar { width: 40px; height: 40px; border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 35%, #fff, #FFC56B); }
.pill-name { font-size: 13px; font-weight: 800; color: #4a2e12; display: block; }
.pill-age  { font-size: 10.5px; color: #7a5a30; display: block; }

.exit-btn {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 16px; z-index: 50;
  width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; font-size: 18px;
  background: rgba(255,255,255,0.5); backdrop-filter: blur(8px); box-shadow: 0 6px 16px rgba(0,0,0,0.16);
  opacity: 0; animation: fadeDown 700ms ease 900ms both;
}

/* ---------- tap zones -------------------------------------------- */
.spot {
  position: absolute; z-index: 15;
  border: none; background: transparent; cursor: pointer; padding: 0;
  transform: translate(-50%, -50%);
  opacity: 0; animation: spotIn 560ms cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes spotIn { from { opacity: 0; transform: translate(-50%,-50%) scale(0.4); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }

.spot .ring {
  position: absolute; inset: 0; border-radius: 50%;
  box-shadow: 0 0 0 0 rgba(255,224,140,0.0);
  transition: box-shadow 200ms ease;
}
.spot:hover .ring, .spot.tapped .ring {
  box-shadow: 0 0 0 10px rgba(255,224,140,0.35), 0 0 40px 14px rgba(255,200,90,0.45);
}
.spot .glow {
  position: absolute; inset: -18%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,235,180,0.0) 55%, rgba(255,235,180,0.0) 100%);
  transition: background 220ms ease;
  pointer-events: none;
}
.spot:hover .glow, .spot.tapped .glow {
  background: radial-gradient(circle, rgba(255,235,180,0.55) 0%, rgba(255,235,180,0.0) 72%);
  animation: glowPulse 1.1s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.75; } }

.spot .label {
  position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%) translateY(-6px);
  white-space: nowrap; padding: 6px 14px; border-radius: 999px;
  background: rgba(20,15,10,0.82); color: #FFF1C8; font-weight: 800; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity 160ms ease, transform 160ms ease;
}
.spot:hover .label, .spot.tapped .label { opacity: 1; transform: translateX(-50%) translateY(-12px); }

.spot.idle-bob { animation-name: spotIn, bob; animation-duration: 560ms, 3.2s; animation-timing-function: cubic-bezier(.34,1.56,.64,1), ease-in-out; animation-iteration-count: 1, infinite; animation-delay: calc(var(--i,0)*90ms), calc(560ms + var(--i,0)*-0.5s); }
@keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: -4px; } }

.toast {
  position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(20px);
  background: #14121f; color: #fff; padding: 12px 22px; border-radius: 14px; font-weight: 800;
  font-size: 15px; opacity: 0; transition: opacity 200ms ease, transform 200ms ease; z-index: 600;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>

<div class="mock-toolbar">
  <b>HUB WORLD PROTOTYPE</b> — first real interactive version, not a static picture.
  <span class="sub">Tap any building or the fox — it glows, labels itself, and confirms where it would go. This is a proof of the tap-zone concept; positions are hand-estimated, not pixel-perfect yet.</span>
</div>

<div class="world">
  <img class="bg" src="redesign-hub-bg.jpg" alt="">

  <div class="greeting">
    <span class="hand">Hi ✦</span>
    <span class="where">Where shall we go?</span>
  </div>

  <button type="button" class="avatar-pill">
    <span class="pill-avatar">🦊</span>
    <span>
      <span class="pill-name">Ava</span>
      <span class="pill-age">6 yrs 2mo</span>
    </span>
  </button>
  <button type="button" class="exit-btn">🚪</button>

  <!-- Tap zones, positioned as percentages of the 1376x768 art -->
  <button type="button" class="spot idle-bob" data-label="Games" data-route="games/index.html" style="left:18%; top:39%; width:15%; height:22%; --i:0;">
    <span class="glow"></span><span class="ring" style="position:absolute;inset:0;border-radius:50%;"></span>
    <span class="label">🎮 Games</span>
  </button>
  <button type="button" class="spot idle-bob" data-label="Learn" data-route="learning/index.html" style="left:35%; top:23%; width:15%; height:24%; --i:1;">
    <span class="glow"></span><span class="ring" style="position:absolute;inset:0;border-radius:50%;"></span>
    <span class="label">📖 Learn</span>
  </button>
  <button type="button" class="spot idle-bob" data-label="Listen" data-route="listen/index.html" style="left:56%; top:33%; width:12%; height:18%; --i:2;">
    <span class="glow"></span><span class="ring" style="position:absolute;inset:0;border-radius:50%;"></span>
    <span class="label">🎧 Listen</span>
  </button>
  <button type="button" class="spot idle-bob" data-label="Watch" data-route="videos/index.html" style="left:70%; top:23%; width:14%; height:22%; --i:3;">
    <span class="glow"></span><span class="ring" style="position:absolute;inset:0;border-radius:50%;"></span>
    <span class="label">📺 Watch</span>
  </button>
  <button type="button" class="spot idle-bob" data-label="Art" data-route="art/index.html" style="left:84%; top:41%; width:15%; height:24%; --i:4;">
    <span class="glow"></span><span class="ring" style="position:absolute;inset:0;border-radius:50%;"></span>
    <span class="label">🎨 Art</span>
  </button>
  <button type="button" class="spot" data-label="You" style="left:49%; top:60%; width:9%; height:15%;">
    <span class="glow"></span><span class="ring" style="position:absolute;inset:0;border-radius:50%;"></span>
    <span class="label">👋 That's you!</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
  const toast = document.getElementById('toast');
  let toastTimer = null;
  document.querySelectorAll('.spot').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.spot.tapped').forEach(s => s.classList.remove('tapped'));
      el.classList.add('tapped');
      const route = el.dataset.route;
      toast.textContent = route ? ('→ would open ' + route) : 'That\'s your fox! 🦊';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.classList.remove('show'); el.classList.remove('tapped'); }, 1400);
    });
  });
</script>
</body>
</html>
