<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SimplyKnown Kids">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>SimplyKnown Kids — Home</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .section-row { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .section-btn { width: 140px; height: 140px; }
  </style>
</head>
<body>
  <div class="screen" id="screen">
    <div class="row" style="gap:12px;">
      <div id="childAvatar" style="font-size:40px;"></div>
      <div class="title" id="greeting"></div>
    </div>
    <div class="section-row">
      <div class="section-btn" onclick="go('games/index.html')">
        <div class="icon">🎮</div>
        <div class="label" style="color:#FF6B6B;">GAMES</div>
      </div>
      <div class="section-btn" onclick="go('learning/index.html')">
        <div class="icon">📚</div>
        <div class="label" style="color:#4ECDC4;">LEARN</div>
      </div>
      <div class="section-btn" onclick="go('art/index.html')">
        <div class="icon">🎨</div>
        <div class="label" style="color:#a86cdb;">ART</div>
      </div>
      <div class="section-btn" id="watchTile" onclick="go('videos/index.html')">
        <div class="icon">📺</div>
        <div class="label" style="color:#FFD93D;">WATCH</div>
      </div>
    </div>
    <div class="subtitle" style="cursor:pointer;margin-top:8px;" onclick="goProfiles()">
      ← switch child
    </div>
  </div>

  <script src="js/tiers.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/voice-manifest.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/mascot.js"></script>
  <script>
    function go(section) { playChime(); goTo(section); }

    const profile = getActiveProfile();
    if (profile) {
      document.getElementById('childAvatar').textContent = profile.avatar;
      const t = tierForAge(getAgeMonths(profile.birthday));
      document.getElementById('greeting').textContent =
        t <= 2 ? `Hi ${profile.name}! Let's play! 👋`
               : `Hi ${profile.name}! 👋`;
      document.getElementById('screen').style.background =
        `linear-gradient(160deg, ${profile.color} 0%, ${profile.color}88 100%)`;
      // Mascot welcomes the child (once per day per profile)
      if (window.mascot) setTimeout(() => mascot.play('welcome'), 600);
    } else {
      goProfiles();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
