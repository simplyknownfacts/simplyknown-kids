  <link rel="stylesheet" href="css/achievements.css">
  <style>
    /* ============================================================
       Hub World home screen. Ported from redesign-hub-mock.html v3
       (Scott's approved prototype, "i like v1") — the cover-fit math and
       hotspot mechanism are reused VERBATIM. What changed for production:
       hotspots really navigate, Watch/Listen respect online + Yoto-
       connected state the way the old tile grid did, and the fox landmark
       ("You") is now the real ribbons/achievements entry point instead of
       a decorative toast — see the build() comment below for why.

       2026-09-01, first real hands-on pass by Scott (not automated
       clicks): the earlier "verified" claim on this screen missed real
       usability problems that only showed up when an actual person tried
       it. Two fixed here — see the comments at each site for the full
       story: (1) the independently-bobbing bands tore visible seams
       through bridges/paths ("even worse" than static) — REMOVED, the
       image is one seamless static picture again; (2) the hidden-
       scrollbar horizontal scroll was undiscoverable, especially with a
       mouse — added visible edge-hint chevrons + pointer-drag-to-scroll.
       Still open, NOT attempted here: the child's own mascot (js/mascot.js,
       bottom-left) never replaces or joins the fox painted into the
       picture — two disconnected characters instead of one. Real
       element-level "alive" (fox waving, vines swinging, curtains
       rippling) needs individually generated/composited layers, i.e. the
       Phase 3b rebuild, not a CSS trick on v1's flat art.
       ============================================================ */
    /* horizontal SCROLL, not clip: this v1 art is a wide/landscape island
       (1376x768) and phones are tall/narrow — cover-fitting it to a phone's
       HEIGHT (so there's no letterboxing) renders the image much wider than
       the screen, the same way it would on any "cover" background. Cropping
       that overflow (the old approach) silently pushed Games clean off the
       left edge and Watch/Art off the right on a real phone — reachable in
       automated clicks only because a test runner force-scrolls to a target,
       which a child's finger cannot do to a clipped, non-scrolling box. This
       screen scrolls horizontally instead (chrome stays fixed, doesn't
       scroll with it — see .greeting/.avatar-pill/.exit-btn below), starting
       centered so the default view is unchanged; a swipe reaches the rest.
       Every fx/fy hotspot fraction and the cover-fit scale math are still
       exactly the prototype's — only how the overflow is handled changed. */
    .home-screen {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; -ms-overflow-style: none;
      background: #cfd9e8;
    }
    .home-screen::-webkit-scrollbar { display: none; height: 0; width: 0; }
    .home-screen.dragging { cursor: grabbing; }

    /* Real bug, found by Scott hands-on 2026-09-01: hiding the scrollbar (by
       design, for a clean full-bleed world) left NOTHING on screen hinting
       that Games/Watch/Art exist off to the sides -- "super zoomed in, i
       can only see the middle path." A hidden scrollbar with no other cue
       is undiscoverable, especially for a mouse user (no swipe gesture to
       stumble onto). Two fixes: a soft edge fade + bouncing chevron on
       whichever side still has unseen content (toggled in JS as the real
       scroll position changes), and pointer-drag-to-scroll so a mouse
       click-and-drag works the same as a finger swipe. */
    .scroll-hint {
      position: fixed; top: 0; bottom: 0; width: 64px; z-index: 40;
      pointer-events: none; opacity: 0; transition: opacity 220ms ease;
      display: flex; align-items: center; font-size: 28px;
    }
    .scroll-hint.show { opacity: 1; }
    .scroll-hint.left  { left: 0; justify-content: flex-start; padding-left: 8px; background: linear-gradient(to right, rgba(20,15,10,0.22), transparent); }
    .scroll-hint.right { right: 0; justify-content: flex-end;  padding-right: 8px; background: linear-gradient(to left,  rgba(20,15,10,0.22), transparent); }
    .scroll-hint span {
      display: inline-block; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      animation: hintBounce 1.4s ease-in-out infinite;
    }
    .scroll-hint.left span  { animation-name: hintBounceLeft; }
    @keyframes hintBounce     { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    @keyframes hintBounceLeft { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-8px); } }
    @media (prefers-reduced-motion: reduce) { .scroll-hint span { animation: none; } }

    /* Each .band is a clipped "window" onto its own slice of the SAME
       source image, sized/positioned in JS to match the real cover-fit
       rect (see layout() below) so it always lines up with the picture
       regardless of window size. Bands exist for hotspot placement and
       horizontal-scroll layout ONLY now -- see the removed-motion note
       below for why they never bob independently. */
    .band { position: absolute; overflow: hidden; opacity: 0; }
    .band.ready {
      animation: bandIn 900ms cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes bandIn { to { opacity: 1; } }
    .band img { position: absolute; top: 0; display: block; max-width: none; }
    /* Codex 0902-4: a soft sky instead of a flat rectangle if the picture
       never loads -- landmarks (still positioned, still tappable) at least
       sit on something that looks like part of the same world. */
    .band.band-fallback { background: linear-gradient(180deg, #FFE7C2 0%, #CFE1F5 55%, #cfd9e8 100%); }
    .band.band-fallback img { display: none; }

    /* REMOVED 2026-09-01, found live by Scott: each band bobbing on its own
       cut the ONE continuous photo into visibly independent tiles -- a
       bridge (or path, or roofline) crossing a seam tore into two halves
       moving out of phase with each other. "Even worse" than static, his
       words, and he's right: a torn seam reads as broken, not alive. There
       is no cheap fix for this with a single flat image -- the whole point
       of a seam-free scene is that nothing in it can move independently of
       its neighbors. Real "alive" (the fox waving, vines swinging, window
       lights flickering, curtains rippling, notes drifting) needs each of
       those things generated and composited as its OWN separate layer, not
       a crop of one photo -- that's the Phase 3b layered-art rebuild, not a
       CSS trick on top of v1's flat art. Shipping a stable, seamless static
       scene now beats shipping a torn one while that lands. */

    /* ---------- greeting + chrome, sitting IN the world ---------- */
    /* fixed, not absolute: .home-screen now scrolls horizontally (see above),
       and chrome must stay put on screen while the world pans underneath it. */
    .greeting {
      position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 24px; z-index: 20;
      color: #4a2e12; text-shadow: 0 2px 10px rgba(255,255,255,0.55), 0 1px 2px rgba(255,255,255,0.8);
      opacity: 0; animation: fadeDown 700ms ease 300ms both;
      max-width: 70vw;
    }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .greeting .hand { font-family: var(--font-hand); font-size: 24px; display: block; }
    .greeting .where { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: clamp(26px, 4.5vw, 38px); display: block; }

    .avatar-pill {
      position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: calc(16px + env(safe-area-inset-right)); z-index: 50;
      display: flex; align-items: center; gap: 10px; border: none; cursor: pointer; font-family: inherit; text-align: left;
      padding: 8px 16px 8px 8px; border-radius: 999px;
      background: rgba(255,255,255,0.5); backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      opacity: 0; animation: fadeDown 700ms ease 900ms both;
    }
    .avatar-pill .pill-avatar { width: 40px; height: 40px; border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: radial-gradient(circle at 35% 35%, #fff, #FFC56B); }
    .avatar-pill .pill-name  { font-size: 13px; font-weight: 800; color: #4a2e12; display: block; }
    .avatar-pill .pill-age   { font-size: 10.5px; color: #7a5a30; display: block; }

    /* Bottom-RIGHT, stacked above the avatar pill — NOT bottom-left like the
       standalone prototype had it. The prototype never had to share the
       screen with js/mascot.js's own fixed #mascotWrap widget (bottom:16px;
       left:16px — see css/style.css / js/mascot.js), which every real page
       loads. Bottom-left here would sit exactly on top of the mascot. */
    .exit-btn {
      position: fixed; bottom: calc(82px + env(safe-area-inset-bottom)); right: calc(16px + env(safe-area-inset-right)); z-index: 50;
      width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; font-size: 18px;
      background: rgba(255,255,255,0.5); backdrop-filter: blur(8px); box-shadow: 0 6px 16px rgba(0,0,0,0.16);
      opacity: 0; animation: fadeDown 700ms ease 900ms both;
    }

    /* ---------- tap zones (children of a .band, positioned as % of the
       band's OWN box — always correct because the band itself is sized
       from the real rendered-image rect, recomputed on resize) ------- */
    .spot {
      position: absolute; z-index: 15;
      border: none; background: transparent; cursor: pointer; padding: 0;
      transform: translate(-50%, -50%);
    }
    .spot .ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 0 rgba(255,224,140,0.0); transition: box-shadow 200ms ease; }
    .spot:hover .ring, .spot.tapped .ring { box-shadow: 0 0 0 10px rgba(255,224,140,0.35), 0 0 40px 14px rgba(255,200,90,0.45); }
    .spot .glow {
      position: absolute; inset: -18%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,235,180,0.0) 55%, rgba(255,235,180,0.0) 100%);
      transition: background 220ms ease; pointer-events: none;
    }
    .spot:hover .glow, .spot.tapped .glow {
      background: radial-gradient(circle, rgba(255,235,180,0.55) 0%, rgba(255,235,180,0.0) 72%);
      animation: glowPulse 1.1s ease-in-out infinite;
    }
    @keyframes glowPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.75; } }
    .spot .label {
      position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%) translateY(-6px);
      white-space: nowrap; padding: 6px 14px; border-radius: 999px;
      background: rgba(20,15,10,0.82); color: #FFF1C8; font-weight: 800; font-size: 14px;
      opacity: 0; pointer-events: none; transition: opacity 160ms ease, transform 160ms ease;
    }
    .spot:hover .label, .spot.tapped .label { opacity: 1; transform: translateX(-50%) translateY(-12px); }

    /* Watch/Listening Hut need the internet — dim + nudge instead of
       navigating into a dead screen a toddler would tap and melt down
       over (same behavior the old tile grid had for these two tiles). */
    .spot.needs-wifi { filter: grayscale(0.85); opacity: 0.55; }
    .spot.nudge { animation: netNudge 0.3s ease; }
    @keyframes netNudge { 50% { opacity: 0.3; } }

    @media (prefers-reduced-motion: reduce) {
      .band { animation-name: bandIn !important; opacity: 1 !important; }
      .greeting, .avatar-pill, .exit-btn { animation: none !important; opacity: 1 !important; }
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="screen home-screen" id="screen">
    <!-- 3 bands (island slices) are built + positioned entirely in JS,
         from the real rendered-image rect — see buildHub() below. -->

    <div class="greeting">
      <span class="hand" id="hiText">Hi ✦</span>
      <span class="where">Where shall we go?</span>
    </div>

    <button type="button" class="avatar-pill" id="avatarPill" onclick="goProfiles()" aria-label="Switch child" title="Switch child">
      <span class="pill-avatar" id="pillAvatar">🦊</span>
      <span>
        <span class="pill-name" id="pillName">—</span>
        <span class="pill-age" id="pillAge">—</span>
      </span>
    </button>
    <button type="button" id="exitBtn" class="exit-btn" onclick="exitApp()" aria-label="Exit app" title="Exit app">🚪</button>
  </div>
  <div class="scroll-hint left" id="hintLeft" aria-hidden="true"><span>‹</span></div>
  <div class="scroll-hint right" id="hintRight" aria-hidden="true"><span>›</span></div>

  <script src="js/atmosphere.js"></script>
  <script src="js/tiers.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/voice-manifest.js"></script>

  <script src="js/pin-lockout.js"></script>
  <script src="js/sync.js"></script>

  <script src="js/yoto-config.js"></script>
  <script src="js/yoto.js"></script>
  <script src="js/sleep-timer.js"></script>
  <script src="js/yoto-player.js"></script>
  <script src="js/achievement-defs.js"></script>
  <script src="js/achievement-logic.js"></script>

  <script src="js/celebrate.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/shelf.js"></script>
  <script>
    const IMG_SRC = 'redesign-hub-bg.jpg';
    // Tuned to the APPROVED v1 image (1376x768) — Scott's verdict on the v1-vs-v2
    // comparison was "i like v1". If a sharper v1-matching regen ever lands, only
    // these two constants + the fx/fy table in buildHub() need to change.
    const NATURAL_W = 1376, NATURAL_H = 768;

    // Watch (YouTube) + Listen (Yoto) need the internet. On a plane / offline,
    // dim the landmark to "Needs wifi" and don't navigate into a dead screen a
    // toddler would tap and melt down over. Updates live on reconnect. (Same
    // behavior the old tile grid had — ported here 1:1.)
    function updateOnlineSpots() {
      const off = !navigator.onLine;
      document.querySelectorAll('.spot[data-net="1"]').forEach((el) => {
        el.classList.toggle('needs-wifi', off);
        el.setAttribute('aria-disabled', off ? 'true' : 'false');
        const label = el.querySelector('.label');
        if (!label) return;
        if (off) {
          if (!label.dataset.orig) label.dataset.orig = label.textContent;
          label.textContent = 'Needs wifi';
        } else if (label.dataset.orig) {
          label.textContent = label.dataset.orig;
          delete label.dataset.orig;
        }
      });
    }
    window.addEventListener('online', updateOnlineSpots);
    window.addEventListener('offline', updateOnlineSpots);

    // Builds the fox hub world: the approved image sliced into 3 bands for
    // hotspot placement and horizontal scroll layout (see layout() below).
    // Bands no longer bob independently -- see the CSS "REMOVED" note above
    // for why (it tore the seams between them). Cover-fit math is reused
    // verbatim from redesign-hub-mock.html v3 — only the spot table below and
    // the click behavior are new (real navigation instead of a demo toast).
    function buildHub() {
      // Listening Hut only appears once a parent has connected Yoto — exactly
      // the same gate the old "Listening Hut" tile used (display:none until
      // yoto.isConnected()).
      const listenUnlocked = !!(window.yoto && yoto.isConfigured() && yoto.isConnected());

      const BANDS = [
        {
          x0: 0, x1: 0.28,
          spots: [
            { id: 'games', label: 'Games', route: 'games/index.html', net: false, fx: 0.18, fy: 0.39 },
          ],
        },
        {
          x0: 0.28, x1: 0.63,
          spots: [
            { id: 'learn', label: 'Learn', route: 'learning/index.html', net: false, fx: 0.35, fy: 0.23 },
            ...(listenUnlocked ? [{ id: 'listen', label: 'Listening Hut', route: 'listen/index.html', net: true, fx: 0.56, fy: 0.34 }] : []),
            // The fox itself. In the approved prototype this spot was a
            // decorative "that's your fox!" toast with no destination — the
            // one landmark not mapped to a section. Repurposed here as the
            // real ribbons/achievements entry point (Hard Requirement 3:
            // shelf access must stay reachable FROM the world, repositioned
            // "per the prototype's approach" — this IS the prototype's own
            // extra landmark, now doing a real job instead of a no-op).
            { id: 'ribbons', label: 'My Ribbons', route: 'achievements.html', net: false, fx: 0.49, fy: 0.60 },
          ],
        },
        {
          x0: 0.63, x1: 1.0,
          spots: [
            { id: 'watch', label: 'Watch', route: 'videos/index.html', net: true, fx: 0.70, fy: 0.23 },
            { id: 'art', label: 'Art', route: 'art/index.html', net: false, fx: 0.84, fy: 0.42 },
          ],
        },
      ];

      const worldEl = document.getElementById('screen');
      const bandEls = [];

      function activate(spotEl, s) {
        if (s.net && !navigator.onLine) {
          playChime();
          spotEl.classList.remove('nudge');
          void spotEl.offsetWidth;
          spotEl.classList.add('nudge');
          return;
        }
        playChime();
        spotEl.classList.add('tapped');
        setTimeout(() => goTo(s.route), 160);
      }

      function build() {
        BANDS.forEach((band, i) => {
          const el = document.createElement('div');
          el.className = 'band';
          el.style.animationDelay = (i * 120) + 'ms';

          const img = document.createElement('img');
          // Codex 0902-4: with no onerror, a hub background that failed to
          // precache (or a transient network blip online) left a blank
          // rectangle -- no picture, no explanation, landmarks invisible
          // even though they were still technically there and tappable.
          img.onerror = () => el.classList.add('band-fallback');
          img.src = IMG_SRC;
          img.alt = '';
          el.appendChild(img);

          band.spots.forEach((s) => {
            const localX = (s.fx - band.x0) / (band.x1 - band.x0);
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'spot';
            btn.dataset.id = s.id;
            if (s.net) btn.dataset.net = '1';
            btn.style.left = (localX * 100) + '%';
            btn.style.top = (s.fy * 100) + '%';
            // Hit-box scales with the rendered image so it stays landmark-sized
            // at any window width, instead of a fixed px box that's too small
            // on a big screen or too big on a small one.
            btn.style.width = '13vmax';
            btn.style.height = '18vmax';
            btn.setAttribute('aria-label', s.label);
            btn.innerHTML =
              '<span class="glow"></span>' +
              '<span class="ring"></span>' +
              '<span class="label">' + s.label + '</span>';
            btn.addEventListener('click', () => activate(btn, s));
            el.appendChild(btn);
          });

          worldEl.insertBefore(el, worldEl.firstChild); // bands go behind the greeting/pill/exit chrome
          bandEls.push(el);
        });
        requestAnimationFrame(layout);
        // Stagger the entrance-in class so bands weren't already mid-bob before they fade in.
        requestAnimationFrame(() => bandEls.forEach((el) => el.classList.add('ready')));
        updateOnlineSpots();
      }

      // Replicates object-fit:cover's math by hand so every band + every
      // hotspot is positioned from the image's REAL rendered rect, not a
      // viewport percentage that silently drifts once the crop changes at a
      // different aspect ratio (the resize bug the v2 prototype round fixed).
      //
      // Bands are laid out left-to-right starting at the image's own x=0 —
      // NOT centered with a negative offset — because .home-screen is now
      // the horizontal scroll container (see its CSS above): scrollLeft can
      // only range from 0 to (content width - viewport width), so the
      // content itself has to start at 0 for that range to reach every
      // landmark. The view is then centered by SETTING scrollLeft below,
      // which looks identical to the old crop-centering by default — a kid
      // can swipe from there to reach whatever the phone-width crop hides.
      function layout() {
        const cw = window.innerWidth, ch = window.innerHeight;
        const scale = Math.max(cw / NATURAL_W, ch / NATURAL_H);
        const renderedW = NATURAL_W * scale, renderedH = NATURAL_H * scale;
        const offsetY = (ch - renderedH) / 2;

        BANDS.forEach((band, i) => {
          const el = bandEls[i];
          const bandW = (band.x1 - band.x0) * renderedW;
          el.style.left = (band.x0 * renderedW) + 'px';
          el.style.top = offsetY + 'px';
          el.style.width = bandW + 'px';
          el.style.height = renderedH + 'px';
          const img = el.querySelector('img');
          img.style.width = renderedW + 'px';
          img.style.height = renderedH + 'px';
          img.style.left = (-band.x0 * renderedW) + 'px';
        });

        worldEl.scrollLeft = Math.max(0, (renderedW - cw) / 2);
        updateHints();
      }

      // Show a chevron on whichever side still has unseen content; hide it
      // once scrolled all the way there. 4px tolerance for sub-pixel scroll
      // positions some browsers report.
      const hintLeft = document.getElementById('hintLeft');
      const hintRight = document.getElementById('hintRight');
      function updateHints() {
        hintLeft.classList.toggle('show', worldEl.scrollLeft > 4);
        hintRight.classList.toggle('show', worldEl.scrollLeft < worldEl.scrollWidth - worldEl.clientWidth - 4);
      }
      worldEl.addEventListener('scroll', updateHints);

      // Pointer-drag-to-scroll: a finger swipe already scrolls this
      // (overflow-x:auto + -webkit-overflow-scrolling:touch), but a MOUSE
      // click-and-drag does not by default -- found live 2026-09-01, the
      // hidden scrollbar left desktop users with no way to discover or
      // reach the off-screen landmarks at all.
      //
      // FIXED 2026-09-02 (Codex finding #6, MED, confirmed by a real
      // regression: tests/verify-drive.mjs's hub-nav-* checks -- a plain
      // click on a landmark -- started failing the moment this patch
      // landed). Starting drag-tracking on ANY pointerdown, including one
      // that began on a landmark/button, let a normal click's own tiny
      // pointer jitter cross the 4px threshold and have the capture-phase
      // click handler below swallow the click before the landmark's own
      // handler ever saw it. Fix: never start tracking a drag if the
      // pointer went down on an interactive element -- a real click there
      // behaves exactly like a click, full stop. Also guards
      // setPointerCapture (can throw) and resets state if capture is lost
      // out from under it (e.g. the OS shows a context menu mid-drag).
      let dragging = false, dragStartX = 0, dragStartScroll = 0, dragMoved = false;
      worldEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') return; // native touch-scroll handles this
        if (e.target.closest('.spot, button, a, [role="button"]')) return; // let it click, don't touch drag state
        dragging = true; dragMoved = false;
        dragStartX = e.clientX; dragStartScroll = worldEl.scrollLeft;
        worldEl.classList.add('dragging');
        try { worldEl.setPointerCapture(e.pointerId); } catch { /* not capturable right now -- scroll still works via native drag */ }
      });
      worldEl.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - dragStartX;
        if (Math.abs(dx) > 4) dragMoved = true;
        worldEl.scrollLeft = dragStartScroll - dx;
      });
      function endDrag() { dragging = false; worldEl.classList.remove('dragging'); }
      worldEl.addEventListener('pointerup', endDrag);
      worldEl.addEventListener('pointercancel', endDrag);
      worldEl.addEventListener('lostpointercapture', endDrag);
      // A drag that actually moved the world must not also fire the
      // landmark it started or ended on -- capture-phase so it runs before
      // any .spot's own click handler. Never reaches here for a click that
      // started on a .spot/button/a, per the pointerdown guard above.
      worldEl.addEventListener('click', (e) => { if (dragMoved) { e.stopPropagation(); dragMoved = false; } }, true);

      window.addEventListener('resize', layout);
      build();
    }

    async function _sha256Hex(s) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    async function _checkPin(entry) {
      const stored = localStorage.getItem('vb_pin');
      if (!stored) return true;
      try {
        const obj = JSON.parse(stored);
        if (obj.hash && obj.salt) return (await _sha256Hex(obj.salt + ':' + entry)) === obj.hash;
      } catch {}
      return stored === entry;
    }
    function exitApp() {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
      let entry = '';
      let lockoutTimer = null;
      function dots() {
        return Array.from({length:4}, (_,i)=>`<div style="width:14px;height:14px;border-radius:50%;background:${i<entry.length?'var(--accent)':'rgba(255,255,255,0.2)'};"></div>`).join('');
      }
      function keys() {
        return [1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k==='' ? '<div></div>' :
          `<button data-k="${k}" style="aspect-ratio:1;border-radius:50%;font-size:22px;font-weight:900;color:white;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);cursor:pointer;font-family:var(--font-ui);">${k}</button>`
        ).join('');
      }
      // Codex 0825-9: this dialog used to have NO lockout at all -- a kid
      // locked out of parent/settings.html's PIN gate could just walk over to
      // the exit button and keep guessing there instead. js/pin-lockout.js
      // (shared with settings) makes both doors count against ONE counter.
      function refreshLockout() {
        const msg = overlay.querySelector('#exitMsg');
        const pad = overlay.querySelector('#exitKeys');
        if (!msg || !pad) return false;
        if (lockoutTimer) { clearInterval(lockoutTimer); lockoutTimer = null; }
        // Codex 0905-1, HIGH: this used to treat a missing lockout module the
        // same as "not locked" and re-enable the keypad -- unlimited PIN
        // guesses. Fail CLOSED instead: with no module there is no way to
        // count or cap attempts, so block the pad with a plain explanation.
        if (!window.vbPinLockout) {
          msg.textContent = 'Needs a connection — reload once online to unlock.';
          pad.style.pointerEvents = 'none'; pad.style.opacity = '0.35';
          return true;
        }
        if (!vbPinLockout.isLocked()) {
          pad.style.pointerEvents = ''; pad.style.opacity = '';
          return false;
        }
        const tick = () => {
          const remain = vbPinLockout.remainingSec();
          if (remain <= 0) {
            clearInterval(lockoutTimer); lockoutTimer = null;
            msg.textContent = '';
            pad.style.pointerEvents = ''; pad.style.opacity = '';
            return;
          }
          const m = Math.floor(remain / 60), s = remain % 60;
          msg.textContent = `Locked — try again in ${m}:${String(s).padStart(2,'0')}`;
        };
        tick();
        lockoutTimer = setInterval(tick, 1000);
        pad.style.pointerEvents = 'none'; pad.style.opacity = '0.35';
        return true;
      }
      function render() {
        overlay.innerHTML = `
          <div style="background:#1a1a2e;border-radius:18px;padding:24px;max-width:340px;width:100%;color:white;text-align:center;font-family:var(--font-ui);">
            <h2 style="margin:0 0 6px;font-family:var(--font-display);font-style:italic;font-weight:500;">🚪 Close App</h2>
            <div style="color:rgba(255,255,255,0.6);font-size:14px;margin-bottom:12px;">Enter PIN to exit</div>
            <div id="exitDots" style="display:flex;gap:10px;justify-content:center;margin:10px 0 14px;">${dots()}</div>
            <div id="exitMsg" style="color:#FF6B6B;font-size:13px;min-height:18px;margin-bottom:8px;"></div>
            <div id="exitKeys" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;">${keys()}</div>
            <button id="exitCancel" style="margin-top:14px;width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2);font-weight:800;cursor:pointer;font-family:var(--font-ui);">Cancel</button>
          </div>`;
        overlay.querySelectorAll('button[data-k]').forEach(b => {
          b.onclick = async () => {
            // Codex 0905-1: fail CLOSED when the module is missing too --
            // pad is dimmed/inert via refreshLockout() above, but guard the
            // handler itself in case a click still lands.
            if (!window.vbPinLockout || vbPinLockout.isLocked()) return;
            const k = b.dataset.k;
            if (k === '⌫') entry = entry.slice(0, -1);
            else if (entry.length < 4) entry += k;
            overlay.querySelector('#exitDots').innerHTML = dots();
            if (entry.length === 4) {
              if (await _checkPin(entry)) {
                if (window.vbPinLockout) vbPinLockout.clearLockout();
                // An installed app can't truly self-close (window.close only works
                // on script-opened windows). Jumping to about:blank left a dead
                // black screen. Try close, then show a friendly goodbye instead.
                try { window.close(); } catch {}
                overlay.innerHTML = `
                  <div style="background:#1a1a2e;border-radius:18px;padding:32px 24px;max-width:340px;width:100%;color:white;text-align:center;font-family:var(--font-ui);">
                    <div style="font-size:54px;line-height:1;margin-bottom:10px;">👋</div>
                    <h2 style="margin:0 0 8px;font-family:var(--font-display);font-style:italic;font-weight:500;">All done!</h2>
                    <div style="color:rgba(255,255,255,0.7);font-size:14px;line-height:1.5;margin-bottom:18px;">You can close the app now — swipe it away or press the home button.</div>
                    <button id="exitBack" style="width:100%;padding:13px;border-radius:12px;background:var(--accent,#4ECDC4);color:#10243f;border:none;font-weight:800;font-size:16px;cursor:pointer;font-family:var(--font-ui);">Back to app</button>
                  </div>`;
                overlay.querySelector('#exitBack').onclick = () => overlay.remove();
              } else {
                entry = '';
                setTimeout(() => overlay.querySelector('#exitDots').innerHTML = dots(), 250);
                const nowLocked = window.vbPinLockout ? vbPinLockout.recordFailedAttempt().lockedUntil > Date.now() : false;
                if (nowLocked) { refreshLockout(); }
                else { overlay.querySelector('#exitMsg').textContent = 'Wrong PIN'; }
              }
            }
          };
        });
        overlay.querySelector('#exitCancel').onclick = () => {
          if (lockoutTimer) { clearInterval(lockoutTimer); lockoutTimer = null; }
          overlay.remove();
        };
      }
      render();
      refreshLockout();
      document.body.appendChild(overlay);
    }

    const profile = getActiveProfile();
    if (profile) {
      buildHub();

      // Avatar pill
      document.getElementById('pillAvatar').textContent = mascotEmoji(profile);
      document.getElementById('pillAvatar').style.background =
        `radial-gradient(circle at 35% 35%, #fff8, ${profile.color}cc)`;
      document.getElementById('pillAvatar').style.boxShadow =
        `0 4px 12px ${profile.color}66`;
      document.getElementById('pillName').textContent = profile.name;
      const ageMonths = getAgeMonths(profile.birthday);
      document.getElementById('pillAge').textContent = ageMonths < 24
        ? ageMonths + ' months'
        : Math.floor(ageMonths / 12) + ' yrs ' + (ageMonths % 12) + 'mo';

      // Time-of-day greeting
      const tod = document.documentElement.getAttribute('data-tod') || 'night';
      const greet = {
        morning:   'Good morning',
        afternoon: 'Hi',
        evening:   'Good evening',
        night:     'Hi',
      }[tod];
      document.getElementById('hiText').textContent = greet + ' ' + profile.name + ' ✦';

      const greetText = 'Hi ' + profile.name + '! Welcome to your play space.';
      // Only speak the greeting if we have a pre-generated ElevenLabs clip for
      // this kid's name. Without it, _voiceSpeak() falls back to robotic
      // browser TTS — better to play just the mascot animation in silence than
      // to break the curated-voice experience. To add a name: edit
      // js/voice-manifest.js KID_NAMES and re-run scripts/generate-voices.mjs.
      const hasGreetingClip = typeof VOICE_MANIFEST !== 'undefined'
        && VOICE_MANIFEST.phraseHash
        && VOICE_MANIFEST.phraseHash[greetText] !== undefined;

      // Purchased name-voice ("~10¢ real voice" at add-kid): greeting clips for
      // names outside the static KID_NAMES set live on the sync Worker. Play
      // the welcome phrase (i=2) from there, caching it into vb-offline so it
      // keeps working on a plane.
      const dynGreetUrl = (!hasGreetingClip && profile.nameVoice && typeof SYNC_BASE !== 'undefined')
        ? SYNC_BASE + '/voice-clip?name=' + encodeURIComponent(profile.name) + '&voice=' + (profile.voice || 'woman') + '&i=2'
        : null;
      async function playDynGreet() {
        try {
          let resp = null;
          try { const c = await caches.open('vb-offline'); resp = await c.match(dynGreetUrl); } catch (e) {}
          if (!resp) {
            resp = await fetch(dynGreetUrl);
            if (!resp || !resp.ok) return;
            try { const c = await caches.open('vb-offline'); await c.put(dynGreetUrl, resp.clone()); } catch (e) {}
          }
          const a = new Audio(URL.createObjectURL(await resp.blob()));
          a.play().catch((e) => { if (e && e.name === 'NotAllowedError') window._vbAudioBlocked = true; });
        } catch (e) {}
      }
      if (window.mascot) {
        setTimeout(() => {
          mascot.play('welcome', { muted: true });
          if (hasGreetingClip) setTimeout(() => speak(greetText), 250);
          else if (dynGreetUrl) setTimeout(playDynGreet, 250);
        }, 600);
      } else if (hasGreetingClip) {
        setTimeout(() => speak(greetText), 600);
      } else if (dynGreetUrl) {
        setTimeout(playDynGreet, 600);
      }
      // Phones block un-gestured audio, so the load-time greeting above can be
      // silently rejected ("can't hear the mascot"). And kids whose NAME has no
      // clip anywhere (static or purchased) would stay silent forever. On the
      // kid's FIRST tap anywhere: named kids replay their greeting if it was
      // blocked; clip-less kids get the mascot's OWN recorded voice (generic
      // welcome, unmuted video) so every kid hears their companion.
      document.addEventListener('pointerdown', () => {
        if (hasGreetingClip && window._vbAudioBlocked) {
          window._vbAudioBlocked = false;
          if (window.mascot) mascot.play('welcome', { muted: true });
          speak(greetText);
        } else if (dynGreetUrl && window._vbAudioBlocked) {
          window._vbAudioBlocked = false;
          if (window.mascot) mascot.play('welcome', { muted: true });
          playDynGreet();
        } else if (!hasGreetingClip && !dynGreetUrl && window.mascot) {
          mascot.play('welcome', { muted: false });
        }
      }, { once: true, capture: true });
    } else {
      goProfiles();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
    }
  </script>
</body>
</html>
