<body class="world-home">
  <div class="world-shell" id="screen">

      </div>
    </header>
    <main class="world-main">
      <div class="world-greeting"><h1 id="hiText">A little world of wonder.</h1><p>Pick a house. Find an adventure.</p></div>
      <nav class="world-scene" id="worldScene" aria-label="Activity worlds">
        <div class="world-cloud cloud-one" aria-hidden="true"></div><div class="world-cloud cloud-two" aria-hidden="true"></div>
        <div class="world-island" aria-hidden="true"></div>
        <svg class="world-paths" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><path id="pathShadow" class="path-shadow" fill="none" stroke-linecap="round"/><path id="worldPath" class="path" fill="none" stroke-linecap="round"/><path id="pathDash" class="path-dash" fill="none" stroke-linecap="round"/></svg>
        <div class="world-tree" aria-hidden="true"></div><div class="world-tree tree-right" aria-hidden="true"></div><div class="world-tree tree-top" aria-hidden="true"></div>
        <div class="world-flower" style="left:43%;top:84%" aria-hidden="true"></div><div class="world-flower" style="left:65%;top:43%" aria-hidden="true"></div><div class="world-flower" style="left:10%;top:60%" aria-hidden="true"></div>
        <div class="world-butterfly" aria-hidden="true"></div>
        <button class="house house-games" type="button" data-world="games" aria-label="Games"><span class="house-art"></span><span class="house-label">Games</span><span class="house-caption">Little challenges. Big smiles.</span></button>
        <button class="house house-learn" type="button" data-world="learn" aria-label="Learn"><span class="house-art"></span><span class="house-label">Learn</span><span class="house-caption">A new discovery awaits.</span></button>
        <button class="house house-artworld" type="button" data-world="art" aria-label="Art"><span class="house-art"></span><span class="house-label">Art</span><span class="house-caption">Make something wonderful.</span></button>
        <button class="house house-watch" type="button" data-world="watch" aria-label="Watch"><span class="house-art"></span><span class="house-label">Watch</span><span class="house-caption">A little movie magic.</span></button>
        <button class="house house-listen" type="button" data-world="listen" aria-label="Listening Hut"><span class="house-art"></span><span class="house-label">Listen</span><span class="house-caption">Stories for curious ears.</span></button>
        <div class="world-companion" id="worldCompanion" data-world-companion aria-hidden="true"><span class="companion-shadow"></span><span class="companion-fallback" id="companionFallback">🐾</span><span class="companion-bubble" id="companionBubble">Let's explore!</span></div>
      </nav>
    </main>
    <footer class="world-footer">
      <button type="button" class="ribbon-link" id="ribbonLink"><svg viewBox="0 0 24 30" aria-hidden="true"><path d="M5 17L3 29l9-5 9 5-2-12" fill="#e99b73"/><circle cx="12" cy="11" r="10" fill="#f6cb74" stroke="#d9a85d" stroke-width="2"/><path d="M12 4l2 4 5 1-4 3 1 5-4-2-4 2 1-5-4-3 5-1z" fill="#fff5d9"/></svg>My ribbons</button>
      <button type="button" class="world-hello" id="helloCompanion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 8a6 6 0 010 8m3-11a10 10 0 010 14"/></svg><span>Say hello to your buddy</span></button>

  <script>
    async function _sha256Hex(s) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    async function _checkPin(entry) {
      const stored = localStorage.getItem('vb_pin');
      if (!stored) return true;
      try {
        const obj = JSON.parse(stored);
        if (obj.hash && obj.salt) return (await _sha256Hex(obj.salt + ':' + entry)) === obj.hash;
      } catch {}
      return stored === entry;
    }
    function exitApp() {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
      let entry = '';
      let lockoutTimer = null;
      function dots() {
        return Array.from({length:4}, (_,i)=>`<div style="width:14px;height:14px;border-radius:50%;background:${i<entry.length?'var(--accent)':'rgba(255,255,255,0.2)'};"></div>`).join('');
      }
      function keys() {
        return [1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k==='' ? '<div></div>' :
          `<button data-k="${k}" style="aspect-ratio:1;border-radius:50%;font-size:22px;font-weight:900;color:white;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);cursor:pointer;font-family:var(--font-ui);">${k}</button>`
        ).join('');
      }
      // Codex 0825-9: this dialog used to have NO lockout at all -- a kid
      // locked out of parent/settings.html's PIN gate could just walk over to
      // the exit button and keep guessing there instead. js/pin-lockout.js
      // (shared with settings) makes both doors count against ONE counter.
      function refreshLockout() {
        const msg = overlay.querySelector('#exitMsg');
        const pad = overlay.querySelector('#exitKeys');
        if (!msg || !pad) return false;
        if (lockoutTimer) { clearInterval(lockoutTimer); lockoutTimer = null; }
        // Codex 0905-1, HIGH: this used to treat a missing lockout module the
        // same as "not locked" and re-enable the keypad -- unlimited PIN
        // guesses. Fail CLOSED instead: with no module there is no way to
        // count or cap attempts, so block the pad with a plain explanation.
        if (!window.vbPinLockout) {
          msg.textContent = 'Needs a connection — reload once online to unlock.';
          pad.style.pointerEvents = 'none'; pad.style.opacity = '0.35';
          return true;
        }
        if (!vbPinLockout.isLocked()) {
          pad.style.pointerEvents = ''; pad.style.opacity = '';
          return false;
        }
        const tick = () => {
          const remain = vbPinLockout.remainingSec();
          if (remain <= 0) {
            clearInterval(lockoutTimer); lockoutTimer = null;
            msg.textContent = '';
            pad.style.pointerEvents = ''; pad.style.opacity = '';
            return;
          }
          const m = Math.floor(remain / 60), s = remain % 60;
          msg.textContent = `Locked — try again in ${m}:${String(s).padStart(2,'0')}`;
        };
        tick();
        lockoutTimer = setInterval(tick, 1000);
        pad.style.pointerEvents = 'none'; pad.style.opacity = '0.35';
        return true;
      }
      function render() {
        overlay.innerHTML = `
          <div style="background:#1a1a2e;border-radius:18px;padding:24px;max-width:340px;width:100%;color:white;text-align:center;font-family:var(--font-ui);">
            <h2 style="margin:0 0 6px;font-family:var(--font-display);font-style:italic;font-weight:500;">🚪 Close App</h2>
            <div style="color:rgba(255,255,255,0.6);font-size:14px;margin-bottom:12px;">Enter PIN to exit</div>
            <div id="exitDots" style="display:flex;gap:10px;justify-content:center;margin:10px 0 14px;">${dots()}</div>
            <div id="exitMsg" style="color:#FF6B6B;font-size:13px;min-height:18px;margin-bottom:8px;"></div>
            <div id="exitKeys" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;">${keys()}</div>
            <button id="exitCancel" style="margin-top:14px;width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2);font-weight:800;cursor:pointer;font-family:var(--font-ui);">Cancel</button>
          </div>`;
        overlay.querySelectorAll('button[data-k]').forEach(b => {
          b.onclick = async () => {
            // Codex 0905-1: fail CLOSED when the module is missing too --
            // pad is dimmed/inert via refreshLockout() above, but guard the
            // handler itself in case a click still lands.
            if (!window.vbPinLockout || vbPinLockout.isLocked()) return;
            const k = b.dataset.k;
            if (k === '⌫') entry = entry.slice(0, -1);
            else if (entry.length < 4) entry += k;
            overlay.querySelector('#exitDots').innerHTML = dots();
            if (entry.length === 4) {
              if (await _checkPin(entry)) {
                if (window.vbPinLockout) vbPinLockout.clearLockout();
                // An installed app can't truly self-close (window.close only works
                // on script-opened windows). Jumping to about:blank left a dead
                // black screen. Try close, then show a friendly goodbye instead.
                try { window.close(); } catch {}
                overlay.innerHTML = `
                  <div style="background:#1a1a2e;border-radius:18px;padding:32px 24px;max-width:340px;width:100%;color:white;text-align:center;font-family:var(--font-ui);">
                    <div style="font-size:54px;line-height:1;margin-bottom:10px;">👋</div>
                    <h2 style="margin:0 0 8px;font-family:var(--font-display);font-style:italic;font-weight:500;">All done!</h2>
                    <div style="color:rgba(255,255,255,0.7);font-size:14px;line-height:1.5;margin-bottom:18px;">You can close the app now — swipe it away or press the home button.</div>
                    <button id="exitBack" style="width:100%;padding:13px;border-radius:12px;background:var(--accent,#4ECDC4);color:#10243f;border:none;font-weight:800;font-size:16px;cursor:pointer;font-family:var(--font-ui);">Back to app</button>
                  </div>`;
                overlay.querySelector('#exitBack').onclick = () => overlay.remove();
              } else {
                entry = '';
                setTimeout(() => overlay.querySelector('#exitDots').innerHTML = dots(), 250);
                const nowLocked = window.vbPinLockout ? vbPinLockout.recordFailedAttempt().lockedUntil > Date.now() : false;
                if (nowLocked) { refreshLockout(); }
                else { overlay.querySelector('#exitMsg').textContent = 'Wrong PIN'; }
              }
            }
          };
        });
        overlay.querySelector('#exitCancel').onclick = () => {
          if (lockoutTimer) { clearInterval(lockoutTimer); lockoutTimer = null; }
          overlay.remove();
        };
      }
      render();
      refreshLockout();
      document.body.appendChild(overlay);
    }

  </script>
  <script src="js/world-home.js"></script>
</body>
