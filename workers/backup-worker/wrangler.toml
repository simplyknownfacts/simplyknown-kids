name = "simplyknown-kids-backup"
main = "index.js"
compatibility_date = "2026-07-01"

# No cron here on purpose. The nightly D1 'sync' -> R2 dump is owned by the fleet
# backup-orchestrator (Video Bot repo, cron 22 8 UTC); this Worker's own 08:37
# trigger was folded out when that landed. Confirmed against the live Worker on
# 2026-08-29: its schedule list is empty. Leaving the old [triggers] block here
# meant the next `wrangler deploy` would silently re-add it and we would back up
# twice a night. This Worker now exists only for the manual /run trigger.

# The CLOUD family-sync database (profiles / settings / progress).
[[d1_databases]]
binding = "DB"
database_name = "sync"
database_id = "5306dec6-cab7-43fd-8bbb-9fe25dccfa6d"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "simplyknown-kids-backups"
