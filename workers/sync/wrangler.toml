name = "simplyknown-kids-sync"
main = "src/index.js"
compatibility_date = "2026-05-16"

# CORS / allowed origins for the kids app
[vars]
ALLOWED_ORIGIN = "https://kids.simplyknown.co"

# KV namespace — fill in id after running `npx wrangler kv namespace create SYNC_KV`
[[kv_namespaces]]
binding = "SYNC_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional: Resend API key for v2 email reset. Set with:
#   npx wrangler secret put RESEND_API_KEY
