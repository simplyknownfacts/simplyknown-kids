<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SimplyKnown Kids">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>SimplyKnown Kids</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <style>
    body { background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%); }
    .profiles-row { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
    .add-btn {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 3px dashed rgba(255,255,255,0.25);
      font-size: 32px; color: rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s;
      margin-top: 20px;
    }
    .add-btn:active { background: rgba(255,255,255,0.18); }
    .stars { position: fixed; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas class="stars" id="stars"></canvas>
  <div class="screen">
    <div class="title">✨ Who's Playing? ✨</div>
    <div class="profiles-row" id="profilesRow"></div>
    <div class="add-btn" id="addBtn" title="Add child">＋</div>
    <div class="subtitle" id="parentHint" style="margin-top:32px;font-size:12px;opacity:0.3;">
      Tap ⚙️ to open Parent Settings (PIN required)
    </div>
    <div style="position:fixed;bottom:20px;right:20px;font-size:28px;cursor:pointer;opacity:0.3"
         id="settingsGear">⚙️</div>
  </div>

  <script src="js/tiers.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/voice-manifest.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Starfield background
    const canvas = document.getElementById('stars');
    const sctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    for (let i = 0; i < 120; i++) {
      sctx.beginPath();
      sctx.arc(Math.random() * canvas.width, Math.random() * canvas.height,
               Math.random() * 1.5, 0, Math.PI * 2);
      sctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.6 + 0.1})`;
      sctx.fill();
    }

    // Render profiles
    function renderProfiles() {
      const row = document.getElementById('profilesRow');
      row.innerHTML = '';
      getProfiles().forEach(p => {
        const ageMonths = getAgeMonths(p.birthday);
        const ageLabel = ageMonths < 24
          ? `${ageMonths} months`
          : `${Math.floor(ageMonths / 12)} yrs ${ageMonths % 12}mo`;
        const btn = document.createElement('div');
        btn.className = 'avatar-btn pop-in';
        btn.style.background = `linear-gradient(135deg, ${p.color}, ${p.color}aa)`;
        btn.style.boxShadow = `0 8px 28px ${p.color}55`;
        btn.innerHTML = `
          <span class="emoji">${p.avatar}</span>
          <span class="name">${p.name}</span>
          <span class="age-label">${ageLabel}</span>`;
        btn.addEventListener('click', () => {
          playChime();
          setActiveProfile(p.id);
          goTo('home.html');
        });
        row.appendChild(btn);
      });
    }
    renderProfiles();

    // Add child
    document.getElementById('addBtn').addEventListener('click', () => {
      goTo('parent/settings.html?action=add');
    });

    // Parent settings — single tap, PIN gate handles auth
    document.getElementById('settingsGear').addEventListener('click', () => {
      goTo('parent/settings.html');
    });

    // Seed demo profiles + default video channels if none exist
    if (getProfiles().length === 0) {
      const today = new Date();
      const sub = (mo) => new Date(today.getFullYear(), today.getMonth() - mo, today.getDate())
                            .toISOString().slice(0,10);
      const baby = addProfile({ name: 'Baby', birthday: sub(8),  avatar: '🐣', color: '#c8b8f0' });
      const toddler = addProfile({ name: 'Toddler', birthday: sub(20), avatar: '🐸', color: '#4ECDC4' });
      updateProfile(baby.id, { youtube: [
        { emoji:'🐻', label:'Hey Bear Sensory',   channelId:'UCtf9cFBJkHVAf2qMqF01xYg' },
        { emoji:'🎵', label:'Super Simple Songs', channelId:'UCLsooMJoIpl_7ux2jvdPB-Q' },
      ]});
      updateProfile(toddler.id, { youtube: [
        { emoji:'👩‍🏫', label:'Ms Rachel',          channelId:'UCG2CL6EUjG8TVT1Tpl9nJdg' },
        { emoji:'🐒',  label:'Curious George',    channelId:'UCu7IDy0y-ZA0qaG51wrQY6w' },
        { emoji:'🎵',  label:'Super Simple Songs', channelId:'UCLsooMJoIpl_7ux2jvdPB-Q' },
      ]});
      renderProfiles();
    }

    // YouTube channel seed — self-healing.
    // - First time: applies name-based defaults.
    // - Subsequent loads: merges in any canonical defaults that are missing AND not in
    //   p.youtubeRemoved (parent explicitly deleted = stays gone).
    (function _seedYoutube() {
      const list = getProfiles();
      let changed = false;
      const defaultsByName = {
        Baby: [
          { emoji:'🐻', label:'Hey Bear Sensory',   channelId:'UCtf9cFBJkHVAf2qMqF01xYg' },
          { emoji:'🎵', label:'Super Simple Songs', channelId:'UCLsooMJoIpl_7ux2jvdPB-Q' },
        ],
        Toddler: [
          { emoji:'👩‍🏫', label:'Ms Rachel',          channelId:'UCG2CL6EUjG8TVT1Tpl9nJdg' },
          { emoji:'🐒',  label:'Curious George',    channelId:'UCu7IDy0y-ZA0qaG51wrQY6w' },
          { emoji:'🎵',  label:'Super Simple Songs', channelId:'UCLsooMJoIpl_7ux2jvdPB-Q' },
        ],
      };
      const FALLBACK_DEFAULT = [
        { emoji:'🎵', label:'Super Simple Songs', channelId:'UCLsooMJoIpl_7ux2jvdPB-Q' },
      ];
      for (const p of list) {
        const namedDefaults = defaultsByName[p.name];
        if (!p.youtubeInitialized) {
          p.youtube = namedDefaults || FALLBACK_DEFAULT;
          p.youtubeInitialized = true;
          changed = true;
          continue;
        }
        // Already initialized — heal missing canonical defaults that weren't explicitly removed.
        if (namedDefaults) {
          const removed = new Set(p.youtubeRemoved || []);
          const existing = new Set((p.youtube || []).map(c => c.channelId));
          const missing = namedDefaults.filter(d => !existing.has(d.channelId) && !removed.has(d.channelId));
          if (missing.length) {
            p.youtube = [...(p.youtube || []), ...missing];
            changed = true;
          }
        }
      }
      if (changed) saveProfiles(list);
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
