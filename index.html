<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SimplyKnown Kids">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#08061C">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>SimplyKnown Kids</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Profile picker layout */
    .picker-screen {
      width: 100vw; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 24px 100px;
      gap: 12px;
    }
    .picker-greeting {
      font-family: var(--font-hand);
      font-size: 22px; color: var(--text-soft);
      letter-spacing: 0.5px;
      margin-bottom: 2px; opacity: 0.95;
      text-align: center;
    }
    .picker-title {
      font-family: var(--font-display);
      font-style: italic; font-weight: 600;
      font-size: clamp(34px, 6vw, 56px);
      color: var(--text); letter-spacing: -0.5px;
      margin-bottom: 24px; text-align: center;
    }
    html[data-tod="night"] .picker-title,
    html[data-tod="evening"] .picker-title {
      text-shadow: 0 4px 40px color-mix(in srgb, var(--accent) 35%, transparent),
                   0 0 80px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .profiles-row {
      display: flex; flex-wrap: wrap; gap: 38px 56px;
      justify-content: center; align-items: flex-start;
      margin-top: 20px; margin-bottom: 0;
      padding-bottom: 96px; /* room for name + age label below each lantern */
    }
    .profile-stack {
      display: flex; flex-direction: column; align-items: center;
      animation: vbFloat 4s ease-in-out infinite;
    }
    .profile-stack:nth-child(2n) { animation-duration: 4.6s; animation-delay: -0.6s; }
    .profile-stack:nth-child(3n) { animation-duration: 5.2s; animation-delay: -1.2s; }
    .profile-string {
      width: 1.5px; height: 50px;
      background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--text) 35%, transparent));
      margin-bottom: -8px;
    }
    .profile-stack:nth-child(odd)  .profile-string { height: 70px; }
    .profile-stack:nth-child(3n)   .profile-string { height: 86px; }

    /* "+ Add child" button */
    .add-btn {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 28px; border-radius: 999px;
      background: var(--chip-bg);
      border: 1.5px dashed var(--chip-border);
      cursor: pointer; margin-top: 12px;
    }
    .add-btn .plus {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--chip-bg);
      border: 1.5px solid var(--chip-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; color: var(--text); opacity: 0.85;
      line-height: 0;
    }
    .add-btn .label {
      font-size: 15px; font-weight: 700; color: var(--text); opacity: 0.85;
      font-family: var(--font-ui);
    }
    .parent-hint {
      position: fixed; bottom: calc(24px + env(safe-area-inset-bottom));
      left: 0; right: 0; text-align: center;
      font-family: var(--font-ui); font-size: 11px;
      color: var(--text-soft); letter-spacing: 1.2px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="picker-screen">
    <div class="picker-greeting" id="greeting">At SimplyKnown</div>
    <h1 class="picker-title" id="pickerTitle">Who's playing?</h1>

    <div class="profiles-row" id="profilesRow"></div>

    <div class="add-btn" id="addBtn" title="Add child">
      <div class="plus">+</div>
      <div class="label">Add a child</div>
    </div>
  </div>

  <div class="parent-hint">
    TAP ✦ IN THE CORNER TO OPEN PARENT SETTINGS · PIN REQUIRED
  </div>

  <button class="settings-gear" id="settingsGear" aria-label="Parent settings" title="Parent settings">
    <svg viewBox="0 0 24 24"><path d="M12 2 L 13.5 9 L 20.5 10.5 L 13.5 12 L 12 20 L 10.5 12 L 3.5 10.5 L 10.5 9 Z" opacity="0.9"/><circle cx="12" cy="10.8" r="1.4" fill="none" stroke="currentColor" stroke-width="1"/></svg>
  </button>

  <script src="js/atmosphere.js"></script>
  <script src="js/tiers.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/voice-manifest.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sync.js"></script>
  <script>
    // Time-of-day greeting copy (runs after atmosphere.js has set data-tod)
    function updateGreetingCopy() {
      var tod = document.documentElement.getAttribute('data-tod') ||
                (window.vbAtmosphere && window.vbAtmosphere.pickTOD && window.vbAtmosphere.pickTOD()) ||
                'night';
      var greet = {
        morning:   'Good morning at SimplyKnown',
        afternoon: 'This afternoon at SimplyKnown',
        evening:   'Good evening at SimplyKnown',
        night:     'Tonight at SimplyKnown',
      }[tod];
      var title = {
        morning:   "Who's awake?",
        afternoon: "Who's playing?",
        evening:   "Who's joining us?",
        night:     "Who's playing tonight?",
      }[tod];
      document.getElementById('greeting').textContent = greet;
      document.getElementById('pickerTitle').textContent = title;
    }
    updateGreetingCopy();
    // Run again after DOMContentLoaded in case atmosphere.js stamped data-tod
    // between our two calls.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', updateGreetingCopy);
    }

    function renderProfiles() {
      const row = document.getElementById('profilesRow');
      row.innerHTML = '';
      getProfiles().forEach(p => {
        const ageMonths = getAgeMonths(p.birthday);
        const ageLabel = ageMonths < 24
          ? ageMonths + ' months'
          : Math.floor(ageMonths / 12) + ' yrs ' + (ageMonths % 12) + 'mo';

        // Lantern stack: hanging string → glowing lantern → name → age
        const stack = document.createElement('div');
        stack.className = 'profile-stack pop-in';

        const string = document.createElement('div');
        string.className = 'profile-string';
        stack.appendChild(string);

        const btn = document.createElement('div');
        btn.className = 'avatar-btn';
        // Per-child glow + body color
        btn.style.setProperty('--avatar-bg',
          `radial-gradient(circle at 35% 30%, ${p.color}ff 0%, ${p.color} 60%, ${p.color}cc 100%)`);
        btn.style.setProperty('--avatar-glow', `${p.color}cc`);
        btn.innerHTML =
          `<span class="emoji">${p.avatar}</span>` +
          `<span class="name">${p.name}</span>` +
          `<span class="age-label">${ageLabel}</span>`;
        btn.addEventListener('click', () => {
          playChime();
          setActiveProfile(p.id);
          goTo('home.html');
        });
        stack.appendChild(btn);

        row.appendChild(stack);
      });
    }
    renderProfiles();

    document.getElementById('addBtn').addEventListener('click', () => {
      goTo('parent/settings.html?action=add');
    });

    document.getElementById('settingsGear').addEventListener('click', () => {
      goTo('parent/settings.html');
    });

    // Seed demo profiles + default video channels if none exist
    if (getProfiles().length === 0) {
      const today = new Date();
      const sub = (mo) => new Date(today.getFullYear(), today.getMonth() - mo, today.getDate())
                            .toISOString().slice(0,10);
      const baby = addProfile({ name: 'Baby', birthday: sub(8),  avatar: '🐣', color: '#c8b8f0' });
      const toddler = addProfile({ name: 'Toddler', birthday: sub(20), avatar: '🐸', color: '#4ECDC4' });
      updateProfile(baby.id, { youtube: [
        { emoji:'🐻', label:'Hey Bear Sensory',   channelId:'UCtf9cFBJkHVAf2qMqF01xYg' },
        { emoji:'🎵', label:'Super Simple Songs', channelId:'UCLsooMJoIpl_7ux2jvdPB-Q' },
      ]});
      updateProfile(toddler.id, { youtube: [
        { emoji:'👩‍🏫', label:'Ms Rachel',          channelId:'UCG2CL6EUjG8TVT1Tpl9nJdg' },
        { emoji:'🐒',  label:'Curious George',    channelId:'UCu7IDy0y-ZA0qaG51wrQY6w' },
        { emoji:'🎵',  label:'Super Simple Songs', channelId:'UCLsooMJoIpl_7ux2jvdPB-Q' },
      ]});
      renderProfiles();
    }

    // YouTube channel seed — self-healing (preserved from original)
    (function _seedYoutube() {
      const list = getProfiles();
      let changed = false;
      const BABY_DEFAULTS = [
        { emoji:'🐻', label:'Hey Bear Sensory',   channelId:'UCtf9cFBJkHVAf2qMqF01xYg' },
        { emoji:'🎵', label:'Super Simple Songs', channelId:'UCLsooMJoIpl_7ux2jvdPB-Q' },
      ];
      const TODDLER_DEFAULTS = [
        { emoji:'👩‍🏫', label:'Ms Rachel',          channelId:'UCG2CL6EUjG8TVT1Tpl9nJdg' },
        { emoji:'🐒',  label:'Curious George',    channelId:'UCu7IDy0y-ZA0qaG51wrQY6w' },
        { emoji:'🎵',  label:'Super Simple Songs', channelId:'UCLsooMJoIpl_7ux2jvdPB-Q' },
      ];
      const defaultsByName = {
        Baby: BABY_DEFAULTS, Toddler: TODDLER_DEFAULTS,
        Leah: BABY_DEFAULTS, Noah: TODDLER_DEFAULTS,
      };
      const FALLBACK_DEFAULT = [
        { emoji:'🎵', label:'Super Simple Songs', channelId:'UCLsooMJoIpl_7ux2jvdPB-Q' },
      ];
      for (const p of list) {
        const namedDefaults = defaultsByName[p.name];
        if (!p.youtubeInitialized) {
          p.youtube = namedDefaults || FALLBACK_DEFAULT;
          p.youtubeInitialized = true;
          changed = true;
          continue;
        }
        if (namedDefaults) {
          const removed = new Set(p.youtubeRemoved || []);
          const existing = new Set((p.youtube || []).map(c => c.channelId));
          const missing = namedDefaults.filter(d => !existing.has(d.channelId) && !removed.has(d.channelId));
          if (missing.length) {
            p.youtube = [...(p.youtube || []), ...missing];
            changed = true;
          }
        }
      }
      if (changed) saveProfiles(list);
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
    }
  </script>
</body>
</html>
