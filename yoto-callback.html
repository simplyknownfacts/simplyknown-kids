<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Connecting Yoto…</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background:#1a1a2e; color:white; display:flex; align-items:center; justify-content:center;
           min-height:100vh; font-family: system-ui; padding:20px; }
    .box { max-width:420px; text-align:center; }
    .spinner { width:48px; height:48px; border:4px solid rgba(255,255,255,0.2);
               border-top-color:#4ECDC4; border-radius:50%; margin:24px auto;
               animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin:0 0 12px; }
    .err { color:#FF6B6B; font-size:14px; margin-top:12px; }
    a { color:#4ECDC4; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1 id="t">Connecting Yoto…</h1>
    <div id="msg" class="err"></div>
  </div>
  <script src="js/yoto-config.js"></script>
  <script src="js/yoto.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const t = document.getElementById('t');
      const msg = document.getElementById('msg');
      if (error) {
        t.textContent = 'Yoto sign-in canceled';
        msg.textContent = error + (params.get('error_description') ? ' — ' + params.get('error_description') : '');
        setTimeout(() => location.href = 'parent/settings.html', 2500);
        return;
      }
      if (!code || !state) {
        t.textContent = 'Missing OAuth params';
        msg.textContent = 'Returned to the callback page without code/state. Try again from Parent Settings.';
        return;
      }
      try {
        await yoto.completeAuth(code, state);
        t.textContent = '✓ Connected!';
        msg.style.color = '#a8e6cf';
        msg.textContent = 'Tokens stored. Returning to settings…';
        setTimeout(() => location.href = 'parent/settings.html', 1200);
      } catch (e) {
        t.textContent = 'Connect failed';
        msg.textContent = e.message;
      }
    })();
  </script>
</body>
</html>
