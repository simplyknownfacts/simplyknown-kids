<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mascot Library — preview</title>
  <style>
    body { font-family: system-ui; background: #1a1a2e; color: white; margin: 0; padding: 20px; }
    h1 { margin: 0 0 8px; }
    .note { color: #aaa; font-size: 14px; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; }
    .row { display: flex; gap: 16px; align-items: flex-start; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    img { width: 120px; height: 120px; border-radius: 8px; object-fit: cover; }
    video { width: 100%; max-width: 280px; border-radius: 8px; display: block; margin-top: 8px; }
    select { width: 100%; padding: 8px; background: rgba(255,255,255,0.1); color: white;
             border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
    .label { font-size: 12px; color: #aaa; margin-top: 6px; }
    .voice-toggle { display: flex; gap: 8px; margin-bottom: 8px; }
    .voice-btn { padding: 6px 12px; border-radius: 16px; border: 2px solid #4ECDC4;
                 background: transparent; color: white; cursor: pointer; font-size: 12px; }
    .voice-btn.active { background: #4ECDC4; color: #1a1a2e; }
  </style>
</head>
<body>
  <h1>🐾 Mascot Library</h1>
  <p class="note">Each mascot has 20 lip-synced video clips (10 phrases × 2 voices). Pick a phrase from the dropdown to preview.</p>
  <div class="grid" id="grid"></div>
  <script>
    const MASCOTS = [
      { id: 'dog',     name: '🐶 Dog (pit bull mutt)' },
      { id: 'tiger',   name: '🐯 Tiger' },
      { id: 'giraffe', name: '🦒 Giraffe' },
      { id: 'panda',   name: '🐼 Panda' },
      { id: 'orca',    name: '🐳 Orca' },
      { id: 'eagle',   name: '🦅 Eagle' },
    ];
    const PHRASES = [
      { key: 'welcome',       label: 'Welcome' },
      { key: 'games_intro',   label: "Let's play games" },
      { key: 'learn_intro',   label: "Let's learn" },
      { key: 'art_intro',     label: "Let's make art" },
      { key: 'watch_intro',   label: "Let's watch videos" },
      { key: 'cheer_great',   label: 'Great job!' },
      { key: 'cheer_didit',   label: 'You did it!' },
      { key: 'cheer_awesome', label: 'Awesome!' },
      { key: 'cheer_yay',     label: 'Yay!' },
      { key: 'goodbye',       label: 'Goodbye' },
    ];
    const v = '?v=3';
    const grid = document.getElementById('grid');
    MASCOTS.forEach(m => {
      const card = document.createElement('div');
      card.className = 'card';
      const opts = PHRASES.map(p => `<option value="${p.key}">${p.label}</option>`).join('');
      card.innerHTML = `
        <div class="row">
          <img src="mascots/${m.id}/master.png${v}" alt="${m.name}">
          <div style="flex:1;">
            <h2>${m.name}</h2>
            <div class="voice-toggle">
              <button class="voice-btn active" data-voice="girl">Girl (Sarah)</button>
              <button class="voice-btn" data-voice="boy">Boy (Josh)</button>
            </div>
            <select>${opts}</select>
          </div>
        </div>
        <video controls autoplay loop></video>
        <div class="label"></div>
      `;
      const sel = card.querySelector('select');
      const vid = card.querySelector('video');
      const lbl = card.querySelector('.label');
      const btns = card.querySelectorAll('.voice-btn');
      let voice = 'girl';
      const reload = () => {
        const phrase = PHRASES.find(p => p.key === sel.value);
        vid.src = `mascots/${m.id}/video/${voice}_${phrase.key}.mp4${v}`;
        lbl.textContent = `${voice} · ${phrase.label}`;
      };
      sel.addEventListener('change', reload);
      btns.forEach(b => b.addEventListener('click', () => {
        btns.forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        voice = b.dataset.voice;
        reload();
      }));
      reload();
      grid.appendChild(card);
    });
  </script>
</body>
</html>
