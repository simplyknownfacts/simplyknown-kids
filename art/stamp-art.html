<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Stamp Art</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #canvas { position:fixed; inset:0; }
    #stampbar {
      position:fixed; bottom:0; left:0; right:0;
      display:none; gap:10px; justify-content:center; align-items:center;
      padding:10px; background:rgba(0,0,0,0.4); backdrop-filter:blur(8px); z-index:10;
      flex-wrap:wrap;
    }
    .stamp-chip {
      width:60px; height:60px; border-radius:16px;
      background:rgba(255,255,255,0.12);
      border:3px solid rgba(255,255,255,0.2);
      font-size:32px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:transform 0.1s;
    }
    .stamp-chip:active { transform:scale(0.85); }
    .stamp-chip.active { border-color:white; background:rgba(255,255,255,0.25); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="stampbar"></div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const profile = getActiveProfile();
    if (!profile) goProfiles();
    const tier = getActivityTier(profile, 'stamp-art');
    renderBackBtn('index.html');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const THEMES = {
      default: { bg:'#1a1a2e', stamps:['⭐','❤️','🌈','🎉','🦋','🌸','🍀','🎈','🌙','☀️'] },
      farm:    { bg:'#a8d5a2', stamps:['🐮','🐔','🐷','🐑','🌻','🌾','🚜','🏡','🐴','🦆'] },
      ocean:   { bg:'#1a6b9a', stamps:['🐠','🐙','🦀','🌊','⚓','🐚','🦈','🐡','🌴','⛵'] },
      space:   { bg:'#0a0a2e', stamps:['🚀','🌟','🪐','👾','🌙','☄️','🛸','🌌','⭐','🔭'] },
    };

    let theme = THEMES.default;
    let activeStamp = theme.stamps[0];

    function setBackground() {
      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    setBackground();

    function placeStamp(x, y, emoji, size = 60) {
      ctx.font = `${size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, x, y);
      playChime();
    }

    let autoInt;
    if (tier <= 2) {
      autoInt = setInterval(() => {
        const s = theme.stamps[Math.floor(Math.random() * theme.stamps.length)];
        placeStamp(
          60 + Math.random() * (canvas.width - 120),
          60 + Math.random() * (canvas.height - 120),
          s, 60 + Math.random() * 40
        );
      }, 1200);
    }

    if (tier >= 5) {
      const bar = document.getElementById('stampbar');
      bar.style.display = 'flex';

      function buildBar() {
        bar.innerHTML = '';
        theme.stamps.forEach(s => {
          const chip = document.createElement('div');
          chip.className = 'stamp-chip' + (s === activeStamp ? ' active' : '');
          chip.textContent = s;
          chip.addEventListener('click', () => {
            activeStamp = s;
            document.querySelectorAll('.stamp-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
          });
          bar.appendChild(chip);
        });

        if (tier >= 7) {
          ['farm','ocean','space'].forEach(key => {
            const chip = document.createElement('div');
            chip.className = 'stamp-chip';
            chip.textContent = key === 'farm' ? '🏡' : key === 'ocean' ? '🌊' : '🚀';
            chip.title = key;
            chip.addEventListener('click', () => {
              theme = THEMES[key];
              activeStamp = theme.stamps[0];
              setBackground();
              buildBar();
            });
            bar.appendChild(chip);
          });
        }
      }
      buildBar();
    }

    canvas.addEventListener('pointerdown', e => {
      clearInterval(autoInt);
      const stamp = tier >= 5 ? activeStamp : theme.stamps[Math.floor(Math.random() * theme.stamps.length)];
      placeStamp(e.clientX, e.clientY, stamp, tier <= 4 ? 80 : 60);
    });
  </script>
</body>
</html>
