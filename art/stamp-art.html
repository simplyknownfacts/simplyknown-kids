<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Stamp Art</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    #canvas { position:fixed; inset:0; touch-action:none; }

    /* Phone/portrait: a bottom dock stacks the Scene row ABOVE the stamp rows —
       both in the thumb zone and clear of the top-left Back/Home buttons.
       (The old design buried Scene at the bottom of the stamp list, so on a
       tablet you scrolled ~1200px past every stamp to change scenes.) */
    #bottomdock {
      position:fixed; left:0; right:0; bottom:0; z-index:10;
      display:flex; flex-direction:column;
    }
    #scenebar {
      display:none; align-items:center; justify-content:center; gap:10px;
      flex-wrap:wrap; padding:8px 10px;
      background:rgba(0,0,0,0.4); backdrop-filter:blur(8px);
    }
    #stampbar {
      display:none; align-items:center; justify-content:center; gap:10px;
      flex-wrap:wrap; padding:10px 10px calc(10px + env(safe-area-inset-bottom)) 10px;
      background:rgba(0,0,0,0.4); backdrop-filter:blur(8px);
    }
    /* TRUE tablet/desktop landscape: Scene floats as an always-visible top-center
       pill; stamps move to a right rail that WRAPS into columns so all 10 fit
       with NO scrolling. */
    @media (orientation: landscape) and (min-width: 1024px) {
      #bottomdock { display:contents; }
      #scenebar {
        position:fixed; top:0; left:50%; transform:translateX(-50%); z-index:11;
        flex-wrap:nowrap; max-width:96vw;
        padding: calc(6px + env(safe-area-inset-top)) 16px 6px;
        border-radius:0 0 22px 22px;
      }
      #stampbar {
        position:fixed; top:0; right:0; bottom:0; left:auto;
        flex-direction:column; flex-wrap:wrap;
        align-content:flex-end; justify-content:center;
        width:auto; max-width:50vw; height:100vh;
        padding:16px 12px; gap:12px;
        overflow-x:hidden; overflow-y:auto;
      }
    }

    /* Press feedback that doesn't shrink the hit area (toddler fingers drag a bit) */
    .stamp-chip:active, .scene-chip:active {
      background:rgba(255,255,255,0.4);
      box-shadow:0 0 0 4px rgba(78,205,196,0.6);
    }
    .stamp-chip {
      width:60px; height:60px; border-radius:16px;
      background:rgba(255,255,255,0.12);
      border:3px solid rgba(255,255,255,0.2);
      flex-shrink:0;
      font-size:32px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:transform 0.1s;
    }
    .stamp-chip.active { border-color:white; background:rgba(255,255,255,0.25); }
    /* Larger stamp chips on tablets (kept a touch smaller so 10 fit in 2 rail
       columns without scrolling). */
    @media (min-width: 768px) {
      .stamp-chip { width:84px; height:84px; font-size:46px; border-radius:22px; border-width:4px; }
      #stampbar { gap:14px; }
    }

    .scene-label {
      color: rgba(255,255,255,0.7);
      font-size: 11px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 1px;
      margin-right: 2px;
    }
    .scene-chip {
      width:56px; height:56px; border-radius:50%; /* round vs square stamps */
      background: linear-gradient(135deg, #4ECDC4, #45B7D1);
      border:3px solid rgba(255,255,255,0.5);
      flex-shrink:0;
      font-size:26px; cursor:pointer; color:white;
      display:flex; align-items:center; justify-content:center;
      transition:transform 0.1s;
      box-shadow: 0 2px 12px rgba(78,205,196,0.4);
    }
    .scene-chip.active { border-color:white; box-shadow: 0 0 0 3px white, 0 2px 12px rgba(78,205,196,0.6); }
    @media (min-width: 768px) {
      .scene-chip { width:64px; height:64px; font-size:30px; }
      .scene-label { font-size:13px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="bottomdock">
    <div id="scenebar"></div>
    <div id="stampbar"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'stamp-art');
    renderBackBtn('index.html');
    gameSettings.attach('stamp-art', { container: '#stampbar' });
    if (window.vbProgress) { vbProgress.firstPlay('stamp-art'); vbProgress.touchStreak(); }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const THEMES = {
      default: { bg:'#1a1a2e', stamps:['⭐','❤️','🌈','🎉','🦋','🌸','🍀','🎈','🌙','☀️'] },
      farm:    { bg:'#a8d5a2', stamps:['🐮','🐔','🐷','🐑','🌻','🌾','🚜','🏡','🐴','🦆'] },
      ocean:   { bg:'#1a6b9a', stamps:['🐠','🐙','🦀','🌊','⚓','🐚','🦈','🐡','🌴','⛵'] },
      space:   { bg:'#0a0a2e', stamps:['🚀','🌟','🪐','👾','🌙','☄️','🛸','🌌','⭐','🔭'] },
    };

    let theme = THEMES.default;
    let activeStamp = theme.stamps[0];

    function setBackground() {
      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    setBackground();
    // Keep filling the screen + preserve the stamps (and current theme bg) on rotate/resize.
    window.addEventListener('resize', () => {
      const tmp = document.createElement('canvas'); tmp.width = canvas.width; tmp.height = canvas.height;
      tmp.getContext('2d').drawImage(canvas, 0, 0);
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      setBackground();
      ctx.drawImage(tmp, 0, 0);
    });

    function placeStamp(x, y, emoji, size = 60) {
      ctx.font = `${size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, x, y);
      playChime();
    }

    let autoInt;
    if (tier <= 2) {
      autoInt = setInterval(() => {
        const s = theme.stamps[Math.floor(Math.random() * theme.stamps.length)];
        placeStamp(
          60 + Math.random() * (canvas.width - 120),
          60 + Math.random() * (canvas.height - 120),
          s, 60 + Math.random() * 40
        );
      }, 1200);
    }

    const showPalette = true; // always show — toddlers benefit most from tapping big colorful stamps
    const showThemes  = tier >= 5 || getProfileFeature(profile, 'stamp-art', 'themeSwitcher');

    if (showPalette) {
      const bar = document.getElementById('stampbar');
      const sceneBar = document.getElementById('scenebar');
      // gameSettings.attach dropped the gear into #stampbar; keep a handle so we
      // can re-append it after each rebuild (innerHTML='' would wipe it).
      const gear = document.getElementById('gameSettingsGear');
      bar.style.display = 'flex';

      function buildScenes() {
        if (!showThemes) return;
        sceneBar.style.display = 'flex';
        sceneBar.innerHTML = '';
        const lbl = document.createElement('div');
        lbl.className = 'scene-label';
        lbl.textContent = 'Scene';
        sceneBar.appendChild(lbl);
        const themeKeys = ['default','farm','ocean','space'];
        const themeIcons = { default:'✨', farm:'🏡', ocean:'🌊', space:'🚀' };
        const currentKey = Object.keys(THEMES).find(k => THEMES[k] === theme);
        themeKeys.forEach(key => {
          const chip = document.createElement('div');
          chip.className = 'scene-chip' + (key === currentKey ? ' active' : '');
          chip.textContent = themeIcons[key];
          chip.title = key;
          chip.addEventListener('pointerdown', () => {
            theme = THEMES[key];
            activeStamp = theme.stamps[0];
            setBackground();
            buildBar();
          });
          sceneBar.appendChild(chip);
        });
      }

      function buildBar() {
        bar.innerHTML = '';
        theme.stamps.forEach(s => {
          const chip = document.createElement('div');
          chip.className = 'stamp-chip' + (s === activeStamp ? ' active' : '');
          chip.textContent = s;
          chip.addEventListener('pointerdown', () => {
            activeStamp = s;
            document.querySelectorAll('.stamp-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
          });
          bar.appendChild(chip);
        });
        if (gear) bar.appendChild(gear);  // restore settings gear (order:999 keeps it last)
        buildScenes();                     // refresh the always-visible scene pill
      }
      buildBar();
    }

    canvas.addEventListener('pointerdown', e => {
      clearInterval(autoInt);
      const stamp = showPalette ? activeStamp : theme.stamps[Math.floor(Math.random() * theme.stamps.length)];
      placeStamp(e.clientX, e.clientY, stamp, tier <= 4 ? 80 : 60);
      if (window.vbProgress) vbProgress.record('stamp-art');
    });
    })();
  </script>
</body>
</html>
