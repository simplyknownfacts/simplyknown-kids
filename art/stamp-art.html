<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Stamp Art</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    #canvas { position:fixed; inset:0; touch-action:none; }
    #stampbar {
      position:fixed; bottom:0; left:0; right:0;
      display:none; gap:10px; align-items:center;
      padding:10px 10px calc(10px + env(safe-area-inset-bottom)) 10px;
      background:rgba(0,0,0,0.4); backdrop-filter:blur(8px); z-index:10;
      /* Wrap to multiple rows so every stamp AND the theme switcher stay on
         screen — young kids don't discover horizontal scroll. */
      flex-wrap:wrap;
      justify-content:center;
    }
    /* TRUE tablet landscape only: bar moves to right side as a scrollable rail.
       Phone landscape (~844x390) falls back to the bottom strip above so we
       don't lose vertical canvas space to a side panel. */
    @media (orientation: landscape) and (min-width: 1024px) {
      #stampbar {
        flex-direction:column; flex-wrap:nowrap;
        align-content:flex-start; justify-content:flex-start;
        top:0; right:0; bottom:0; left:auto;
        width:auto; max-width:360px; height:100vh;
        padding: calc(16px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)) 12px;
        overflow-x:hidden; overflow-y:auto; gap:12px;
      }
      .scene-sep { width:60px; height:2px; margin:6px 0; flex-basis:100%; }
      .scene-label { flex-basis:100%; text-align:center; }
    }
    /* Press feedback that doesn't shrink the hit area (toddler fingers are slow + drag a bit) */
    .stamp-chip:active, .scene-chip:active {
      background:rgba(255,255,255,0.4);
      box-shadow:0 0 0 4px rgba(78,205,196,0.6);
    }
    .stamp-chip {
      width:60px; height:60px; border-radius:16px;
      background:rgba(255,255,255,0.12);
      border:3px solid rgba(255,255,255,0.2);
      flex-shrink:0;
      font-size:32px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:transform 0.1s;
    }
    .stamp-chip.active { border-color:white; background:rgba(255,255,255,0.25); }
    /* Larger chips on tablets */
    @media (min-width: 768px) {
      .stamp-chip { width:96px; height:96px; font-size:52px; border-radius:22px; border-width:4px; }
      .scene-chip { width:96px; height:96px; font-size:42px; }
      .scene-label { font-size:14px; }
      #stampbar { padding:16px; gap:14px; }
    }
    /* Theme selector: visually separated, different shape + color.
       Full-width sep forces the Scene chips onto their own wrapped row. */
    .scene-sep {
      flex-basis: 100%;
      height: 2px; margin: 4px 0 2px;
      background: rgba(255,255,255,0.35);
      flex-shrink: 0;
    }
    .scene-label {
      color: rgba(255,255,255,0.65);
      font-size: 11px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 1px;
      margin-right: 4px;
    }
    .scene-chip {
      width:60px; height:60px; border-radius:50%; /* round vs square stamps */
      background: linear-gradient(135deg, #4ECDC4, #45B7D1);
      border:3px solid rgba(255,255,255,0.5);
      flex-shrink:0;
      font-size:28px; cursor:pointer; color:white;
      display:flex; align-items:center; justify-content:center;
      transition:transform 0.1s;
      box-shadow: 0 2px 12px rgba(78,205,196,0.4);
    }
    .scene-chip.active { border-color:white; box-shadow: 0 0 0 3px white, 0 2px 12px rgba(78,205,196,0.6); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="stampbar"></div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'stamp-art');
    renderBackBtn('index.html');
    gameSettings.attach('stamp-art', { container: '#stampbar' });
    if (window.vbProgress) { vbProgress.firstPlay('stamp-art'); vbProgress.touchStreak(); }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const THEMES = {
      default: { bg:'#1a1a2e', stamps:['⭐','❤️','🌈','🎉','🦋','🌸','🍀','🎈','🌙','☀️'] },
      farm:    { bg:'#a8d5a2', stamps:['🐮','🐔','🐷','🐑','🌻','🌾','🚜','🏡','🐴','🦆'] },
      ocean:   { bg:'#1a6b9a', stamps:['🐠','🐙','🦀','🌊','⚓','🐚','🦈','🐡','🌴','⛵'] },
      space:   { bg:'#0a0a2e', stamps:['🚀','🌟','🪐','👾','🌙','☄️','🛸','🌌','⭐','🔭'] },
    };

    let theme = THEMES.default;
    let activeStamp = theme.stamps[0];

    function setBackground() {
      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    setBackground();
    // Keep filling the screen + preserve the stamps (and current theme bg) on rotate/resize.
    window.addEventListener('resize', () => {
      const tmp = document.createElement('canvas'); tmp.width = canvas.width; tmp.height = canvas.height;
      tmp.getContext('2d').drawImage(canvas, 0, 0);
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      setBackground();
      ctx.drawImage(tmp, 0, 0);
    });

    function placeStamp(x, y, emoji, size = 60) {
      ctx.font = `${size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, x, y);
      playChime();
    }

    let autoInt;
    if (tier <= 2) {
      autoInt = setInterval(() => {
        const s = theme.stamps[Math.floor(Math.random() * theme.stamps.length)];
        placeStamp(
          60 + Math.random() * (canvas.width - 120),
          60 + Math.random() * (canvas.height - 120),
          s, 60 + Math.random() * 40
        );
      }, 1200);
    }

    const showPalette = true; // always show — toddlers benefit most from tapping big colorful stamps
    const showThemes  = tier >= 5 || getProfileFeature(profile, 'stamp-art', 'themeSwitcher');

    if (showPalette) {
      const bar = document.getElementById('stampbar');
      bar.style.display = 'flex';

      function buildBar() {
        bar.innerHTML = '';
        theme.stamps.forEach(s => {
          const chip = document.createElement('div');
          chip.className = 'stamp-chip' + (s === activeStamp ? ' active' : '');
          chip.textContent = s;
          chip.addEventListener('pointerdown', () => {
            activeStamp = s;
            document.querySelectorAll('.stamp-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
          });
          bar.appendChild(chip);
        });

        if (showThemes) {
          const sep = document.createElement('div');
          sep.className = 'scene-sep';
          bar.appendChild(sep);
          const lbl = document.createElement('div');
          lbl.className = 'scene-label';
          lbl.textContent = 'Scene';
          bar.appendChild(lbl);
          const themeKeys = ['default','farm','ocean','space'];
          const themeIcons = { default:'✨', farm:'🏡', ocean:'🌊', space:'🚀' };
          const currentKey = Object.keys(THEMES).find(k => THEMES[k] === theme);
          themeKeys.forEach(key => {
            const chip = document.createElement('div');
            chip.className = 'scene-chip' + (key === currentKey ? ' active' : '');
            chip.textContent = themeIcons[key];
            chip.title = key;
            chip.addEventListener('pointerdown', () => {
              theme = THEMES[key];
              activeStamp = theme.stamps[0];
              setBackground();
              buildBar();
            });
            bar.appendChild(chip);
          });
        }
      }
      buildBar();
    }

    canvas.addEventListener('pointerdown', e => {
      clearInterval(autoInt);
      const stamp = showPalette ? activeStamp : theme.stamps[Math.floor(Math.random() * theme.stamps.length)];
      placeStamp(e.clientX, e.clientY, stamp, tier <= 4 ? 80 : 60);
      if (window.vbProgress) vbProgress.record('stamp-art');
    });
    })();
  </script>
</body>
</html>
