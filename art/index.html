<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Art</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: linear-gradient(160deg, #a86cdb 0%, #FF6B6B 100%); }
    .screen {
      justify-content: flex-start !important;
      padding-top: calc(90px + env(safe-area-inset-top));
      padding-bottom: 200px;
      overflow-y: auto;
    }
    .cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px; max-width: 560px; width: 100%;
    }
    .activity-card { width: 100% !important; height: 130px !important; aspect-ratio: 1; }
    .activity-card .icon { font-size: 50px; }
    .activity-card .label { font-size: 13px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="title">🎨 Art</div>
    <div class="cards-row">
      <div class="activity-card" onclick="go('color-splash.html')">
        <div class="icon">💥</div>
        <div class="label">Color Splash</div>
      </div>
      <div class="activity-card" onclick="go('finger-paint.html')">
        <div class="icon">🖌️</div>
        <div class="label">Finger Paint</div>
      </div>
      <div class="activity-card" onclick="go('stamp-art.html')">
        <div class="icon">⭐</div>
        <div class="label">Stamp Art</div>
      </div>
      <div class="activity-card" onclick="go('color-in.html')">
        <div class="icon">🖍️</div>
        <div class="label">Color In</div>
      </div>
    </div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/mascot.js"></script>
  <script>
    function go(page) { playChime(); goTo(page); }
    renderBackBtn('../home.html');
    if (!getActiveProfile()) goProfiles();
    if (window.mascot) setTimeout(() => mascot.play('art_intro'), 400);
  </script>
</body>
</html>
