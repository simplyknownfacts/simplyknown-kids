<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Art</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: linear-gradient(160deg, #a86cdb 0%, #FF6B6B 100%); }
    .cards-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .activity-card { width: 140px; height: 140px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="title">🎨 Art</div>
    <div class="cards-row">
      <div class="activity-card" onclick="go('color-splash.html')">
        <div class="icon">💥</div>
        <div class="label">Color Splash</div>
      </div>
      <div class="activity-card" onclick="go('finger-paint.html')">
        <div class="icon">🖌️</div>
        <div class="label">Finger Paint</div>
      </div>
      <div class="activity-card" onclick="go('stamp-art.html')">
        <div class="icon">⭐</div>
        <div class="label">Stamp Art</div>
      </div>
    </div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function go(page) { playChime(); goTo(page); }
    renderBackBtn('../home.html');
    if (!getActiveProfile()) goProfiles();
  </script>
</body>
</html>
