<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Color In</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: #f4f0e6; }
    .stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .pic-wrap {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 80px 16px 120px;
    }
    .pic-wrap svg { width: 100%; height: 100%; max-height: calc(100vh - 200px); }
    /* Coloring book look: thick black outlines, white fill until tapped */
    .region {
      stroke: #1a1a2e; stroke-width: 5; stroke-linejoin: round;
      stroke-linecap: round;
      cursor: pointer; transition: filter 0.15s;
      fill: #ffffff;
    }
    .region:active { filter: brightness(0.9); }
    .detail {
      fill: none; stroke: #1a1a2e; stroke-width: 4; stroke-linejoin: round;
      stroke-linecap: round; pointer-events: none;
    }
    #toolbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; flex-wrap: wrap;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      background: rgba(10,10,40,0.85); backdrop-filter: blur(8px); z-index: 10;
    }
    @media (orientation: landscape) and (min-width: 768px) {
      #toolbar {
        flex-direction: column; flex-wrap: wrap; align-content: flex-start;
        top: 0; right: 0; bottom: 0; left: auto;
        width: auto; max-width: 200px; height: 100vh;
        padding: calc(16px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)) 12px;
        gap: 14px;
      }
      .pic-wrap { padding-right: 220px; padding-bottom: 16px; }
    }
    .pip {
      width: 52px; height: 52px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.45); cursor: pointer;
      transition: border-color 0.1s, box-shadow 0.1s;
    }
    .pip.active { border-color: white; box-shadow: 0 0 0 3px white; }
    .tool-btn {
      padding: 10px 16px; border-radius: 16px;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.3);
      color: white; font-weight: 800; font-size: 14px; cursor: pointer;
    }
    .scene-title {
      position: fixed; top: calc(14px + env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      color: #1a1a2e; font-weight: 900; font-size: 18px;
      background: rgba(255,255,255,0.85); padding: 6px 16px; border-radius: 20px;
      z-index: 9; pointer-events: none;
      max-width: calc(100vw - 220px); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

    let picIdx = 0;
    const picWrap = document.getElementById('picWrap');
    const toolbar = document.getElementById('toolbar');
    const titleEl = document.getElementById('title');

    function renderPic() {
      const pic = SCENES[picIdx % SCENES.length];
      titleEl.textContent = pic.name;
      const regions = pic.regions.map((r, i) =>
        `<path class="region" data-i="${i}" d="${r.d}"/>`).join('');
      const details = (pic.details || []).map(d =>
        `<path class="detail" d="${d.d}"/>`).join('');
      picWrap.innerHTML =
        `<svg viewBox="${pic.viewBox}" xmlns="http://www.w3.org/2000/svg">${regions}${details}</svg>`;
      picWrap.querySelectorAll('.region').forEach(el => {
        el.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          el.setAttribute('fill', active);
          playChime();
        });
      });
    }

    function renderToolbar() {
      toolbar.innerHTML = '';
      COLORS.forEach((c, i) => {
        const pip = document.createElement('div');
        pip.className = 'pip' + (i === 0 ? ' active' : '');
        pip.style.background = c;
        pip.addEventListener('pointerdown', () => {
          active = c;
          toolbar.querySelectorAll('.pip').forEach(p => p.classList.remove('active'));
          pip.classList.add('active');
        });
        toolbar.appendChild(pip);
      });
      const next = document.createElement('button');
      next.className = 'tool-btn'; next.textContent = '✨ New';
      next.addEventListener('pointerdown', () => { picIdx++; renderPic(); });
      toolbar.appendChild(next);
      const clear = document.createElement('button');
      clear.className = 'tool-btn'; clear.textContent = '🧽 Clear';
      clear.addEventListener('pointerdown', () => {
        picWrap.querySelectorAll('.region').forEach(r => r.setAttribute('fill', 'white'));
      });
      toolbar.appendChild(clear);
      gameSettings.attach('color-in', { container: '#toolbar' });
    }

    renderToolbar();
    renderPic();
    })();
  </script>
</body>
</html>
