  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { color: #184d4a; background: linear-gradient(145deg,#f3dcff,#ffe9f3 54%,#fff2cf); overscroll-behavior: none; }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    .stage {
      position: fixed; inset: 0; height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: grid; grid-template-columns: 64px minmax(0,1fr) 64px;
      grid-template-rows: 76px minmax(0,1fr) 54px auto;
    }
    .scene-title {
      grid-column: 1 / -1; grid-row: 1; align-self: center; justify-self: stretch;
      margin: 0 12px 0 144px; color: #653e78; font-weight: 900;
      font-size: clamp(13px,3.4vw,18px); text-align: center; line-height: 1.15;
      overflow-wrap: anywhere;
    }
    .scene-title::before { content: 'Color In'; display: block; font-size: 12px; margin-bottom: 4px; color: #31736c; }
    .book { grid-column: 1 / -1; grid-row: 2; min-width: 0; min-height: 0; padding: 0 12px; }
    .page {
      position: relative; width: 100%; height: 100%; padding: 12px 12px 34px;
      display: flex; align-items: center; justify-content: center;
      background: #fff; border: 4px solid #fff; border-radius: 24px;
      box-shadow: 0 6px 0 rgba(101,62,120,.13), 0 12px 24px rgba(72,42,87,.12);
    }
    #colorFillCanvas {
      display: block; width: auto; height: auto; max-width: 100%; max-height: 100%;
      object-fit: contain; touch-action: none; cursor: pointer; background: #fff;
    }
    .fill-message { position: absolute; left: 8px; right: 8px; bottom: 7px; color: #31736c; text-align: center; font-weight: 800; font-size: 12px; line-height: 1.15; pointer-events: none; }
    .fill-error { position: absolute; inset: 12px; display: grid; place-items: center; text-align: center; padding: 16px; background: #fff8e8; color: #184d4a; border: 3px dashed #a992d4; border-radius: 18px; font-weight: 800; }
    .fill-error[hidden] { display: none; }
    .page-nav {
      grid-row: 3; align-self: center; justify-self: center; width: 48px; height: 44px;
      display: grid; place-items: center; border: 2px solid rgba(24,77,74,.15);
      border-radius: 14px; background: #fff9eb; color: #184d4a;
      box-shadow: 0 3px 0 rgba(24,77,74,.16); font-size: 30px; font-weight: 900; cursor: pointer;
    }
    .prev { grid-column: 1; } .next { grid-column: 3; }
    #toolbar {
      grid-column: 1 / -1; grid-row: 4; display: flex; align-items: center; justify-content: center;
      gap: 8px; flex-wrap: wrap; padding: 8px; background: #fff9eb;
      border-top: 2px solid rgba(101,62,120,.14); box-shadow: 0 -6px 24px rgba(78,46,94,.08);
    }
    #colorPalette { display: flex; gap: 5px; align-items: center; justify-content: center; }
    #colorFillDock { width: 48px; height: 48px; }
    .pip { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 50%; border: 3px solid rgba(24,77,74,.15); cursor: pointer; }
    .pip.active { border-color: #184d4a; box-shadow: 0 0 0 3px #ffd55a; }
    .tool-btn { min-width: 76px; height: 44px; padding: 6px 12px; border-radius: 14px; background: #fff; border: 2px solid rgba(24,77,74,.15); color: #184d4a; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 3px 0 rgba(24,77,74,.13); }
    button:focus-visible { outline: 3px solid #31736c; outline-offset: 3px; }
    body.vb-chrome:not(.world-page) .nav-chrome { top: calc(7px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); padding: 5px; }
    body.vb-chrome:not(.world-page) .nav-btn { width: 46px; height: 46px; }
    @media (orientation: landscape) {
      .stage { grid-template-columns: minmax(0,1fr) 184px; grid-template-rows: 68px minmax(0,1fr) 52px; }
      .scene-title { grid-column: 1; margin-right: 12px; }
      .book { grid-column: 1; padding: 0 10px; }
      .page { padding: 8px 8px 30px; }
      .page-nav { grid-column: 1; margin: 0 16px; }
      .prev { justify-self: start; } .next { justify-self: end; }
      #toolbar { grid-column: 2; grid-row: 1 / -1; flex-direction: column; flex-wrap: nowrap; gap: 14px; border-top: 0; border-left: 2px solid rgba(101,62,120,.14); }
      #colorPalette { display: grid; grid-template-columns: repeat(3,44px); gap: 7px; }
    }
  </style>
