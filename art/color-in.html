  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>

  <style>
    body { background: #f4f0e6; }
    .stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
    /* Coloring book frame — gives the page a 3D book feel */
    .book {
      flex: 1; position: relative;
      perspective: 1500px;
      perspective-origin: 50% 50%;
      padding: 70px 12px 110px;
      display: flex; align-items: center; justify-content: center;
    }
    .page {
      position: absolute; top: 70px; bottom: 110px; left: 12px; right: 12px;
      background: white; border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.05);
      display: flex; align-items: center; justify-content: center;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.5s cubic-bezier(.55,.1,.25,1), opacity 0.3s;
      backface-visibility: hidden;
    }
    .page.flipping { z-index: 10; }
    .page.behind { transform: scale(0.97); opacity: 0.4; }
    .page svg, .page canvas, .page img { width: 100%; height: 100%; max-height: 100%; }
    /* Spine line on the left edge */
    .book::before {
      content: ''; position: absolute; top: 60px; bottom: 100px; left: 6px;
      width: 6px; border-radius: 3px;
      background: linear-gradient(90deg, rgba(0,0,0,0.15), transparent);
      pointer-events: none; z-index: 11;
    }
    /* Coloring layer */
    .pic-svg { width: 100%; height: 100%; }
    .region {
      fill: #fff;  /* white regions so an injected coloring page reads as outlines */
      stroke: #1a1a2e; stroke-width: 4; stroke-linejoin: round;
      stroke-linecap: round;
    }
    .region:active { filter: brightness(0.92); }
    .detail {
      fill: none; stroke: #1a1a2e; stroke-width: 3; stroke-linejoin: round;
      stroke-linecap: round; pointer-events: none;
    }
    .dot { fill: #1a1a2e; pointer-events: none; }
    /* Photo coloring uses two stacked canvases */
    .photo-page {
      position: relative; width: 100%; height: 100%;
      background: white;
    }
    .photo-page canvas { position: absolute; inset: 0; touch-action: none; }
    .photo-lineart { z-index: 2; pointer-events: none; mix-blend-mode: multiply; }
    .photo-paint   { z-index: 1; }

    #toolbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; flex-wrap: wrap;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(10,10,40,0.88); backdrop-filter: blur(8px); z-index: 10;
    }
    @media (orientation: landscape) and (min-width: 768px) {
      #toolbar {
        flex-direction: column; flex-wrap: wrap; align-content: flex-start;
        top: 0; right: 0; bottom: 0; left: auto;
        width: auto; max-width: 180px; height: 100vh;
        padding: calc(16px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)) 12px;
        gap: 14px;
      }
      .book { padding-right: 200px; padding-bottom: 16px; }
      .page { right: 200px; bottom: 16px; }
    }
    .pip {
      width: 46px; height: 46px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.45); cursor: pointer;
      transition: border-color 0.1s, box-shadow 0.1s;
    }
    .pip.active { border-color: white; box-shadow: 0 0 0 3px white; }
    .tool-btn {
      padding: 10px 14px; border-radius: 14px;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.3);
      color: white; font-weight: 800; font-size: 13px; cursor: pointer;
    }
    /* Page nav arrows (sit OUTSIDE the toolbar so kid can flip mid-coloring) */
    .page-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 44px; height: 80px; border-radius: 12px;
      background: rgba(10,10,40,0.5); color: white;
      border: 2px solid rgba(255,255,255,0.3);
      font-size: 24px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 8; opacity: 0.6;
    }
    .page-nav:active { opacity: 1; }
    .page-nav.prev { left: 4px; }
    .page-nav.next { right: 4px; }
    @media (orientation: landscape) and (min-width: 768px) {
      .page-nav.next { right: 204px; }
    }
    .scene-title {
      position: fixed; top: calc(14px + env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      color: #1a1a2e; font-weight: 900; font-size: 16px;
      background: rgba(255,255,255,0.85); padding: 5px 14px; border-radius: 18px;
      z-index: 9; pointer-events: none;
      max-width: calc(100vw - 220px); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Page-turn animation */
    @keyframes flipOut {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(-160deg); }
    }
    @keyframes flipIn {
      from { transform: rotateY(160deg); }
      to   { transform: rotateY(0deg); }
    }
    .page.flip-out { animation: flipOut 0.55s ease-in forwards; }
    .page.flip-in  { animation: flipIn 0.55s ease-out forwards; }
  </style>
