<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Color Splash</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes.css">
  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    #canvas { position:fixed; inset:0; }
    #picker {
      position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
      display:flex; gap:12px; z-index:10;
      flex-wrap:wrap; justify-content:center; align-items:center;
      max-width: calc(100vw - 24px);
    }
    @media (orientation: landscape) and (min-width: 768px) {
      #picker {
        flex-direction:column; flex-wrap:wrap;
        align-content:flex-start;
        bottom:0; left:auto; right:16px; top:0;
        transform:none;
        max-width:160px; max-height:100vh;
        overflow:hidden; gap:14px;
        padding: calc(20px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom)) 0;
      }
    }
    .pip {
      width:60px; height:60px; border-radius:50%;
      border:4px solid rgba(255,255,255,0.3);
      cursor:pointer; transition:border-color 0.1s, box-shadow 0.1s;
    }
    .pip:active { box-shadow: 0 0 0 6px rgba(78,205,196,0.6); }
    .pip.active { border-color:white; box-shadow: 0 0 0 4px white; }
    #clearBtn {
      position:fixed; top:16px; right:80px;
      background:rgba(255,255,255,0.15);
      border:2px solid rgba(255,255,255,0.25);
      color:white; font-size:14px; font-weight:800;
      padding:10px 18px; border-radius:20px; cursor:pointer; z-index:10;
    }
  </style>
</head>
<body>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/paint.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'color-splash');
    renderBackBtn('index.html');
    if (window.vbProgress) { vbProgress.firstPlay('color-splash'); vbProgress.touchStreak(); }

    // Freeform paint canvas (blank). The shared engine grows the toolset with age:
    // littles = fat brush + a few big colours; older = sizes, brush types, eraser, undo.
    vbPaint.mount({
      tier,
      onStroke: () => { if (window.vbProgress) vbProgress.record('color-splash'); },
    });
    gameSettings.attach('color-splash', { container: '#vbPaintDock' });
    })();
  </script>
</body>
</html>
