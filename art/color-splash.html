<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Color Splash</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    #canvas { position:fixed; inset:0; }
    #picker {
      position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
      display:flex; gap:12px; z-index:10;
      flex-wrap:wrap; justify-content:center; align-items:center;
      max-width: calc(100vw - 24px);
    }
    @media (orientation: landscape) and (min-width: 768px) {
      #picker {
        flex-direction:column; flex-wrap:wrap;
        align-content:flex-start;
        bottom:0; left:auto; right:16px; top:0;
        transform:none;
        max-width:160px; max-height:100vh;
        overflow:hidden; gap:14px;
        padding: calc(20px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom)) 0;
      }
    }
    .pip {
      width:60px; height:60px; border-radius:50%;
      border:4px solid rgba(255,255,255,0.3);
      cursor:pointer; transition:border-color 0.1s, box-shadow 0.1s;
    }
    .pip:active { box-shadow: 0 0 0 6px rgba(78,205,196,0.6); }
    .pip.active { border-color:white; box-shadow: 0 0 0 4px white; }
    #clearBtn {
      position:fixed; top:16px; right:80px;
      background:rgba(255,255,255,0.15);
      border:2px solid rgba(255,255,255,0.25);
      color:white; font-size:14px; font-weight:800;
      padding:10px 18px; border-radius:20px; cursor:pointer; z-index:10;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="picker"></div>
  <button id="clearBtn" style="display:none;">✨ Clear</button>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'color-splash');
    renderBackBtn('index.html');
    gameSettings.attach('color-splash', { container: '#picker' });
    if (window.vbProgress) { vbProgress.firstPlay('color-splash'); vbProgress.touchStreak(); }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Fill the screen + preserve the canvas on rotate/resize (no resize handler before = dead space + missed taps in landscape).
    window.addEventListener('resize', () => {
      const tmp = document.createElement('canvas'); tmp.width = canvas.width; tmp.height = canvas.height;
      tmp.getContext('2d').drawImage(canvas, 0, 0);
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(tmp, 0, 0);
    });

    const COLORS = ['#FF6B6B','#FFE66D','#4ECDC4','#a86cdb','#FF9F43','#45B7D1','#FF69B4','#7CFC00'];
    let activeColor = COLORS[0];

    function randColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

    function splash(x, y, color, r = 90) {
      colorBurst(ctx, x, y, color, r);
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = Math.random() * r * 0.8;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a)*d, y + Math.sin(a)*d, 3 + Math.random()*6, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();
      }
      playPop();
    }

    let autoInterval;
    if (tier <= 2) {
      autoInterval = setInterval(() => {
        splash(
          80 + Math.random() * (canvas.width - 160),
          80 + Math.random() * (canvas.height - 160),
          randColor(), 100
        );
      }, 800);
    }

    const splashOn = tier >= 3 || getProfileFeature(profile, 'color-splash', 'colorPicker');
    if (splashOn) {
      document.getElementById('clearBtn').style.display = 'block';
      const picker = document.getElementById('picker');
      COLORS.slice(0, 6).forEach((c, i) => {
        const pip = document.createElement('div');
        pip.className = 'pip' + (i === 0 ? ' active' : '');
        pip.style.background = c;
        pip.addEventListener('pointerdown', () => {
          document.querySelectorAll('.pip').forEach(p => p.classList.remove('active'));
          pip.classList.add('active');
          activeColor = c;
        });
        picker.appendChild(pip);
      });
    }

    document.getElementById('clearBtn').addEventListener('pointerdown', () => {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    });

    canvas.addEventListener('pointerdown', e => {
      clearInterval(autoInterval);
      const color = splashOn ? activeColor : randColor();
      splash(e.clientX, e.clientY, color);
      if (window.vbProgress) vbProgress.record('color-splash');
    });
    })();
  </script>
</body>
</html>
