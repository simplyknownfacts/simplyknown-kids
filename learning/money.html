<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Money Matters</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes.css">
  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #3d5a3d, #1f3a1f); }
    .screen {
      justify-content: flex-start !important;
      padding: calc(70px + env(safe-area-inset-top)) 12px 200px;
      overflow-y: auto; gap: 18px;
    }
    .money-row {
      display: flex; gap: 14px; flex-wrap: wrap;
      justify-content: center; align-items: center;
      max-width: 720px;
    }
    .coin-svg, .bill-svg { cursor: pointer; transition: transform 0.12s;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5)); }
    .coin-svg:active, .bill-svg:active { transform: scale(0.92); }
    .coin-svg.matched, .bill-svg.matched { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5)) drop-shadow(0 0 8px #a8e6cf); }
    .coin-svg.wrong, .bill-svg.wrong { animation: shake 0.3s; }
    .num-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .num-btn {
      min-width: 90px; min-height: 70px; padding: 12px 18px; border-radius: 18px;
      background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.25);
      color: white; font-size: 24px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.12s;
    }
    .num-btn:active { transform: scale(0.9); }
    .num-btn.wrong { animation: shake 0.3s; background: rgba(255,107,107,0.3); }
    @keyframes shake {0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  </style>
</head>
<body>
  <div class="screen" id="stage">
    <div class="title">💰 Money</div>
    <div class="subtitle" id="hint"></div>
    <div id="body" class="col" style="gap:20px; width:100%; align-items:center;"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'money');
    renderBackBtn('index.html');
    gameSettings.attach('money');
    if (window.vbProgress) { vbProgress.firstPlay('money'); vbProgress.touchStreak(); }

    const countOn = tier >= 6 || getProfileFeature(profile, 'money', 'countMode');
    const changeOn = tier >= 9 || getProfileFeature(profile, 'money', 'makeChange');

    // Real-world relative sizes (dime smallest, quarter biggest among coins).
    // Diameters (px) on phones; bills are rectangles.
    // Real diameters: dime 17.9, penny 19.05, nickel 21.2, quarter 24.3
    // Each denomination is told apart by SIZE + a big high-contrast value
    // label (not by tiny portraits). Coins get distinct rim colors; bills get
    // distinct backgrounds + a large centre numeral.
    const MONEY = [
      { id:'penny',   name:'Penny',   cents:1,   kind:'coin', size:96  },
      { id:'nickel',  name:'Nickel',  cents:5,   kind:'coin', size:108 },
      { id:'dime',    name:'Dime',    cents:10,  kind:'coin', size:88  },
      { id:'quarter', name:'Quarter', cents:25,  kind:'coin', size:122 },
      { id:'dollar',  name:'Dollar Bill',     cents:100,  kind:'bill', w:170, h:74,  color:'#5a8f5a', label:'$1'   },
      { id:'five',    name:'Five Dollar Bill', cents:500,  kind:'bill', w:180, h:78,  color:'#8a5fae', label:'$5'   },
      { id:'ten',     name:'Ten Dollar Bill',  cents:1000, kind:'bill', w:190, h:82,  color:'#c25a3a', label:'$10'  },
    ];

    // Coins are told apart by the BIG centre value (1¢/5¢/10¢/25¢), by size,
    // and by a distinct rim colour — not by tiny portraits a toddler can't read.
    const COIN_DETAILS = {
      penny:   { material:'copper', valueText:'1¢',  rim:'#7a3d1c', ink:'#5e2a10' },
      nickel:  { material:'silver', valueText:'5¢',  rim:'#3a6ea5', ink:'#1a3a5e' },
      dime:    { material:'silver', valueText:'10¢', rim:'#2e8b57', ink:'#16472b' },
      quarter: { material:'silver', valueText:'25¢', rim:'#9b4dca', ink:'#4a1a63' },
    };

    function makeCoin(c) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      const s = c.size;
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('width', s); svg.setAttribute('height', s);
      svg.classList.add('coin-svg');
      svg.dataset.id = c.id;
      const d = COIN_DETAILS[c.id];
      const grad = `coingrad_${c.id}`;
      const isCopper = d.material === 'copper';
      // Stops for the disk's metallic look
      const stops = isCopper
        ? '<stop offset="0%" stop-color="#f4b58e"/><stop offset="60%" stop-color="#c97a4a"/><stop offset="100%" stop-color="#7a3d1c"/>'
        : '<stop offset="0%" stop-color="#f4f4f4"/><stop offset="60%" stop-color="#bcbcbc"/><stop offset="100%" stop-color="#5e5e5e"/>';
      svg.innerHTML = `
        <defs>
          <radialGradient id="${grad}" cx="0.35" cy="0.3" r="0.85">${stops}</radialGradient>
        </defs>
        <!-- disk -->
        <circle cx="50" cy="50" r="48" fill="url(#${grad})" stroke="#3a3a3a" stroke-width="1.5"/>
        <!-- coloured rim so each coin reads differently at a glance -->
        <circle cx="50" cy="50" r="45" fill="none" stroke="${d.rim}" stroke-width="4"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="${d.rim}" stroke-width="1" opacity="0.5"/>
        <!-- BIG centre value: the primary identifier -->
        <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
              font-size="34" font-weight="900" fill="${d.ink}"
              font-family="Arial, sans-serif" stroke="#fff" stroke-width="0.8"
              paint-order="stroke">${d.valueText}</text>
      `;
      return svg;
    }

    function makeBill(b) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 200 90');
      svg.setAttribute('width', b.w); svg.setAttribute('height', b.h);
      svg.classList.add('bill-svg');
      svg.dataset.id = b.id;
      // Distinct background colour per bill + a large centre numeral so the
      // denomination is obvious without reading tiny corner print.
      svg.innerHTML = `
        <rect x="2" y="2" width="196" height="86" rx="6" fill="${b.color}" stroke="#1a2a1a" stroke-width="2"/>
        <rect x="8" y="8" width="184" height="74" rx="4" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
        <!-- BIG centre numeral: the primary identifier -->
        <text x="100" y="45" text-anchor="middle" dominant-baseline="central"
              font-size="48" font-weight="900" fill="#fff"
              font-family="Arial, sans-serif" stroke="#1a2a1a" stroke-width="1.5"
              paint-order="stroke">${b.label}</text>
        <!-- corner numerals -->
        <text x="18" y="26" font-size="14" font-weight="900" fill="#fff" font-family="Arial, sans-serif">${b.label}</text>
        <text x="182" y="72" text-anchor="end" font-size="14" font-weight="900" fill="#fff" font-family="Arial, sans-serif">${b.label}</text>
      `;
      return svg;
    }

    function makeMoney(m) {
      return m.kind === 'coin' ? makeCoin(m) : makeBill(m);
    }

    function moneyLabel(cents) {
      if (cents >= 100) {
        const dollars = Math.floor(cents / 100);
        const rem = cents % 100;
        return rem === 0 ? `$${dollars}` : `$${dollars}.${String(rem).padStart(2, '0')}`;
      }
      return `${cents}¢`;
    }

    const bodyEl = document.getElementById('body');
    const hint   = document.getElementById('hint');
    let roundTimer = null;
    let lastTargetId = null;
    window.addEventListener('beforeunload', () => clearTimeout(roundTimer));

    // Make-change round (Grade 3+): "It costs 65¢, you pay $1 — what's the change?"
    function changeRound() {
      bodyEl.innerHTML = ''; clearTimeout(roundTimer);
      // Grade 4+ sometimes pays $5 for a dollars-range price; otherwise pay $1
      const bigRound = tier >= 10 && Math.random() < 0.5;
      const paid = bigRound ? 500 : 100;
      const price = bigRound
        ? 25 * (1 + Math.floor(Math.random() * 19))            // 25¢..475¢ step 25
        : 5 * (1 + Math.floor(Math.random() * 19));            // 5¢..95¢ step 5
      const change = paid - price;

      hint.textContent = `It costs ${moneyLabel(price)}. You pay ${moneyLabel(paid)}. How much change?`;

      const row = document.createElement('div'); row.className = 'money-row';
      const tag = document.createElement('div');
      tag.style.cssText = 'font-size:clamp(34px,8vw,52px);font-weight:900;color:white;display:flex;align-items:center;gap:10px;';
      tag.textContent = `🏷️ ${moneyLabel(price)}`;
      row.appendChild(tag);
      row.appendChild(makeMoney(MONEY.find(m => m.cents === paid) || MONEY[MONEY.length - 1]));
      bodyEl.appendChild(row);

      const step = bigRound ? 25 : 5;
      const choices = new Set([change]);
      while (choices.size < 4) {
        const r = change + (Math.floor(Math.random() * 7) - 3) * step;
        if (r > 0 && r < paid && r !== change) choices.add(r);
      }
      const numRow = document.createElement('div'); numRow.className = 'num-row';
      [...choices].sort((a, b) => a - b).forEach(n => {
        const btn = document.createElement('div');
        btn.className = 'num-btn'; btn.textContent = moneyLabel(n);
        btn.addEventListener('pointerdown', () => {
          if (n === change) {
            playSuccess();
            if (window.vbProgress) vbProgress.record('money');
            btn.style.background = 'rgba(168,230,207,0.5)';
            roundTimer = setTimeout(nextRound, 2000);
          } else {
            btn.classList.add('wrong');
            playBoop();
            setTimeout(() => btn.classList.remove('wrong'), 350);
          }
        });
        numRow.appendChild(btn);
      });
      bodyEl.appendChild(numRow);
    }

    function nextRound() {
      bodyEl.innerHTML = ''; clearTimeout(roundTimer);
      if (changeOn && Math.random() < 0.45) { changeRound(); return; }

      // Pool by tier
      const pool = tier <= 4
        ? MONEY.filter(m => ['penny','nickel','dime','quarter'].includes(m.id))
        : tier <= 6
          ? MONEY.filter(m => m.id !== 'ten')
          : MONEY;

      if (!countOn) {
        // Identify the named coin/bill — never repeat the previous target
        const choosable = pool.filter(m => m.id !== lastTargetId);
        const target = choosable[Math.floor(Math.random() * choosable.length)];
        lastTargetId = target.id;
        hint.textContent = `Tap the ${target.name}!`;
        setTimeout(() => speak(`Tap the ${target.name}.`), 300);
        const row = document.createElement('div'); row.className = 'money-row';
        [...pool].sort(() => Math.random() - 0.5).forEach(m => {
          const node = makeMoney(m);
          node.addEventListener('pointerdown', () => {
            if (m.id === target.id) {
              node.classList.add('matched');
              playSuccess();
              if (window.vbProgress) vbProgress.record('money');
              speak(`Yes! That's the ${m.name}.`);
              roundTimer = setTimeout(nextRound, 1800);
            } else {
              node.classList.add('wrong');
              playBoop();
              setTimeout(() => node.classList.remove('wrong'), 350);
            }
          });
          row.appendChild(node);
        });
        bodyEl.appendChild(row);

      } else {
        // Count the pile, tap the total
        const maxItems = tier <= 6 ? 3 : 4;
        const numItems = 1 + Math.floor(Math.random() * (maxItems - 1));
        const pile = [];
        let total = 0;
        for (let i = 0; i < numItems; i++) {
          const m = pool[Math.floor(Math.random() * pool.length)];
          pile.push(m); total += m.cents;
        }
        hint.textContent = 'How much money?';
        setTimeout(() => speak('How much money is here?'), 300);
        const row = document.createElement('div'); row.className = 'money-row';
        pile.forEach(m => row.appendChild(makeMoney(m)));
        bodyEl.appendChild(row);

        // Build 4 answer choices: the right one + 3 distractors
        const choices = new Set([total]);
        const step = total < 100 ? 5 : 50;
        while (choices.size < 4) {
          const r = Math.max(1, total + (Math.floor(Math.random() * 6) - 3) * step);
          if (r !== total) choices.add(r);
        }
        const numRow = document.createElement('div'); numRow.className = 'num-row';
        [...choices].sort((a,b) => a-b).forEach(n => {
          const btn = document.createElement('div');
          btn.className = 'num-btn'; btn.textContent = moneyLabel(n);
          btn.addEventListener('pointerdown', () => {
            if (n === total) {
              playSuccess();
              if (window.vbProgress) { vbProgress.record('money'); vbProgress.mastery('money.mastery'); }
              speak(`Yes! ${moneyLabel(total)}.`);
              btn.style.background = 'rgba(168,230,207,0.5)';
              roundTimer = setTimeout(nextRound, 2000);
            } else {
              btn.classList.add('wrong');
              playBoop();
              setTimeout(() => btn.classList.remove('wrong'), 350);
            }
          });
          numRow.appendChild(btn);
        });
        bodyEl.appendChild(numRow);
      }
    }
    nextRound();
    })();
  </script>
</body>
</html>
