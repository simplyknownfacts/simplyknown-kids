<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Money Matters</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: linear-gradient(160deg, #3d5a3d, #1f3a1f); }
    .screen {
      justify-content: flex-start !important;
      padding: calc(70px + env(safe-area-inset-top)) 12px 200px;
      overflow-y: auto; gap: 18px;
    }
    .money-row {
      display: flex; gap: 14px; flex-wrap: wrap;
      justify-content: center; align-items: center;
      max-width: 720px;
    }
    .coin-svg, .bill-svg { cursor: pointer; transition: transform 0.12s;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5)); }
    .coin-svg:active, .bill-svg:active { transform: scale(0.92); }
    .coin-svg.matched, .bill-svg.matched { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5)) drop-shadow(0 0 8px #a8e6cf); }
    .coin-svg.wrong, .bill-svg.wrong { animation: shake 0.3s; }
    .num-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .num-btn {
      min-width: 90px; min-height: 70px; padding: 12px 18px; border-radius: 18px;
      background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.25);
      color: white; font-size: 24px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.12s;
    }
    .num-btn:active { transform: scale(0.9); }
    .num-btn.wrong { animation: shake 0.3s; background: rgba(255,107,107,0.3); }
    @keyframes shake {0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  </style>
</head>
<body>
  <div class="screen" id="stage">
    <div class="title">💰 Money</div>
    <div class="subtitle" id="hint"></div>
    <div id="body" class="col" style="gap:20px; width:100%; align-items:center;"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'money');
    renderBackBtn('index.html');
    gameSettings.attach('money');

    const countOn = tier >= 6 || getProfileFeature(profile, 'money', 'countMode');

    // Real-world relative sizes (dime smallest, quarter biggest among coins).
    // Diameters (px) on phones; bills are rectangles.
    // Real diameters: dime 17.9, penny 19.05, nickel 21.2, quarter 24.3
    const MONEY = [
      { id:'penny',   name:'Penny',   cents:1,   kind:'coin', size:96 },
      { id:'nickel',  name:'Nickel',  cents:5,   kind:'coin', size:108 },
      { id:'dime',    name:'Dime',    cents:10,  kind:'coin', size:88 },
      { id:'quarter', name:'Quarter', cents:25,  kind:'coin', size:122 },
      { id:'dollar',  name:'Dollar Bill',     cents:100,  kind:'bill', w:170, h:74,  color:'#7fa57a', label:'$1'   },
      { id:'five',    name:'Five Dollar Bill', cents:500,  kind:'bill', w:180, h:78,  color:'#c9a87a', label:'$5'   },
      { id:'ten',     name:'Ten Dollar Bill',  cents:1000, kind:'bill', w:190, h:82,  color:'#c4a06a', label:'$10'  },
    ];

    // Each coin gets a distinctive presidential profile silhouette that matches
    // the actual obverse. Not pixel-accurate engraving (we'd have to import the
    // real Mint art) but visually distinct from each other and identifiable.
    const COIN_DETAILS = {
      penny: {
        material: 'copper',
        topText: 'LIBERTY',
        bottomText: 'ONE CENT',
        valueText: '1¢',
        year: '2024',
        // Lincoln: tall stovepipe-y top, prominent beard line
        portraitPath: `
          <!-- coat collar -->
          <path d="M-13,12 Q-10,18 0,18 Q10,18 13,12 Q10,16 0,16 Q-10,16 -13,12 Z"/>
          <!-- chin + neck -->
          <path d="M-8,3 Q-7,9 -1,11 L7,11 Q11,9 12,5 Q8,7 0,7 Q-5,7 -8,3 Z"/>
          <!-- beard -->
          <path d="M-6,1 Q-4,8 0,8 Q4,8 6,1 Q3,4 0,4 Q-3,4 -6,1 Z"/>
          <!-- face/head -->
          <path d="M-9,-8 Q-9,-13 -4,-15 Q4,-17 10,-12 Q12,-6 11,-2 Q10,2 6,3 Q0,3 -5,0 Q-9,-3 -9,-8 Z"/>
          <!-- hair (full top) -->
          <path d="M-8,-15 Q-2,-20 8,-18 Q12,-15 11,-12 Q4,-14 -4,-13 Q-8,-13 -8,-15 Z"/>
          <!-- ear -->
          <ellipse cx="-2" cy="-4" rx="1.5" ry="2"/>
        `,
      },
      nickel: {
        material: 'silver',
        topText: 'LIBERTY',
        bottomText: 'FIVE CENTS',
        valueText: '5¢',
        year: '2024',
        // Jefferson: front-facing modern nickel — but we draw side profile
        // with a ponytail/wig look.
        portraitPath: `
          <!-- collar -->
          <path d="M-12,12 Q-9,17 0,17 Q9,17 12,12 Q9,15 0,15 Q-9,15 -12,12 Z"/>
          <!-- neck -->
          <path d="M-5,3 Q-4,10 0,11 L5,11 Q8,10 8,5 Q5,7 0,7 Q-3,7 -5,3 Z"/>
          <!-- head -->
          <path d="M-9,-10 Q-9,-14 -3,-16 Q5,-17 9,-12 Q10,-7 9,-2 Q7,3 1,3 Q-5,2 -8,-2 Q-9,-6 -9,-10 Z"/>
          <!-- hair swept back -->
          <path d="M-7,-15 Q-2,-18 5,-17 Q9,-15 9,-11 Q4,-13 -2,-13 Q-7,-13 -7,-15 Z"/>
          <!-- ponytail tied at neck -->
          <ellipse cx="-7" cy="0" rx="2" ry="3"/>
          <!-- ear -->
          <ellipse cx="-1" cy="-5" rx="1.5" ry="2"/>
        `,
      },
      dime: {
        material: 'silver',
        topText: 'LIBERTY',
        bottomText: 'ONE DIME',
        valueText: '10¢',
        year: '2024',
        // Roosevelt: facing LEFT (opposite of others), shorter hair, glasses
        // hint, more rounded.
        portraitPath: `
          <g transform="scale(-1, 1)">
            <!-- collar -->
            <path d="M-11,12 Q-8,16 0,16 Q8,16 11,12 Q8,14 0,14 Q-8,14 -11,12 Z"/>
            <!-- neck -->
            <path d="M-4,2 Q-3,9 0,11 L4,11 Q7,10 7,5 Q4,7 0,7 Q-2,7 -4,2 Z"/>
            <!-- head -->
            <path d="M-8,-10 Q-8,-14 -2,-15 Q5,-15 8,-11 Q9,-6 8,-1 Q5,3 0,3 Q-5,2 -7,-2 Q-8,-6 -8,-10 Z"/>
            <!-- combed hair -->
            <path d="M-7,-13 Q-2,-15 6,-14 Q8,-12 8,-10 Q3,-11 -2,-11 Q-7,-11 -7,-13 Z"/>
            <!-- ear -->
            <ellipse cx="-1" cy="-5" rx="1.2" ry="1.8"/>
          </g>
        `,
      },
      quarter: {
        material: 'silver',
        topText: 'LIBERTY',
        bottomText: 'QUARTER DOLLAR',
        valueText: '25¢',
        year: '2024',
        // Washington: facing LEFT, hair tied with a queue/wig, prominent
        // jowls.
        portraitPath: `
          <g transform="scale(-1, 1)">
            <!-- collar -->
            <path d="M-12,12 Q-9,17 0,17 Q9,17 12,12 Q9,15 0,15 Q-9,15 -12,12 Z"/>
            <!-- neck -->
            <path d="M-5,3 Q-4,10 0,11 L5,11 Q8,10 8,5 Q5,7 0,7 Q-3,7 -5,3 Z"/>
            <!-- head with prominent jaw -->
            <path d="M-9,-10 Q-9,-14 -3,-16 Q5,-16 9,-12 Q10,-6 9,-1 Q7,4 0,4 Q-6,3 -8,-2 Q-9,-6 -9,-10 Z"/>
            <!-- wig hair, full + tied back -->
            <path d="M-8,-15 Q-2,-19 7,-17 Q10,-14 10,-10 Q5,-12 -3,-12 Q-8,-12 -8,-15 Z"/>
            <!-- queue (hair ribbon at back) -->
            <ellipse cx="-8" cy="-2" rx="2.5" ry="4"/>
            <!-- ear -->
            <ellipse cx="-1" cy="-5" rx="1.5" ry="2"/>
          </g>
        `,
      },
    };

    function makeCoin(c) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      const s = c.size;
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('width', s); svg.setAttribute('height', s);
      svg.classList.add('coin-svg');
      svg.dataset.id = c.id;
      const d = COIN_DETAILS[c.id];
      const grad = `coingrad_${c.id}`;
      const isCopper = d.material === 'copper';
      // Stops for the disk's metallic look
      const stops = isCopper
        ? '<stop offset="0%" stop-color="#f4b58e"/><stop offset="60%" stop-color="#c97a4a"/><stop offset="100%" stop-color="#7a3d1c"/>'
        : '<stop offset="0%" stop-color="#f4f4f4"/><stop offset="60%" stop-color="#bcbcbc"/><stop offset="100%" stop-color="#5e5e5e"/>';
      const inkColor = isCopper ? '#5e2a10' : '#2a2a2a';
      const ringColor = isCopper ? '#6b3417' : '#555';
      // Position top text along an arc, bottom text along a lower arc
      svg.innerHTML = `
        <defs>
          <radialGradient id="${grad}" cx="0.35" cy="0.3" r="0.85">${stops}</radialGradient>
          <path id="topArc_${c.id}" d="M 16 50 A 34 34 0 0 1 84 50" fill="none"/>
          <path id="botArc_${c.id}" d="M 16 50 A 34 34 0 0 0 84 50" fill="none"/>
        </defs>
        <!-- disk -->
        <circle cx="50" cy="50" r="48" fill="url(#${grad})" stroke="#3a3a3a" stroke-width="1.5"/>
        <!-- inner reeded ring -->
        <circle cx="50" cy="50" r="44" fill="none" stroke="${ringColor}" stroke-width="0.6" stroke-dasharray="0.8,1.4"/>
        <!-- top text along arc -->
        <text font-size="6.5" font-weight="700" fill="${inkColor}" font-family="serif" letter-spacing="1.2">
          <textPath href="#topArc_${c.id}" startOffset="50%" text-anchor="middle">${d.topText}</textPath>
        </text>
        <!-- bottom text along arc -->
        <text font-size="6" font-weight="700" fill="${inkColor}" font-family="serif" letter-spacing="0.8">
          <textPath href="#botArc_${c.id}" startOffset="50%" text-anchor="middle">${d.bottomText}</textPath>
        </text>
        <!-- year -->
        <text x="74" y="60" font-size="5.5" font-weight="700" fill="${inkColor}" font-family="serif">${d.year}</text>
        <!-- "IN GOD WE TRUST" tiny on the left -->
        <text x="14" y="60" font-size="3.5" font-weight="700" fill="${inkColor}" font-family="serif">IN GOD</text>
        <text x="14" y="64" font-size="3.5" font-weight="700" fill="${inkColor}" font-family="serif">WE TRUST</text>
        <!-- portrait silhouette -->
        <g transform="translate(50,52)" fill="${inkColor}">${d.portraitPath}</g>
        <!-- big value chip (so toddlers can read it) -->
        <text x="50" y="92" text-anchor="middle" font-size="11" font-weight="900"
              fill="${inkColor}" font-family="serif">${d.valueText}</text>
      `;
      return svg;
    }

    function makeBill(b) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 200 90');
      svg.setAttribute('width', b.w); svg.setAttribute('height', b.h);
      svg.classList.add('bill-svg');
      svg.dataset.id = b.id;
      svg.innerHTML = `
        <rect x="2" y="2" width="196" height="86" rx="6" fill="${b.color}" stroke="#2c3d2c" stroke-width="2"/>
        <rect x="8" y="8" width="184" height="74" rx="4" fill="none" stroke="#2c3d2c" stroke-width="1"/>
        <!-- center oval portrait -->
        <ellipse cx="100" cy="45" rx="22" ry="28" fill="rgba(255,255,255,0.55)" stroke="#2c3d2c" stroke-width="1"/>
        <g transform="translate(100,45)" fill="#2c3d2c">
          <ellipse cx="0" cy="-6" rx="8" ry="10"/>
          <path d="M-9,3 Q-7,11 0,11 Q7,11 9,3 Q4,6 0,5 Q-4,6 -9,3 Z"/>
        </g>
        <!-- corner numerals -->
        <text x="20" y="28" font-size="18" font-weight="900" fill="#2c3d2c" font-family="serif">${b.label}</text>
        <text x="180" y="68" text-anchor="end" font-size="18" font-weight="900" fill="#2c3d2c" font-family="serif">${b.label}</text>
        <text x="20" y="68" font-size="10" font-weight="700" fill="#2c3d2c" font-family="serif">${b.label}</text>
        <text x="180" y="28" text-anchor="end" font-size="10" font-weight="700" fill="#2c3d2c" font-family="serif">${b.label}</text>
      `;
      return svg;
    }

    function makeMoney(m) {
      return m.kind === 'coin' ? makeCoin(m) : makeBill(m);
    }

    function moneyLabel(cents) {
      if (cents >= 100) {
        const dollars = Math.floor(cents / 100);
        const rem = cents % 100;
        return rem === 0 ? `$${dollars}` : `$${dollars}.${String(rem).padStart(2, '0')}`;
      }
      return `${cents}¢`;
    }

    const bodyEl = document.getElementById('body');
    const hint   = document.getElementById('hint');
    let roundTimer = null;
    let lastTargetId = null;
    window.addEventListener('beforeunload', () => clearTimeout(roundTimer));

    function nextRound() {
      bodyEl.innerHTML = ''; clearTimeout(roundTimer);

      // Pool by tier
      const pool = tier <= 4
        ? MONEY.filter(m => ['penny','nickel','dime','quarter'].includes(m.id))
        : tier <= 6
          ? MONEY.filter(m => m.id !== 'ten')
          : MONEY;

      if (!countOn) {
        // Identify the named coin/bill — never repeat the previous target
        const choosable = pool.filter(m => m.id !== lastTargetId);
        const target = choosable[Math.floor(Math.random() * choosable.length)];
        lastTargetId = target.id;
        hint.textContent = `Tap the ${target.name}!`;
        setTimeout(() => speak(`Tap the ${target.name}.`), 300);
        const row = document.createElement('div'); row.className = 'money-row';
        [...pool].sort(() => Math.random() - 0.5).forEach(m => {
          const node = makeMoney(m);
          node.addEventListener('pointerdown', () => {
            if (m.id === target.id) {
              node.classList.add('matched');
              playSuccess();
              speak(`Yes! That's the ${m.name}.`);
              roundTimer = setTimeout(nextRound, 1800);
            } else {
              node.classList.add('wrong');
              playBoop();
              setTimeout(() => node.classList.remove('wrong'), 350);
            }
          });
          row.appendChild(node);
        });
        bodyEl.appendChild(row);

      } else {
        // Count the pile, tap the total
        const maxItems = tier <= 6 ? 3 : 4;
        const numItems = 1 + Math.floor(Math.random() * (maxItems - 1));
        const pile = [];
        let total = 0;
        for (let i = 0; i < numItems; i++) {
          const m = pool[Math.floor(Math.random() * pool.length)];
          pile.push(m); total += m.cents;
        }
        hint.textContent = 'How much money?';
        setTimeout(() => speak('How much money is here?'), 300);
        const row = document.createElement('div'); row.className = 'money-row';
        pile.forEach(m => row.appendChild(makeMoney(m)));
        bodyEl.appendChild(row);

        // Build 4 answer choices: the right one + 3 distractors
        const choices = new Set([total]);
        const step = total < 100 ? 5 : 50;
        while (choices.size < 4) {
          const r = Math.max(1, total + (Math.floor(Math.random() * 6) - 3) * step);
          if (r !== total) choices.add(r);
        }
        const numRow = document.createElement('div'); numRow.className = 'num-row';
        [...choices].sort((a,b) => a-b).forEach(n => {
          const btn = document.createElement('div');
          btn.className = 'num-btn'; btn.textContent = moneyLabel(n);
          btn.addEventListener('pointerdown', () => {
            if (n === total) {
              playSuccess();
              speak(`Yes! ${moneyLabel(total)}.`);
              btn.style.background = 'rgba(168,230,207,0.5)';
              roundTimer = setTimeout(nextRound, 2000);
            } else {
              btn.classList.add('wrong');
              playBoop();
              setTimeout(() => btn.classList.remove('wrong'), 350);
            }
          });
          numRow.appendChild(btn);
        });
        bodyEl.appendChild(numRow);
      }
    }
    nextRound();
    })();
  </script>
</body>
</html>
