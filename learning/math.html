<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Math Mountain</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #2d8659, #1a5a3a); }
    .screen { justify-content: flex-start !important;
              padding-top: calc(70px + env(safe-area-inset-top));
              padding-bottom: 200px;
              overflow-y: auto; }

    .eq-row {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      justify-content: center; font-size: clamp(48px, 12vw, 96px); font-weight: 900;
      color: white; text-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .pile {
      display: inline-flex; flex-wrap: wrap; gap: 6px;
      max-width: 220px; padding: 10px; border-radius: 16px;
      background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2);
      align-items: center; justify-content: center;
    }
    .pile .item { font-size: clamp(32px, 7vw, 56px); line-height: 1; }
    .op { font-size: clamp(48px, 10vw, 80px); color: #FFD93D; }
    .answer-box {
      min-width: 110px; min-height: 80px; border-radius: 16px;
      border: 4px dashed rgba(255,255,255,0.5);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: clamp(48px, 10vw, 80px); font-weight: 900; color: white;
    }
    .answer-box.filled { border-style: solid; background: rgba(168,230,207,0.3); }
    .num-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .num-btn {
      min-width: 70px; min-height: 70px; padding: 12px 16px; border-radius: 18px;
      background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.25);
      color: white; font-size: 28px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.12s;
    }
    .num-btn:active { transform: scale(0.9); }
    .num-btn.wrong { animation: shake 0.3s; background: rgba(255,107,107,0.4); }
    @keyframes shake {0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

    /* Low tiers (≤4): piles are tiny (≤3 items) — keep the whole equation on one
       row so it reads "pile + pile = box" left-to-right instead of wrapping. */
    body.low-tier .eq-row { flex-wrap: nowrap; gap: 8px; font-size: clamp(36px, 9vw, 72px); }
    body.low-tier .pile { max-width: 130px; padding: 6px; gap: 4px; }
    body.low-tier .pile .item { font-size: clamp(24px, 6vw, 44px); }
    body.low-tier .op { font-size: clamp(36px, 8vw, 64px); }
    body.low-tier .answer-box { min-width: 72px; min-height: 64px; font-size: clamp(36px, 8vw, 64px); }
  </style>
</head>
<body>
  <div class="screen" id="stage" style="gap:24px;">
    <div class="title">➕ Math Mountain</div>
    <div class="subtitle" id="hint"></div>
    <div id="body" class="col" style="gap:24px;"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'math');
    if (tier <= 4) document.body.classList.add('low-tier');
    renderBackBtn('index.html');
    gameSettings.attach('math');
    if (window.vbProgress) { vbProgress.firstPlay('math'); vbProgress.touchStreak(); }

    // Op availability: auto-on at age-recommended tier OR parent-opted-in via toggle
    const subOn = tier >= 6 || getProfileFeature(profile, 'math', 'subtract');
    const mulOn = tier >= 8 || getProfileFeature(profile, 'math', 'multiply');
    const divOn = tier >= 9 || getProfileFeature(profile, 'math', 'divide');
    const missOn = tier >= 10 || getProfileFeature(profile, 'math', 'missingNumber');

    const ITEMS = ['🍎','🍌','🚗','⭐','🐱','🎈','🍦','🦋'];
    const bodyEl = document.getElementById('body');
    const hint   = document.getElementById('hint');
    let roundTimer = null;
    window.addEventListener('beforeunload', () => clearTimeout(roundTimer));

    function pile(n, emoji) {
      const div = document.createElement('div');
      div.className = 'pile';
      for (let i = 0; i < n; i++) {
        const s = document.createElement('span');
        s.className = 'item'; s.textContent = emoji;
        div.appendChild(s);
      }
      return div;
    }

    function pickOp() {
      const ops = ['+'];
      if (subOn) ops.push('−');
      if (mulOn) ops.push('×');
      if (divOn) ops.push('÷');
      return ops[Math.floor(Math.random() * ops.length)];
    }

    function nextRound() {
      bodyEl.innerHTML = ''; clearTimeout(roundTimer);
      const item = ITEMS[Math.floor(Math.random() * ITEMS.length)];

      const op = pickOp();
      let a, b, ans, maxRand;
      if (op === '÷') {
        // built backwards (divisor × quotient) so every problem divides cleanly
        b = 2 + Math.floor(Math.random() * 4); ans = 2 + Math.floor(Math.random() * 8);
        a = b * ans; maxRand = Math.max(12, ans + 5);
      } else if (op === '×') {
        a = 2 + Math.floor(Math.random() * 4); b = 2 + Math.floor(Math.random() * 4);
        ans = a * b; maxRand = Math.max(20, ans + 5);
      } else if (op === '−') {
        if (tier <= 5)      { a = 2 + Math.floor(Math.random() * 5);  b = 1 + Math.floor(Math.random() * (a-1)); maxRand = 10; }
        else if (tier <= 6) { a = 3 + Math.floor(Math.random() * 7);  b = 1 + Math.floor(Math.random() * (a-1)); maxRand = 18; }
        else                { a = 5 + Math.floor(Math.random() * 16); b = 1 + Math.floor(Math.random() * (a-1)); maxRand = Math.max(20, a + 5); }
        ans = a - b;
      } else { // +
        if (tier <= 4)      { a = 1 + Math.floor(Math.random() * 3);  b = 1 + Math.floor(Math.random() * 3);  maxRand = 7;  }
        else if (tier <= 5) { a = 1 + Math.floor(Math.random() * 5);  b = 1 + Math.floor(Math.random() * 5);  maxRand = 12; }
        else if (tier <= 6) { a = 1 + Math.floor(Math.random() * 8);  b = 1 + Math.floor(Math.random() * 8);  maxRand = 18; }
        else                { a = 5 + Math.floor(Math.random() * 16); b = 1 + Math.floor(Math.random() * 16); maxRand = Math.max(20, a + b + 5); }
        ans = a + b;
      }

      // Missing-number problems (7 + ▢ = 12): ask for an operand, not the result.
      const missing = missOn && (op === '+' || op === '−') && Math.random() < 0.35;
      const target = missing ? b : ans;

      hint.textContent = missing ? 'What\'s the missing number?'
                       : op === '−' ? 'How many are left?'
                       : op === '×' || op === '÷' ? 'What\'s the answer?'
                       : tier <= 5 ? 'How many in all?' : 'What\'s the answer?';

      const eq = document.createElement('div'); eq.className = 'eq-row';
      const box = document.createElement('div'); box.className = 'answer-box';
      // Visual piles at lower tiers (skip ×/÷ — groups-of-objects gets confusing)
      if (!missing && tier <= 6 && op !== '×' && op !== '÷') {
        eq.appendChild(pile(a, item));
        const opEl = document.createElement('span'); opEl.className = 'op'; opEl.textContent = op;
        eq.appendChild(opEl);
        eq.appendChild(pile(b, item));
      } else {
        const numA = document.createElement('span'); numA.textContent = a;
        const opEl = document.createElement('span'); opEl.className = 'op'; opEl.textContent = op;
        eq.appendChild(numA); eq.appendChild(opEl);
        if (missing) {
          eq.appendChild(box);          // the blank IS an operand: a + ▢ = ans
        } else {
          const numB = document.createElement('span'); numB.textContent = b;
          eq.appendChild(numB);
        }
      }
      const eqEl = document.createElement('span'); eqEl.className = 'op'; eqEl.textContent = '=';
      eq.appendChild(eqEl);
      if (missing) {
        const numAns = document.createElement('span'); numAns.textContent = ans;
        eq.appendChild(numAns);
      } else {
        eq.appendChild(box);
      }
      bodyEl.appendChild(eq);

      // Speak the equation
      const opWord = op === '+' ? 'plus' : op === '−' ? 'minus' : op === '×' ? 'times' : 'divided by';
      setTimeout(() => speak(missing ? `${a} ${opWord} what equals ${ans}?` : `${a} ${opWord} ${b}?`), 400);

      // Number choices: target + 3 plausible distractors
      const choices = new Set([target]);
      while (choices.size < 4) {
        const r = Math.max(0, Math.min(maxRand, target + Math.floor((Math.random() - 0.5) * 8)));
        if (r !== target) choices.add(r);
      }
      const numRow = document.createElement('div'); numRow.className = 'num-row';
      [...choices].sort(() => Math.random() - 0.5).forEach(n => {
        const btn = document.createElement('div');
        btn.className = 'num-btn'; btn.textContent = n;
        btn.addEventListener('pointerdown', () => {
          if (n === target) {
            box.textContent = target; box.classList.add('filled');
            playSuccess();
            if (window.vbProgress) { vbProgress.record('math'); if (op === '−') vbProgress.mastery('math.mastery'); }
            speak(`${a} ${opWord} ${b} equals ${ans}!`);
            roundTimer = setTimeout(nextRound, 2200);
          } else {
            btn.classList.add('wrong');
            playBoop();
            setTimeout(() => btn.classList.remove('wrong'), 350);
          }
        });
        numRow.appendChild(btn);
      });
      bodyEl.appendChild(numRow);
    }
    nextRound();
    })();
  </script>
</body>
</html>
