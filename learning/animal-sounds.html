<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Animal Sounds</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes.css">
  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #2d5016, #1a3a0a); position:relative; overflow:hidden; }
    .screen { justify-content: flex-start !important;
              padding-top: calc(70px + env(safe-area-inset-top));
              padding-bottom: 200px;
              overflow-y: auto; }

    #garden { position:fixed; inset:0; }
    .animal-float {
      position:absolute;
      display:flex; flex-direction:column; align-items:center; gap:6px;
      cursor:pointer;
      transform: translate(-50%, -50%);
    }
    .animal-float .af-emoji { font-size:clamp(60px,16vw,110px); line-height:1; }
    .animal-float .af-name  {
      font-size:16px; font-weight:800; color:white;
      text-shadow:0 2px 10px rgba(0,0,0,0.9);
      background:rgba(0,0,0,0.35); border-radius:20px;
      padding:3px 10px;
    }
    @keyframes animalPop {
      0%   { transform:translate(-50%,-50%) scale(0); opacity:0; }
      70%  { transform:translate(-50%,-50%) scale(1.15); opacity:1; }
      100% { transform:translate(-50%,-50%) scale(1); opacity:1; }
    }
    @keyframes jiggle {
      0%,100% { transform:translate(-50%,-50%) rotate(0deg) scale(1); }
      25%     { transform:translate(-50%,-50%) rotate(-10deg) scale(1.1); }
      75%     { transform:translate(-50%,-50%) rotate(10deg) scale(1.1); }
    }
    @keyframes grow {
      0%   { transform:translate(-50%,-50%) scale(1);   }
      100% { transform:translate(-50%,-50%) scale(1.6); }
    }
    @keyframes fadeOut {
      0%   { transform:translate(-50%,-50%) scale(1.6); opacity:1; }
      100% { transform:translate(-50%,-50%) scale(0.5); opacity:0; }
    }
    .animal-float.popping  { animation:animalPop 0.4s ease forwards; }
    .animal-float.jiggling { animation:jiggle 0.45s ease; }
    .animal-float.growing  { animation:grow 0.5s ease forwards; }
    .animal-float.fading   { animation:fadeOut 0.4s ease forwards;
                             pointer-events:none; }

    /* Quiz mode (tier 5+) */
    #quizArea { display:none; }
    .choice-btn {
      min-width: var(--tap); min-height: var(--tap);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.12);
      border: 3px solid rgba(255,255,255,0.2);
      font-size: 52px; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 12px 16px; gap: 4px;
      transition: transform 0.12s;
    }
    .choice-btn:active { transform: scale(0.9); }
    .choice-btn .cname { font-size: 14px; font-weight: 800; color: white; }

    /* Younger ages (tier <= 3): bigger emoji + more spacing. */
    body.young-icons .af-emoji { font-size: clamp(84px, 20vw, 140px); }
    body.young-icons .choice-btn { font-size: 68px; }
    body.young-icons .choice-btn .cname { font-size: 17px; }
    body.young-icons .row, body.young-icons .choices-row { gap: 28px; }
  </style>
</head>
<body>
  <div id="garden"></div>
  <div id="quizArea" class="screen">
    <div class="title">🐘 Animal Sounds</div>
    <div class="subtitle" id="instruction"></div>
    <div id="quizStage" class="col"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'animal-sounds');
    if (tier <= 3) document.body.classList.add('young-icons');
    renderBackBtn('index.html');
    gameSettings.attach('animal-sounds');
    if (window.vbProgress) { vbProgress.firstPlay('animal-sounds'); vbProgress.touchStreak(); }

    const quizOn = tier >= 5 || getProfileFeature(profile, 'animal-sounds', 'quizMode');

    // Merge manifest animals (id, name, sound) with display emojis
    const ANIMAL_EMOJI = {
      cow:'🐮', dog:'🐶', cat:'🐱', frog:'🐸', lion:'🦁', elephant:'🐘',
      sheep:'🐑', rooster:'🐓', duck:'🦆', horse:'🐴', pig:'🐷', bear:'🐻',
      owl:'🦉', snake:'🐍', bee:'🐝', monkey:'🐵', chicken:'🐔', goat:'🐐',
      donkey:'🫏', mouse:'🐭', tiger:'🐯', wolf:'🐺', whale:'🐳', dolphin:'🐬',
      seal:'🦭', bird:'🐦', crow:'🐦‍⬛', turkey:'🦃', rabbit:'🐰', fox:'🦊',
    };
    const ANIMALS = (typeof VOICE_MANIFEST !== 'undefined' ? VOICE_MANIFEST.animals : [])
      .map(a => ({ ...a, emoji: ANIMAL_EMOJI[a.id] || '🐾' }));

    let lastIdx = -1;
    function pickAnimal(exclude) {
      let i;
      do { i = Math.floor(Math.random() * ANIMALS.length); } while (i === exclude);
      lastIdx = i; return ANIMALS[i];
    }
    function pickGroup(n) {
      return [...ANIMALS].sort(() => Math.random() - 0.5).slice(0, n);
    }
    // Speak "The Dog says," — then play the real animal sound.
    // Voice clip is ~1s; SFX fires ~1.1s after to feel like one phrase.
    function speakAnimal(a) {
      speak(`The ${a.name} says,`);
      setTimeout(() => {
        const sfx = new Audio(`${rootPath()}audio/sounds/${a.id}.mp3`);
        sfx.play().catch(() => {});
      }, 1100);
    }

    // ── GARDEN MODE (tier ≤ 4) ───────────────────────────────────────────────
    if (!quizOn) {
      const garden = document.getElementById('garden');
      const gardenAnimals = [];

      function findSpot() {
        const margin = 90;
        const W = window.innerWidth, H = window.innerHeight;
        for (let attempt = 0; attempt < 25; attempt++) {
          const x = margin + Math.random() * (W - margin * 2);
          const y = margin + Math.random() * (H - margin * 2);
          if (!gardenAnimals.some(a => Math.hypot(a.x - x, a.y - y) < 140)) {
            return { x, y };
          }
        }
        return {
          x: margin + Math.random() * (window.innerWidth  - margin * 2),
          y: margin + Math.random() * (window.innerHeight - margin * 2),
        };
      }

      function removeAnimal(record) {
        const i = gardenAnimals.indexOf(record);
        if (i >= 0) gardenAnimals.splice(i, 1);
        record.el.classList.remove('jiggling');
        record.el.classList.add('fading');
        setTimeout(() => record.el.remove(), 400);
      }

      function spawnGardenAnimal() {
        if (gardenAnimals.length >= 4) return;
        const a = pickAnimal(lastIdx);
        const { x, y } = findSpot();
        const el = document.createElement('div');
        el.className = 'animal-float popping';
        el.style.left = x + 'px';
        el.style.top  = y + 'px';
        el.innerHTML  = `<span class="af-emoji">${a.emoji}</span><span class="af-name">${a.name}</span>`;
        const record = { x, y, el, a };
        const onTap = (ev) => {
          ev.preventDefault();
          if (el.classList.contains('fading') || el.classList.contains('growing')) return;
          el.classList.remove('popping');
          void el.offsetWidth;
          el.classList.add('growing');
          speakAnimal(a);
          playChime();
          if (window.vbProgress) vbProgress.record('animal-sounds');
          setTimeout(() => removeAnimal(record), 700);
          setTimeout(spawnGardenAnimal, 900);
        };
        el.addEventListener('pointerdown', onTap);
        garden.appendChild(el);
        gardenAnimals.push(record);
      }

      // Seed garden with initial animals
      spawnGardenAnimal();
      setTimeout(spawnGardenAnimal, 600);
      setTimeout(spawnGardenAnimal, 1200);
      return;
    }

    // ── QUIZ MODE (tier 5+) ──────────────────────────────────────────────────
    // Garden div is position:fixed inset:0 — it eats clicks even when empty.
    document.getElementById('garden').style.display = 'none';
    document.getElementById('quizArea').style.display = 'flex';

    let roundTimer = null;
    window.addEventListener('beforeunload', () => clearTimeout(roundTimer));

    const instruction = document.getElementById('instruction');
    const quizStage   = document.getElementById('quizStage');

    // Factual metadata so the quiz can grow up: group (biology class) + habitat.
    // (Whales/dolphins/seals are mammals on purpose — a nice older-kid lesson.)
    const ANIMAL_INFO = {
      cow:{g:'mammal',h:'farm'}, dog:{g:'mammal',h:'farm'}, cat:{g:'mammal',h:'farm'},
      frog:{g:'amphibian',h:'wild'}, lion:{g:'mammal',h:'wild'}, elephant:{g:'mammal',h:'wild'},
      sheep:{g:'mammal',h:'farm'}, rooster:{g:'bird',h:'farm'}, duck:{g:'bird',h:'farm'},
      horse:{g:'mammal',h:'farm'}, pig:{g:'mammal',h:'farm'}, bear:{g:'mammal',h:'wild'},
      owl:{g:'bird',h:'wild'}, snake:{g:'reptile',h:'wild'}, bee:{g:'insect',h:'wild'},
      monkey:{g:'mammal',h:'wild'}, chicken:{g:'bird',h:'farm'}, goat:{g:'mammal',h:'farm'},
      donkey:{g:'mammal',h:'farm'}, mouse:{g:'mammal',h:'wild'}, tiger:{g:'mammal',h:'wild'},
      wolf:{g:'mammal',h:'wild'}, whale:{g:'mammal',h:'ocean'}, dolphin:{g:'mammal',h:'ocean'},
      seal:{g:'mammal',h:'ocean'}, bird:{g:'bird',h:'wild'}, crow:{g:'bird',h:'wild'},
      turkey:{g:'bird',h:'farm'}, rabbit:{g:'mammal',h:'wild'}, fox:{g:'mammal',h:'wild'},
    };
    const countFor = () => tier <= 6 ? (tier === 5 ? 2 : 3) : 4;

    function renderRound(items, answerIdx, promptText, opts) {
      opts = opts || {};
      quizStage.innerHTML = '';
      instruction.textContent = promptText;
      if (opts.replay) setTimeout(() => speakAnimal(items[answerIdx]), 400);
      else setTimeout(() => speak(promptText), 400);
      const row = document.createElement('div'); row.className = 'row';
      items.forEach((a, i) => {
        const btn = document.createElement('div'); btn.className = 'choice-btn';
        btn.innerHTML = `<span>${a.emoji}</span><span class="cname">${a.name}</span>`;
        btn.addEventListener('pointerdown', () => {
          if (i === answerIdx) {
            playSuccess();
            if (opts.replay) speakAnimal(a); else speak(`Yes! The ${a.name}.`);
            if (window.vbProgress) { vbProgress.record('animal-sounds'); vbProgress.mastery('animal-sounds.mastery'); }
            btn.style.background = 'rgba(168,230,207,0.4)';
            roundTimer = setTimeout(nextRound, 1800);
          } else {
            playBoop();
            btn.style.background = 'rgba(255,107,107,0.3)';
            setTimeout(() => btn.style.background = '', 500);
          }
        });
        row.appendChild(btn);
      });
      quizStage.appendChild(row);
      if (opts.replay) {
        const r = document.createElement('button'); r.className = 'back-btn';
        r.style.cssText = 'position:static;font-size:20px;width:56px;height:56px;';
        r.textContent = '🔊';
        r.setAttribute('aria-label', 'Play the sound again');
        r.addEventListener('click', () => speakAnimal(items[answerIdx]));
        quizStage.appendChild(r);
      }
    }

    // T4-5: sound. T6-7: + group ("which is a bird?"). T8+: + habitat.
    function soundRound() {
      const c = countFor(); const g = pickGroup(c);
      renderRound(g, Math.floor(Math.random() * c), 'Which animal makes this sound?', { replay: true });
    }
    function categoryRound(key, phraseFor, groups) {
      const which = groups[Math.floor(Math.random() * groups.length)];
      const inSet = ANIMALS.filter(a => ANIMAL_INFO[a.id] && ANIMAL_INFO[a.id][key] === which);
      const outSet = ANIMALS.filter(a => !ANIMAL_INFO[a.id] || ANIMAL_INFO[a.id][key] !== which);
      if (!inSet.length || outSet.length < 1) return soundRound();
      const answer = inSet[Math.floor(Math.random() * inSet.length)];
      const decoys = [...outSet].sort(() => Math.random() - 0.5).slice(0, countFor() - 1);
      const items = [answer, ...decoys].sort(() => Math.random() - 0.5);
      renderRound(items, items.indexOf(answer), phraseFor(which), {});
    }
    function groupRound() {
      const groups = tier >= 8 ? ['mammal','bird','reptile','amphibian','insect'] : ['mammal','bird'];
      const label = { mammal:'a mammal', bird:'a bird', reptile:'a reptile', amphibian:'an amphibian', insect:'an insect' };
      categoryRound('g', (w) => `Which one is ${label[w]}?`, groups);
    }
    function habitatRound() {
      const phrase = { farm:'on a farm', ocean:'in the ocean', wild:'in the wild' };
      categoryRound('h', (w) => `Which one lives ${phrase[w]}?`, ['farm','ocean','wild']);
    }
    function nextRound() {
      const types = tier >= 8 ? ['sound','group','habitat','sound']
                  : tier >= 6 ? ['sound','group','sound']
                  : ['sound'];
      const t = types[Math.floor(Math.random() * types.length)];
      if (t === 'group') return groupRound();
      if (t === 'habitat') return habitatRound();
      return soundRound();
    }

    nextRound();
    })();
  </script>
</body>
</html>
