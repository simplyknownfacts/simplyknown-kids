<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Animal Sounds</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: linear-gradient(160deg, #2d5016, #1a3a0a); }
    .animal-big {
      font-size: clamp(80px, 22vw, 160px);
      cursor: pointer; line-height: 1;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
      transition: transform 0.1s;
    }
    .animal-big:active { transform: scale(0.9); }
    .choice-btn {
      min-width: var(--tap); min-height: var(--tap);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.12);
      border: 3px solid rgba(255,255,255,0.2);
      font-size: 52px; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 12px 16px; gap: 4px;
      transition: transform 0.12s;
    }
    .choice-btn:active { transform: scale(0.9); }
    .choice-btn .cname { font-size: 14px; font-weight: 800; color: white; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="title">🐘 Animal Sounds</div>
    <div class="subtitle" id="instruction"></div>
    <div id="stage" class="col"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const profile = getActiveProfile();
    if (!profile) goProfiles();
    const tier = getActivityTier(profile, 'animal-sounds');
    renderBackBtn('index.html');

    const ANIMALS = [
      { emoji:'🐮', name:'Cow',      sound:'Moo' },
      { emoji:'🐶', name:'Dog',      sound:'Woof' },
      { emoji:'🐱', name:'Cat',      sound:'Meow' },
      { emoji:'🐸', name:'Frog',     sound:'Ribbit' },
      { emoji:'🦁', name:'Lion',     sound:'Roar' },
      { emoji:'🐘', name:'Elephant', sound:'Pawoo' },
      { emoji:'🐑', name:'Sheep',    sound:'Baa' },
      { emoji:'🐓', name:'Rooster',  sound:'Cock-a-doodle-doo' },
    ];

    let lastIdx = -1;
    function pickAnimal(exclude = -1) {
      let i;
      do { i = Math.floor(Math.random() * ANIMALS.length); } while (i === exclude);
      lastIdx = i; return ANIMALS[i];
    }

    function pickGroup(n) {
      return [...ANIMALS].sort(() => Math.random() - 0.5).slice(0, n);
    }

    const stage = document.getElementById('stage');
    const instruction = document.getElementById('instruction');

    function speakAnimal(a) { speak(`${a.sound}! ${a.sound}! I am the ${a.name}!`); }

    function nextRound() {
      stage.innerHTML = '';

      if (tier <= 2) {
        const a = pickAnimal(lastIdx);
        const div = document.createElement('div');
        div.className = 'animal-big pop-in';
        div.textContent = a.emoji;
        stage.appendChild(div);
        instruction.textContent = a.name;
        speakAnimal(a);
        setTimeout(nextRound, 3000);

      } else if (tier <= 4) {
        instruction.textContent = 'Tap the animal!';
        const a = pickAnimal(lastIdx);
        const div = document.createElement('div');
        div.className = 'animal-big pop-in pulse';
        div.textContent = a.emoji;
        div.addEventListener('click', () => {
          playChime(); speakAnimal(a);
          div.classList.remove('pulse');
          setTimeout(nextRound, 2000);
        });
        stage.appendChild(div);

      } else {
        const count = tier <= 6 ? (tier === 5 ? 2 : 3) : 4;
        const group = pickGroup(count);
        const answerIdx = Math.floor(Math.random() * count);
        const target = group[answerIdx];
        instruction.textContent = '';
        setTimeout(() => speakAnimal(target), 400);

        const row = document.createElement('div');
        row.className = 'row';
        group.forEach((a, i) => {
          const btn = document.createElement('div');
          btn.className = 'choice-btn';
          btn.innerHTML = `<span>${a.emoji}</span>${tier >= 7 ? `<span class="cname">${a.name}</span>` : ''}`;
          btn.addEventListener('click', () => {
            if (i === answerIdx) {
              playSuccess(); speakAnimal(a);
              btn.style.background = 'rgba(168,230,207,0.4)';
              setTimeout(nextRound, 1800);
            } else {
              playBoop();
              btn.style.background = 'rgba(255,107,107,0.3)';
              setTimeout(() => btn.style.background = '', 500);
            }
          });
          row.appendChild(btn);
        });
        stage.appendChild(row);

        const replayBtn = document.createElement('button');
        replayBtn.className = 'back-btn';
        replayBtn.style.cssText = 'position:static;font-size:20px;width:56px;height:56px;';
        replayBtn.textContent = '🔊';
        replayBtn.addEventListener('click', () => speakAnimal(target));
        stage.appendChild(replayBtn);
      }
    }

    nextRound();
  </script>
</body>
</html>
