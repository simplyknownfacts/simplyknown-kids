<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Learn</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: linear-gradient(160deg, #4ECDC4 0%, #45B7D1 100%); }
    /* Top-aligned so the mascot in the bottom-right doesn't overlap tiles */
    .screen {
      justify-content: flex-start !important;
      padding-top: calc(90px + env(safe-area-inset-top));
      padding-bottom: 200px; /* room for mascot */
      overflow-y: auto;
    }
    .cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px; max-width: 720px; width: 100%;
      justify-content: center;
    }
    /* Every tile is identical — no shrinking, no growing */
    .activity-card {
      width: 100% !important; height: 130px !important;
      aspect-ratio: 1;
    }
    .activity-card .icon { font-size: 50px; }
    .activity-card .label { font-size: 13px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="title">📚 Learn</div>
    <div class="cards-row" id="cardsRow"></div>
    <div id="emptyMsg" style="display:none;color:rgba(255,255,255,0.75);font-size:15px;text-align:center;padding:24px;">
      No learning activities are turned on for this child yet.<br>
      A grown-up can enable them in ⚙️ Parent Settings → Activities.
    </div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/mascot.js"></script>
  <script>
    function go(page) { playChime(); goTo(page); }
    renderBackBtn('../home.html');
    const profile = getActiveProfile();
    if (!profile) goProfiles();
    const row = document.getElementById('cardsRow');
    const visible = ACTIVITY_FEATURES
      .filter(a => a.section === 'learn')
      .filter(a => isActivityVisible(profile, a.id));
    if (!visible.length) {
      row.style.display = 'none';
      document.getElementById('emptyMsg').style.display = 'block';
    } else {
      visible.forEach(a => {
        const card = document.createElement('div');
        card.className = 'activity-card';
        card.onclick = () => go(a.file);
        card.innerHTML = `<div class="icon">${a.icon}</div><div class="label">${a.name}</div>`;
        row.appendChild(card);
      });
    }
    if (window.mascot) setTimeout(() => mascot.play('learn_intro'), 400);
  </script>
</body>
</html>
