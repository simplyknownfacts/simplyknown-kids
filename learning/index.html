<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Learn</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: linear-gradient(160deg, #4ECDC4 0%, #45B7D1 100%); }
    /* Top-aligned so the mascot in the bottom-right doesn't overlap tiles */
    .screen {
      justify-content: flex-start !important;
      padding-top: calc(90px + env(safe-area-inset-top));
      padding-bottom: 200px; /* room for mascot */
      overflow-y: auto;
    }
    .cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px; max-width: 720px; width: 100%;
      justify-content: center;
    }
    /* Every tile is identical — no shrinking, no growing */
    .activity-card {
      width: 100% !important; height: 130px !important;
      aspect-ratio: 1;
    }
    .activity-card .icon { font-size: 50px; }
    .activity-card .label { font-size: 13px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="title">📚 Learn</div>
    <div class="cards-row">
      <div class="activity-card" onclick="go('hello-colors.html')">
        <div class="icon">🌈</div>
        <div class="label">Hello Colors</div>
      </div>
      <div class="activity-card" onclick="go('animal-sounds.html')">
        <div class="icon">🐘</div>
        <div class="label">Animal Sounds</div>
      </div>
      <div class="activity-card" onclick="go('count-along.html')">
        <div class="icon">🔢</div>
        <div class="label">Count Along</div>
      </div>
      <div class="activity-card" onclick="go('abcs.html')">
        <div class="icon">🔤</div>
        <div class="label">ABCs</div>
      </div>
      <div class="activity-card" onclick="go('days.html')">
        <div class="icon">📅</div>
        <div class="label">Days</div>
      </div>
      <div class="activity-card" onclick="go('math.html')">
        <div class="icon">➕</div>
        <div class="label">Math Mountain</div>
      </div>
      <div class="activity-card" onclick="go('spelling.html')">
        <div class="icon">🐝</div>
        <div class="label">Spelling Bee</div>
      </div>
      <div class="activity-card" onclick="go('money.html')">
        <div class="icon">💰</div>
        <div class="label">Money</div>
      </div>
      <div class="activity-card" onclick="go('body-parts.html')">
        <div class="icon">👤</div>
        <div class="label">Body Parts</div>
      </div>
    </div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/mascot.js"></script>
  <script>
    function go(page) { playChime(); goTo(page); }
    renderBackBtn('../home.html');
    if (!getActiveProfile()) goProfiles();
    if (window.mascot) setTimeout(() => mascot.play('learn_intro'), 400);
  </script>
</body>
</html>
