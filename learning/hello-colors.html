<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Hello Colors</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #bg { position:fixed; inset:0; transition: background 0.8s ease; }
    .screen { justify-content: flex-start !important;
              padding-top: calc(70px + env(safe-area-inset-top));
              padding-bottom: 200px;
              overflow-y: auto; }
    .color-label {
      font-size: clamp(48px, 14vw, 100px);
      font-weight: 900; color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: relative; z-index: 2;
    }
    .things-row {
      display:flex; gap:20px; justify-content:center; flex-wrap:wrap;
      position:relative; z-index:2;
    }
    .thing-card {
      display:flex; flex-direction:column; align-items:center; gap:6px;
      cursor:pointer; transition:transform 0.12s;
    }
    .thing-card:active { transform:scale(0.9); }
    .thing-emoji { font-size: clamp(56px, 13vw, 90px); line-height:1; }
    .thing-name  { font-size:15px; font-weight:800; color:white;
                   text-shadow:0 2px 8px rgba(0,0,0,0.5); text-align:center;
                   visibility:hidden; }
    .thing-card.revealed .thing-name { visibility:visible; }
    .quiz-label {
      font-size: clamp(20px, 5vw, 32px); font-weight:900; color:white;
      text-shadow:0 3px 12px rgba(0,0,0,0.4); position:relative; z-index:2;
      text-align:center;
    }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)}
    }
    .thing-card.wrong { animation: shake 0.3s; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div class="screen" id="screen" style="position:relative;z-index:2;gap:24px;">
    <div class="color-label" id="colorLabel"></div>
    <div class="quiz-label" id="quizLabel"></div>
    <div class="things-row" id="thingsRow"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'hello-colors');
    renderBackBtn('index.html');
    gameSettings.attach('hello-colors');

    const quizOn = tier >= 4 || getProfileFeature(profile, 'hello-colors', 'colorQuiz');

    const COLORS = [
      { name:'Red',    hex:'#FF4444', things:[{e:'🍎',n:'Apple'},{e:'🌹',n:'Rose'},{e:'🚒',n:'Fire Truck'},{e:'❤️',n:'Heart'}] },
      { name:'Blue',   hex:'#4488FF', things:[{e:'🫐',n:'Blueberry'},{e:'🌊',n:'Ocean'},{e:'🐬',n:'Dolphin'},{e:'💙',n:'Blue Heart'}] },
      { name:'Yellow', hex:'#FFD700', things:[{e:'🌻',n:'Sunflower'},{e:'🍋',n:'Lemon'},{e:'⭐',n:'Star'},{e:'🐝',n:'Bee'}] },
      { name:'Green',  hex:'#44CC44', things:[{e:'🐸',n:'Frog'},{e:'🌿',n:'Leaf'},{e:'🥦',n:'Broccoli'},{e:'🐢',n:'Turtle'}] },
      { name:'Purple', hex:'#9966CC', things:[{e:'🍇',n:'Grapes'},{e:'🦄',n:'Unicorn'},{e:'🪻',n:'Flower'},{e:'💜',n:'Purple Heart'}] },
      { name:'Orange', hex:'#FF8C00', things:[{e:'🍊',n:'Orange'},{e:'🎃',n:'Pumpkin'},{e:'🦊',n:'Fox'},{e:'🥕',n:'Carrot'}] },
      { name:'Pink',   hex:'#FF69B4', things:[{e:'🐷',n:'Pig'},{e:'🌸',n:'Blossom'},{e:'🦩',n:'Flamingo'},{e:'🩷',n:'Pink Heart'}] },
    ];

    let colorIdx = 0;
    let autoTimer = null;
    window.addEventListener('beforeunload', () => clearTimeout(autoTimer));

    const label     = document.getElementById('colorLabel');
    const quizLbl   = document.getElementById('quizLabel');
    const thingsRow = document.getElementById('thingsRow');
    const bg        = document.getElementById('bg');
    const screen    = document.getElementById('screen');

    function nextRound() {
      thingsRow.innerHTML = '';
      quizLbl.textContent = '';
      screen.onclick = null;
      clearTimeout(autoTimer);

      if (!quizOn) {
        // Tap-to-advance for everyone: show all things for current color
        const color = COLORS[colorIdx % COLORS.length];
        bg.style.background = color.hex;
        label.textContent = color.name;
        label.style.display = 'block';
        color.things.forEach(t => {
          const card = document.createElement('div');
          card.className = 'thing-card pop-in';
          card.innerHTML = `<span class="thing-emoji">${t.e}</span><span class="thing-name">${t.n}</span>`;
          card.addEventListener('click', (e) => {
            e.stopPropagation();
            card.classList.add('revealed');
            speak(`${t.n}! ${color.name}.`);
          });
          thingsRow.appendChild(card);
        });
        quizLbl.textContent = '👆 Tap a thing or anywhere for the next color!';
        screen.onclick = () => { colorIdx++; nextRound(); };

      } else {
        // Quiz: alternates between two prompts on each round:
        //   • "Tap the BLUE thing!" — decoys are different colors (current)
        //   • "Tap the BLUE BLUEBERRY!" — strict; decoys can be same-color
        //     other things, which trigger a "that's blue, but not a blueberry"
        //     correction (custom near-miss hint).
        label.style.display = 'none';
        bg.style.background = '#1a1a2e';
        const strict = Math.random() < 0.5; // half the rounds use strict-thing mode
        const targetColor = COLORS[Math.floor(Math.random() * COLORS.length)];
        const targetThing = targetColor.things[Math.floor(Math.random() * targetColor.things.length)];

        // Build a 4-card lineup.
        // - Strict mode: target + 1 same-color-different-thing + 2 different-colors
        // - Color mode: target + 3 different-colors (existing behavior)
        const lineup = [{ color: targetColor, thing: targetThing, isAnswer: true }];
        if (strict) {
          // same-color decoy
          const sameColorOthers = targetColor.things.filter(t => t.n !== targetThing.n);
          if (sameColorOthers.length) {
            lineup.push({
              color: targetColor,
              thing: sameColorOthers[Math.floor(Math.random() * sameColorOthers.length)],
              isAnswer: false, sameColor: true,
            });
          }
        }
        const otherColors = COLORS.filter(c => c.name !== targetColor.name).sort(() => Math.random() - 0.5);
        while (lineup.length < 4) {
          const c = otherColors[lineup.length - 1];
          lineup.push({
            color: c,
            thing: c.things[Math.floor(Math.random() * c.things.length)],
            isAnswer: false, sameColor: false,
          });
        }
        lineup.sort(() => Math.random() - 0.5);

        const promptText = strict
          ? `Tap the ${targetColor.name} ${targetThing.n}!`
          : `Tap the ${targetColor.name} thing!`;
        quizLbl.textContent = promptText;
        setTimeout(() => speak(promptText), 300);

        lineup.forEach(slot => {
          const card = document.createElement('div');
          card.className = 'thing-card pop-in';
          card.innerHTML = `<span class="thing-emoji">${slot.thing.e}</span><span class="thing-name">${slot.thing.n}</span>`;
          card.addEventListener('pointerdown', () => {
            if (slot.isAnswer) {
              playSuccess();
              speak(`Yes! ${slot.thing.n} is ${slot.color.name}!`);
              bg.style.background = slot.color.hex;
              label.style.display = 'block';
              label.textContent = slot.color.name;
              autoTimer = setTimeout(nextRound, 1800);
            } else {
              playBoop();
              card.classList.add('wrong');
              setTimeout(() => card.classList.remove('wrong'), 400);
              if (strict && slot.sameColor) {
                speak(`That's ${targetColor.name}, but not a ${targetThing.n}. Tap the ${targetColor.name} ${targetThing.n}.`);
              } else {
                speak('Try again!');
              }
            }
          });
          thingsRow.appendChild(card);
        });
      }
    }

    label.style.display = quizOn ? 'none' : 'block';
    nextRound();
    })();
  </script>
</body>
</html>
