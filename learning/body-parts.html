<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Body Parts</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes.css">
  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #b89b80, #6e533c); }
    .screen { justify-content: flex-start !important;
              padding-top: calc(70px + env(safe-area-inset-top));
              padding-bottom: 64px;
              overflow-y: auto; }
    .figure {
      position: relative;
      width: min(440px, 92vw, calc((100dvh - 230px) * .75)); min-width: 180px; aspect-ratio: 3/4; flex-shrink: 0; touch-action: manipulation;
      margin: 0 auto; overflow: hidden; border-radius: 24px;
    }
    .figure.face-mode {
      --face-size: min(500px, 92vw, calc(100dvh - 245px));
      width: var(--face-size); height: var(--face-size); aspect-ratio: auto;
      background: rgba(255,255,255,.08);
    }
    @media (max-height: 650px) {
      .figure.face-mode { --face-size: min(500px, 92vw, calc(100dvh - 320px)); }
    }
    .body-img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      border-radius: 20px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.3));
      pointer-events: none; -webkit-user-drag: none; user-select: none;
    }
    .figure.face-mode .body-img {
      position: absolute; left: -33.333%; top: 0;
      width: 166.667%; height: 222.222%; max-width: none;
      object-fit: fill; border-radius: 0;
    }
    /* Invisible calibrated ellipse over each visible body part. */
    .hit {
      position: absolute; transform: translate(-50%,-50%);
      border-radius: 50%;
      background: transparent; border: none; padding: 0; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hit:focus-visible { outline: 4px solid #4ecdc4; background: #4ecdc42b; }
    .hit.help { outline: 4px solid #4ecdc4; background: #4ecdc438; }
    .picture-retry { position: absolute; inset: 35% 5% auto; padding: 18px; border-radius: 18px; border: 2px solid #47776c; background: #fff9e5; font: 700 18px system-ui; color: #24594d; cursor: pointer; }
    .hit.wrong { animation: shake 0.35s; }
    @keyframes shake {
      0%,100%{transform:translate(-50%,-50%)}
      25%{transform:translate(calc(-50% - 6px),-50%)}
      75%{transform:translate(calc(-50% + 6px),-50%)}
    }
    .prompt-big {
      font-size: clamp(24px, 6vw, 40px); font-weight: 900;
      color: white; text-shadow: 0 4px 14px rgba(0,0,0,0.4); text-align: center;
    }
    /* Younger ages (tier <= 3): bigger figure so small fingers hit parts. */
    body.young-icons .figure { max-width: 500px; }
    body.young-icons .prompt-big { font-size: clamp(28px, 7vw, 46px); }
  </style>
</head>
<body>
  <div class="screen" id="stage" style="gap:18px;">
    <div class="title">👤 Body Parts</div>
    <div class="prompt-big" id="hint"></div>
    <div class="figure" id="figure" role="group" aria-label="Tap a body part on the child"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sleep-timer.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/body-parts-data.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (async function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'body-parts');
    if (tier <= 3) document.body.classList.add('young-icons');
    renderBackBtn('index.html');
    gameSettings.attach('body-parts');
    if (window.vbProgress) { vbProgress.firstPlay('body-parts'); vbProgress.touchStreak(); }

    const figure = document.getElementById('figure');
    const BODIES = window.BodyPartsData.figures;
    let renderGeneration = 0;
    let imageTimer = null;

    let bodyIdx = Math.floor(Math.random() * BODIES.length);

    const FACE_PARTS = ['eye','ear','nose','mouth','hair'];
    let bodyZones = [];
    let currentHits = [];

    function displayZone(zone, faceMode) {
      if (!faceMode) return {...zone};
      return {
        ...zone,
        cx:(zone.cx-20)/60*100,
        cy:zone.cy/45*100,
        rx:Math.max(zone.rx/60*100, 9.3),
        ry:Math.max(zone.ry/45*100, 9.3),
      };
    }

    function installHits(faceMode) {
      figure.classList.toggle('face-mode', faceMode);
      figure.dataset.view = faceMode ? 'face' : 'body';
      figure.querySelectorAll('.hit').forEach(hit => hit.remove());
      const visibleZones = faceMode ? bodyZones.filter(zone => FACE_PARTS.includes(zone.n)) : bodyZones;
      currentHits = visibleZones.map(sourceZone => {
        const z = displayZone(sourceZone, faceMode);
        const b = document.createElement('button');
        b.type = 'button';b.className = 'hit';b.dataset.name = z.n;
        b.dataset.sourceX = sourceZone.cx;b.dataset.sourceY = sourceZone.cy;
        b.setAttribute('aria-label', z.n);
        b.style.left = z.cx + '%';b.style.top = z.cy + '%';
        b.style.width = (z.rx * 2) + '%';b.style.height = (z.ry * 2) + '%';
        b.style.pointerEvents = 'none';
        // Keyboard and assistive activation use the same transformed resolver.
        b.addEventListener('click', e => {
          if (e.detail !== 0) return;
          const r = figure.getBoundingClientRect();
          handleFigureTap({button:0,isPrimary:true,clientX:r.left+r.width*z.cx/100,clientY:r.top+r.height*z.cy/100});
        });
        figure.appendChild(b);
        return {z,el:b};
      });
    }

    async function renderBody() {
      const generation = ++renderGeneration;
      const body = BODIES[bodyIdx];
      roundSettled = true;
      bodyZones = [];
      currentHits = [];
      figure.classList.remove('face-mode');
      figure.dataset.view = 'body';
      figure.dataset.bodyId = body.id;
      hint.textContent = 'Opening your picture…';
      const img = new Image();
      img.className = 'body-img';
      img.alt = body.seated ? 'A child sitting in a wheelchair' : 'A child standing';
      figure.replaceChildren(img);
      const loaded = await new Promise(resolve => {
        clearTimeout(imageTimer);
        const deadline = setTimeout(() => resolve(false), 5000);
        imageTimer = deadline;
        img.onload = () => { clearTimeout(deadline); resolve(true); };
        img.onerror = () => { clearTimeout(deadline); resolve(false); };
        img.src = body.img;
      });
      if (!pageActive || generation !== renderGeneration) return false;
      if (!loaded) {
        hint.textContent = 'Let’s try opening the picture again.';
        const retry = document.createElement('button');
        retry.className = 'picture-retry';retry.textContent = 'Try picture again';
        retry.addEventListener('click', async () => { if (await renderBody()) nextRound(); });
        figure.replaceChildren(retry);
        return false;
      }
      bodyZones = body.zones;
      installHits(false);
      return true;
    }

    // What's available per tier. With the new tier scheme, tier 4 = Pre-K (3-4y).
    const TODDLER_PARTS = ['eye','nose','mouth','ear','hand','foot'];
    const ALL_PARTS = ['eye','nose','mouth','ear','hand','foot','arm','leg','hair','belly'];
    // Tier 6+: include joints when they are shown in the current drawing.
    const ADV_PARTS = ALL_PARTS.concat(['shoulder','elbow','knee']);
    const allOn = tier >= 4 || getProfileFeature(profile, 'body-parts', 'allParts');
    const advOn = tier >= 6 || getProfileFeature(profile, 'body-parts', 'advParts');
    const partList = advOn ? ADV_PARTS : (allOn ? ALL_PARTS : TODDLER_PARTS);
    const PRONOUN = (p) => ({
      eye:'eyes', ear:'ears', hand:'hands', foot:'feet', arm:'arms', leg:'legs',
    }[p] || p);

    const hint = document.getElementById('hint');
    let target = null;
    let lastTarget = null;
    let roundTimer = null;
    let promptTimer = null;
    let roundGeneration = 0;
    let roundSettled = false;
    let pageActive = true;
    let wrongCount = 0;
    let wrongTimer = null;
    let lastWrongAt = -Infinity;
    let correctCount = 0; // taps since last body switch — rotate every 5
    function disposePage() {
      pageActive = false;
      roundGeneration++;
      renderGeneration++;
      clearTimeout(imageTimer);
      clearTimeout(roundTimer);
      clearTimeout(promptTimer);
      clearTimeout(wrongTimer);
    }
    window.addEventListener('pagehide', disposePage);
    window.addEventListener('beforeunload', disposePage);
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) { pageActive = true; if (bodyZones.length) nextRound(); else renderBody().then(ready => { if (ready) nextRound(); }); }
    });

    // Shuffled "bag": ask EVERY part once before any repeats (random picking gave
    // the same part 3× in 5 taps). Refill + reshuffle when empty, avoiding an
    // immediate repeat across the refill seam.
    let _bag = [];
    function _drawTarget() {
      const available = partList.filter(n => bodyZones.some(zone => zone.n === n));
      _bag = _bag.filter(n => available.includes(n));
      if (!_bag.length) {
        _bag = available.slice();
        for (let i = _bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = _bag[i]; _bag[i] = _bag[j]; _bag[j] = t; }
        if (_bag.length > 1 && _bag[0] === lastTarget) _bag.push(_bag.shift());
      }
      return _bag.shift();
    }

    function nextRound() {
      if (!pageActive || !bodyZones.length) return;
      clearTimeout(roundTimer);
      clearTimeout(promptTimer);
      roundSettled = false;
      wrongCount = 0;
      lastWrongAt = -Infinity;
      clearTimeout(wrongTimer);
      const round = ++roundGeneration;
      target = _drawTarget();
      lastTarget = target;
      installHits(FACE_PARTS.includes(target));
      const prompt = tier <= 2 ? `Where's the ${target}?` : `Tap the ${PRONOUN(target)}!`;
      hint.textContent = prompt;
      promptTimer = setTimeout(() => {
        if (!pageActive || round !== roundGeneration || roundSettled) return;
        if (typeof speakInstruction === 'function') speakInstruction(prompt);
        else speak(prompt);
      }, 400);
      figure.querySelectorAll('.hit').forEach(el => {
        el.classList.remove('wrong','help');
      });
    }

    // Only pictured, calibrated ellipses answer the quiz. Enlarged touch zones
    // may overlap, so the nearest zone centre owns the tap; the requested word
    // must never turn a different visible feature into a correct answer.
    function handleFigureTap(e) {
      if (e.button !== 0 || !e.isPrimary || !pageActive || roundSettled || !currentHits.length || !target) return;
      const r = figure.getBoundingClientRect();
      const px = (e.clientX-r.left)/r.width*100, py = (e.clientY-r.top)/r.height*100;
      const inside = currentHits.map(h => ({...h,d:((px-h.z.cx)/h.z.rx)**2+((py-h.z.cy)/h.z.ry)**2}))
        .filter(h => h.d <= 1);
      if (!inside.length) { hint.textContent = 'Tap the child to find the ' + PRONOUN(target) + '.'; return; }
      inside.sort((a,b) => a.d-b.d || a.z.rx*a.z.ry-b.z.rx*b.z.ry);
      const best = inside[0];
      const name = best.z.n;
      if (name !== target && performance.now()-lastWrongAt < 160) return;
      currentHits.forEach(h => h.el.classList.remove('wrong', 'help'));
      if (name === target) {
        roundSettled = true;
        clearTimeout(promptTimer);
        const completedRound = roundGeneration;
        hint.textContent = 'Yes! You found the ' + PRONOUN(target) + '!';
        if (typeof haptic === 'function') haptic(25);
        playSuccess();
        if (window.vbProgress) {
          vbProgress.record('body-parts');
          if (allOn && (target === 'arm' || target === 'leg' || target === 'hair' || target === 'belly')) {
            vbProgress.mastery('body-parts.mastery');
          }
        }
        speak(hint.textContent);
        correctCount++;
        const rotate = correctCount % 5 === 0;
        roundTimer = setTimeout(async () => {
          if (!pageActive || completedRound !== roundGeneration) return;
          if (rotate && !(await switchBody())) return;
          if (pageActive && completedRound === roundGeneration) nextRound();
        }, 1800);
      } else {
        lastWrongAt = performance.now();
        best.el.classList.add('wrong');
        wrongCount++;
        if (wrongCount >= 2) currentHits.filter(h => h.z.n === target).forEach(h => h.el.classList.add('help'));
        playBoop();
        clearTimeout(wrongTimer);
        wrongTimer = setTimeout(() => best.el.classList.remove('wrong'), 350);
        hint.textContent = `That's the ${PRONOUN(name)}. Find the ${PRONOUN(target)}.`;
        if (tier <= 3) speak(`That's the ${PRONOUN(name)}.`);
        else speak('Try again!');
      }
    }
    figure.addEventListener('pointerdown', handleFigureTap);

    // Pick a DIFFERENT random body and re-render it.
    async function switchBody() {
      if (BODIES.length < 2) return true;
      bodyIdx = (bodyIdx + 1 + Math.floor(Math.random() * (BODIES.length-1))) % BODIES.length;
      return renderBody();
    }

    if (await renderBody()) nextRound();
    })();
  </script>
</body>
</html>
