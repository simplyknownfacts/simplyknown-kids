<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Body Parts</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #b89b80, #6e533c); }
    .screen { justify-content: flex-start !important;
              padding-top: calc(70px + env(safe-area-inset-top));
              padding-bottom: 130px;
              overflow-y: auto; }
    .figure {
      position: relative;
      width: min(440px, 98vw); aspect-ratio: 3/4;
      margin: 0 auto;
    }
    .body-img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      border-radius: 20px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.3));
      pointer-events: none; -webkit-user-drag: none; user-select: none;
    }
    /* Invisible round tap-zone over each body part. aspect-ratio:1 keeps it a
       circle; width is a % of the figure width, left/top set per part. */
    .hit {
      position: absolute; transform: translate(-50%,-50%);
      aspect-ratio: 1; border-radius: 50%;
      background: transparent; border: none; padding: 0; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hit.flash { animation: flash 0.7s ease; }
    .hit.wrong { animation: shake 0.35s; }
    @keyframes flash {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,217,61,0); }
      40%     { box-shadow: 0 0 0 6px rgba(255,217,61,0.95), 0 0 26px 10px rgba(255,217,61,0.7); }
    }
    @keyframes shake {
      0%,100%{transform:translate(-50%,-50%)}
      25%{transform:translate(calc(-50% - 6px),-50%)}
      75%{transform:translate(calc(-50% + 6px),-50%)}
    }
    .prompt-big {
      font-size: clamp(24px, 6vw, 40px); font-weight: 900;
      color: white; text-shadow: 0 4px 14px rgba(0,0,0,0.4); text-align: center;
    }
    /* Younger ages (tier <= 3): bigger figure so small fingers hit parts. */
    body.young-icons .figure { width: min(500px, 100vw); }
    body.young-icons .prompt-big { font-size: clamp(28px, 7vw, 46px); }
  </style>
</head>
<body>
  <div class="screen" id="stage" style="gap:18px;">
    <div class="title">👤 Body Parts</div>
    <div class="prompt-big" id="hint"></div>
    <div class="figure" id="figure"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'body-parts');
    if (tier <= 3) document.body.classList.add('young-icons');
    renderBackBtn('index.html');
    gameSettings.attach('body-parts');
    if (window.vbProgress) { vbProgress.firstPlay('body-parts'); vbProgress.touchStreak(); }

    // A rotating cast of real, diverse kid figures. Each kid is a chroma-keyed
    // PNG (transparent) framed head-at-top / feet-at-bottom in a 3:4 box, so the
    // STANDING kids share one tuned tap-zone template. The wheelchair child is
    // seated and gets its own zones. Invisible round tap-zones overlay each body
    // part; a correct tap glows the zone. Positions are % of the figure box.
    const figure = document.getElementById('figure');

    // Tap zones are MEASURED per figure (v115), not hand-tuned. For each PNG we
    // detected the EYES (dark pupil beside white sclera) and the ARM/HAND extent
    // (alpha bbox per height-band), via canvas pixel analysis. Every FACE part is
    // anchored to the real eye line + eye-spread, so a turned head (body-10/12) or
    // a big-hair kid with low-set eyes (body-07, eyes at ~31%) still lines up.
    // Body parts use the shared standing-pose proportions — all figures are framed
    // identically (content top ~2%, bottom ~98%, centred). The prior per-kid fy/
    // faceCx offsets had drifted (e.g. body-05 fy was -1 but its eyes sit at ~21%
    // → 4% too high), which made taps miss; these anchors are freshly measured.
    // ANCHORS: lx/rx = eye-centre X, y = eye-centre Y; aL/aR = arm extent; hL/hR = hand extent (all % of figure).
    const ANCHORS = {
      1:{lx:46,rx:61.2,y:21.8,aL:34.7,aR:69,hL:29.3,hR:75.3},
      2:{lx:42.8,rx:58,y:22.1,aL:33.7,aR:67,hL:29.7,hR:70.7},
      3:{lx:45.5,rx:59.4,y:25.2,aL:36.3,aR:67.7,hL:32,hR:72},
      4:{lx:42.3,rx:56.6,y:21.1,aL:32,aR:68,hL:24,hR:76},
      5:{lx:41.7,rx:56.6,y:21.2,aL:30.3,aR:70.3,hL:28,hR:72.7},
      6:{lx:43.3,rx:55.9,y:20.1,aL:34,aR:68.7,hL:26.7,hR:73},
      7:{lx:51,rx:63.8,y:30.8,aL:41.3,aR:69,hL:38,hR:72},
      8:{lx:43.7,rx:60.1,y:23.4,aL:31.3,aR:67.7,hL:30.7,hR:68.3},
      10:{lx:37.5,rx:54.4,y:21,aL:29.7,aR:71,hL:29,hR:71},
      11:{lx:39.1,rx:54.3,y:23.2,aL:32.3,aR:68,hL:28.7,hR:71.3},
      12:{lx:38,rx:53.8,y:20.6,aL:32,aR:68,hL:29,hR:70.3},
    };
    const _r1 = v => Math.round(v * 10) / 10;
    // Build a figure's zones from its measured anchors. Face parts are appended
    // LAST so the small central features (nose/mouth) sit on top of larger
    // neighbours → tapping a feature's centre resolves to THAT feature.
    function standing(m) {
      const midX = (m.lx + m.rx) / 2, sp = m.rx - m.lx;
      return [
        { n:'hair',  x:_r1(midX), y:_r1(2 + (m.y - 2) * 0.35), r:20 },
        { n:'belly', x:50, y:48, r:14 },
        { n:'arm',   x:_r1(m.aL + 4), y:45, r:11 }, { n:'arm',  x:_r1(m.aR - 4), y:45, r:11 },
        { n:'hand',  x:_r1(m.hL + 3), y:56, r:11 }, { n:'hand', x:_r1(m.hR - 3), y:56, r:11 },
        { n:'leg',   x:44, y:78, r:12 }, { n:'leg',  x:56, y:78, r:12 },
        { n:'foot',  x:45, y:95, r:10 }, { n:'foot', x:55, y:95, r:10 },
        { n:'ear',   x:_r1(midX - sp), y:_r1(m.y + sp * 0.1), r:6 }, { n:'ear', x:_r1(midX + sp), y:_r1(m.y + sp * 0.1), r:6 },
        { n:'eye',   x:m.lx, y:m.y, r:7 }, { n:'eye', x:m.rx, y:m.y, r:7 },
        { n:'nose',  x:_r1(midX), y:_r1(m.y + sp * 0.45), r:6 },
        { n:'mouth', x:_r1(midX), y:_r1(m.y + sp * 0.85), r:7 },
      ];
    }
    // Wheelchair child (seated) — head centred ~x48, torso/legs/feet shifted.
    const WHEELCHAIR_ZONES = [
      { n:'hair',  x:48, y:9,  r:20 },
      { n:'belly', x:47, y:44, r:13 },
      { n:'arm',   x:37, y:42, r:10 }, { n:'arm',  x:58, y:43, r:10 },
      { n:'hand',  x:39, y:51, r:10 }, { n:'hand', x:57, y:52, r:10 },
      { n:'leg',   x:43, y:61, r:12 }, { n:'leg',  x:54, y:63, r:12 },
      { n:'foot',  x:43, y:78, r:10 }, { n:'foot', x:57, y:79, r:10 },
      { n:'ear',   x:39, y:19, r:6 },  { n:'ear',  x:57, y:19, r:6 },
      { n:'eye',   x:44, y:18, r:7 },  { n:'eye',  x:53, y:18, r:7 },
      { n:'nose',  x:48, y:22, r:6 },
      { n:'mouth', x:48, y:25, r:7 },
    ];

    // 12 kids (body-01..12). #9 is the seated wheelchair child (own zones);
    // the rest use the standing template + their per-kid CONFIG tweaks.
    const BODIES = [];
    for (let n = 1; n <= 12; n++) {
      BODIES.push({
        img: 'img/bodies/body-' + String(n).padStart(2, '0') + '.png',
        zones: n === 9 ? WHEELCHAIR_ZONES : standing(ANCHORS[n]),
      });
    }

    let bodyIdx = Math.floor(Math.random() * BODIES.length);

    // (Re)render the current body's <img> + its tap-zone markers. Tap-testing is
    // done by ONE figure-level handler (nearest-feature), not per-button — see
    // handleFigureTap — so the buttons are visual/flash only (pointer-events off).
    let currentHits = [];   // [{z, el}] for the current body
    function renderBody() {
      const body = BODIES[bodyIdx];
      figure.innerHTML = '<img class="body-img" src="' + body.img + '" alt="A child standing">';
      currentHits = body.zones.map(z => {
        const b = document.createElement('button');
        b.className = 'hit'; b.dataset.name = z.n;
        b.setAttribute('aria-label', z.n);
        b.style.left = z.x + '%'; b.style.top = z.y + '%'; b.style.width = z.r + '%';
        b.style.pointerEvents = 'none';   // figure-level nearest-feature handler hit-tests
        figure.appendChild(b);
        return { z, el: b };
      });
    }

    // What's available per tier. With the new tier scheme, tier 4 = Pre-K (3-4y).
    const TODDLER_PARTS = ['eye','nose','mouth','ear','hand','foot'];
    const ALL_PARTS = ['eye','nose','mouth','ear','hand','foot','arm','leg','hair','belly'];
    const allOn = tier >= 4 || getProfileFeature(profile, 'body-parts', 'allParts');
    const partList = allOn ? ALL_PARTS : TODDLER_PARTS;
    const PRONOUN = (p) => ({
      eye:'eyes', ear:'ears', hand:'hands', foot:'feet', arm:'arms', leg:'legs',
    }[p] || p);

    const hint = document.getElementById('hint');
    let target = null;
    let lastTarget = null;
    let roundTimer = null;
    let correctCount = 0; // taps since last body switch — rotate every 5
    window.addEventListener('beforeunload', () => clearTimeout(roundTimer));

    // Shuffled "bag": ask EVERY part once before any repeats (random picking gave
    // the same part 3× in 5 taps). Refill + reshuffle when empty, avoiding an
    // immediate repeat across the refill seam.
    let _bag = [];
    function _drawTarget() {
      if (!_bag.length) {
        _bag = partList.slice();
        for (let i = _bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = _bag[i]; _bag[i] = _bag[j]; _bag[j] = t; }
        if (_bag.length > 1 && _bag[0] === lastTarget) _bag.push(_bag.shift());
      }
      return _bag.shift();
    }

    function nextRound() {
      clearTimeout(roundTimer);
      target = _drawTarget();
      lastTarget = target;
      const prompt = tier <= 2 ? `Where's the ${target}?` : `Tap the ${PRONOUN(target)}!`;
      hint.textContent = prompt;
      setTimeout(() => speak(prompt), 400);
      figure.querySelectorAll('.hit').forEach(el => {
        el.classList.remove('flash','wrong');
      });
    }

    // Nearest-feature tap resolution: a tap anywhere on the figure resolves to the
    // CLOSEST part centre. So tapping near the nose always counts as the nose even
    // if the invisible zone is a few % off — far more forgiving than tiny circles,
    // and the real fix for "tapped the nose, got the ear". (One handler on the
    // figure; the <img> + .hit buttons are pointer-events:none.)
    function handleFigureTap(e) {
      if (!currentHits.length || !target) return;
      const r = figure.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      let best = null, bestD = Infinity;
      for (const h of currentHits) {
        const zx = h.z.x / 100 * r.width, zy = h.z.y / 100 * r.height;
        const d = (px - zx) * (px - zx) + (py - zy) * (py - zy);
        if (d < bestD) { bestD = d; best = h; }
      }
      if (!best) return;
      const name = best.z.n;
      currentHits.forEach(h => h.el.classList.remove('flash', 'wrong'));
      if (name === target) {
        best.el.classList.add('flash');
        if (typeof haptic === 'function') haptic(25);
        playSuccess();
        if (window.vbProgress) {
          vbProgress.record('body-parts');
          if (allOn && (target === 'arm' || target === 'leg' || target === 'hair' || target === 'belly')) {
            vbProgress.mastery('body-parts.mastery');
          }
        }
        speak(`Yes! That's the ${PRONOUN(target)}.`);
        correctCount++;
        const rotate = correctCount % 5 === 0;
        roundTimer = setTimeout(() => { if (rotate) switchBody(); nextRound(); }, 1800);
      } else {
        best.el.classList.add('wrong');
        playBoop();
        setTimeout(() => best.el.classList.remove('wrong'), 350);
        if (tier <= 3) speak(`That's the ${PRONOUN(name)}.`);
      }
    }
    figure.addEventListener('pointerdown', handleFigureTap);

    // Pick a DIFFERENT random body and re-render it.
    function switchBody() {
      if (BODIES.length < 2) return;
      let next = bodyIdx;
      while (next === bodyIdx) next = Math.floor(Math.random() * BODIES.length);
      bodyIdx = next;
      renderBody();
    }

    renderBody();
    nextRound();
    })();
  </script>
</body>
</html>
