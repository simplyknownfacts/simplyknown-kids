<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>ABCs</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #6a4c93, #3a2c5e); }
    .screen {
      justify-content: flex-start !important;
      padding-top: calc(70px + env(safe-area-inset-top));
      padding-bottom: 200px; gap: 16px;
      overflow-y: auto;
    }
    .letter-big {
      font-size: clamp(140px, 32vw, 240px); font-weight: 900;
      color: white; line-height: 1; text-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }
    .starts-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 14px; max-width: 480px; width: 100%;
    }
    .start-tile {
      padding: 14px 10px; border-radius: 18px;
      background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.25);
      color: white; cursor: pointer; transition: transform 0.12s;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .start-tile:active { transform: scale(0.94); }
    .start-emoji { font-size: clamp(50px, 12vw, 80px); line-height: 1; }
    .start-name  { font-size: 16px; font-weight: 900; text-align: center; }
    .nav-row { display: flex; gap: 14px; justify-content: center; margin-top: 4px; }
    .pager-btn {
      padding: 14px 24px; border-radius: 18px;
      background: #4ECDC4; color: #1a1a2e;
      border: 3px solid white; font-size: 18px; font-weight: 900;
      cursor: pointer; min-width: 130px;
    }
    .pager-btn:active { transform: scale(0.94); }
    .pager-btn.secondary { background: rgba(255,255,255,0.18); color: white; border-color: rgba(255,255,255,0.3); }
    /* Spell mode */
    .letter-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(56px, 1fr));
      gap: 10px; width: 100%; max-width: 540px; padding: 16px;
    }
    .letter-tile {
      aspect-ratio: 1; min-height: 56px; border-radius: 14px;
      background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.25);
      color: white; font-size: 26px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.1s;
    }
    .letter-tile:active { transform: scale(0.9); }
    .letter-tile.wrong { animation: shake 0.3s; }
    .spelled-slot {
      width: 56px; height: 68px; border-radius: 12px;
      border: 3px dashed rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 900; color: white;
    }
    .spelled-slot.filled { border-style: solid; background: rgba(168,230,207,0.3); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

    /* Younger ages (tier <= 3): bigger "starts-with" emoji + more spacing. */
    body.young-icons .start-emoji { font-size: clamp(72px, 18vw, 110px); }
    body.young-icons .start-name { font-size: 18px; }
    body.young-icons .starts-grid { gap: 22px; }
  </style>
</head>
<body>
  <div class="screen" id="stage">
    <div class="title">🔤 ABCs</div>
    <div id="body" class="col" style="gap:18px; width:100%; align-items:center;"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'abcs');
    if (tier <= 3) document.body.classList.add('young-icons');
    renderBackBtn('index.html');
    gameSettings.attach('abcs');
    if (window.vbProgress) { vbProgress.firstPlay('abcs'); vbProgress.touchStreak(); }

    const wordHintsOn = tier >= 3 || getProfileFeature(profile, 'abcs', 'wordHints');
    const spellOn     = tier >= 7 || getProfileFeature(profile, 'abcs', 'spellMode');

    const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    // 4 kid-recognizable starts-with items per letter
    const STARTS = {
      A: [{w:'Apple',e:'🍎'},{w:'Ant',e:'🐜'},{w:'Airplane',e:'✈️'},{w:'Alligator',e:'🐊'}],
      B: [{w:'Ball',e:'⚽'},{w:'Bear',e:'🐻'},{w:'Banana',e:'🍌'},{w:'Bee',e:'🐝'}],
      C: [{w:'Cat',e:'🐱'},{w:'Cake',e:'🍰'},{w:'Car',e:'🚗'},{w:'Cookie',e:'🍪'}],
      D: [{w:'Dog',e:'🐶'},{w:'Duck',e:'🦆'},{w:'Dolphin',e:'🐬'},{w:'Donut',e:'🍩'}],
      E: [{w:'Egg',e:'🥚'},{w:'Elephant',e:'🐘'},{w:'Eagle',e:'🦅'},{w:'Earth',e:'🌍'}],
      F: [{w:'Fish',e:'🐟'},{w:'Frog',e:'🐸'},{w:'Fire',e:'🔥'},{w:'Flower',e:'🌸'}],
      G: [{w:'Grapes',e:'🍇'},{w:'Giraffe',e:'🦒'},{w:'Guitar',e:'🎸'},{w:'Goat',e:'🐐'}],
      H: [{w:'Hat',e:'🎩'},{w:'Horse',e:'🐴'},{w:'House',e:'🏠'},{w:'Heart',e:'❤️'}],
      I: [{w:'Ice cream',e:'🍦'},{w:'Igloo',e:'🛖'},{w:'Insect',e:'🐛'},{w:'Island',e:'🏝️'}],
      J: [{w:'Jam',e:'🍓'},{w:'Jellyfish',e:'🪼'},{w:'Jacket',e:'🧥'},{w:'Juice',e:'🧃'}],
      K: [{w:'Kite',e:'🪁'},{w:'Key',e:'🔑'},{w:'Koala',e:'🐨'},{w:'Kangaroo',e:'🦘'}],
      L: [{w:'Lion',e:'🦁'},{w:'Lemon',e:'🍋'},{w:'Leaf',e:'🍃'},{w:'Ladybug',e:'🐞'}],
      M: [{w:'Moon',e:'🌙'},{w:'Mouse',e:'🐭'},{w:'Monkey',e:'🐵'},{w:'Milk',e:'🥛'}],
      N: [{w:'Nest',e:'🪺'},{w:'Nose',e:'👃'},{w:'Noodles',e:'🍜'},{w:'Notebook',e:'📓'}],
      O: [{w:'Orange',e:'🍊'},{w:'Octopus',e:'🐙'},{w:'Owl',e:'🦉'},{w:'Onion',e:'🧅'}],
      P: [{w:'Pig',e:'🐷'},{w:'Pizza',e:'🍕'},{w:'Penguin',e:'🐧'},{w:'Pumpkin',e:'🎃'}],
      Q: [{w:'Queen',e:'👸'},{w:'Quilt',e:'🛌'},{w:'Question',e:'❓'},{w:'Quarter',e:'🪙'}],
      R: [{w:'Rainbow',e:'🌈'},{w:'Rabbit',e:'🐰'},{w:'Rocket',e:'🚀'},{w:'Rose',e:'🌹'}],
      S: [{w:'Sun',e:'☀️'},{w:'Star',e:'⭐'},{w:'Snake',e:'🐍'},{w:'Strawberry',e:'🍓'}],
      T: [{w:'Tiger',e:'🐯'},{w:'Train',e:'🚂'},{w:'Turtle',e:'🐢'},{w:'Tree',e:'🌳'}],
      U: [{w:'Umbrella',e:'☂️'},{w:'Unicorn',e:'🦄'},{w:'Up',e:'⬆️'},{w:'Underwear',e:'🩲'}],
      V: [{w:'Van',e:'🚐'},{w:'Violin',e:'🎻'},{w:'Volcano',e:'🌋'},{w:'Vegetable',e:'🥦'}],
      W: [{w:'Whale',e:'🐳'},{w:'Watermelon',e:'🍉'},{w:'Wolf',e:'🐺'},{w:'Water',e:'💧'}],
      X: [{w:'Xylophone',e:'🪘'},{w:'X-ray',e:'🦴'}],
      Y: [{w:'Yo-yo',e:'🪀'},{w:'Yak',e:'🐂'},{w:'Yarn',e:'🧶'},{w:'Yellow',e:'💛'}],
      Z: [{w:'Zebra',e:'🦓'},{w:'Zipper',e:'🤐'},{w:'Zero',e:'0️⃣'},{w:'Zoo',e:'🦁'}],
    };
    const SPELL_WORDS = [
      {w:'CAT',e:'🐱'},{w:'DOG',e:'🐶'},{w:'PIG',e:'🐷'},{w:'SUN',e:'☀️'},
      {w:'EGG',e:'🥚'},{w:'HAT',e:'🎩'},{w:'BAT',e:'🦇'},{w:'BUG',e:'🐛'},
    ];

    const bodyEl = document.getElementById('body');
    let idx = 0;

    function nextRound() {
      bodyEl.innerHTML = '';

      if (spellOn) {
        // Spell mode: pick a 3-letter word, tap letters from bank in order
        const word = SPELL_WORDS[Math.floor(Math.random() * SPELL_WORDS.length)];
        const hint = document.createElement('div'); hint.className = 'subtitle';
        hint.textContent = `Spell ${word.w.toLowerCase()}!`;
        bodyEl.appendChild(hint);
        const pic = document.createElement('div');
        pic.style.cssText = 'font-size:clamp(80px,20vw,140px);line-height:1;';
        pic.textContent = word.e;
        bodyEl.appendChild(pic);
        const slotRow = document.createElement('div'); slotRow.className = 'row';
        const slots = [];
        for (const ch of word.w) {
          const s = document.createElement('div');
          s.className = 'spelled-slot'; s.dataset.target = ch;
          slotRow.appendChild(s); slots.push(s);
        }
        bodyEl.appendChild(slotRow);
        const bank = new Set(word.w.split(''));
        while (bank.size < word.w.length + 4) bank.add(ALPHABET[Math.floor(Math.random()*26)]);
        const grid = document.createElement('div'); grid.className = 'letter-grid';
        [...bank].sort(() => Math.random() - 0.5).forEach(L => {
          const tile = document.createElement('div');
          tile.className = 'letter-tile'; tile.textContent = L;
          tile.addEventListener('pointerdown', () => {
            const nextEmpty = slots.findIndex(s => !s.textContent);
            if (nextEmpty === -1) return;
            if (slots[nextEmpty].dataset.target === L) {
              slots[nextEmpty].textContent = L;
              slots[nextEmpty].classList.add('filled');
              speak(L);
              if (slots.every(s => s.textContent)) {
                playSuccess();
                if (window.vbProgress) { vbProgress.record('abcs'); vbProgress.mastery('abcs.mastery'); }
                setTimeout(() => speak(word.w), 400);
                setTimeout(nextRound, 2400);
              }
            } else {
              tile.classList.add('wrong'); playBoop();
              setTimeout(() => tile.classList.remove('wrong'), 350);
            }
          });
          grid.appendChild(tile);
        });
        bodyEl.appendChild(grid);
        setTimeout(() => speak(`Spell ${word.w}!`), 300);
        return;
      }

      // Default mode (tier ≤ 6): big letter + 4 starts-with tiles + Next button
      const letter = ALPHABET[idx % 26];
      const items = STARTS[letter];

      const big = document.createElement('div');
      big.className = 'letter-big'; big.textContent = letter;
      big.style.cursor = 'pointer';
      big.addEventListener('pointerdown', () => speak(letter));
      bodyEl.appendChild(big);

      const subtitle = document.createElement('div'); subtitle.className = 'subtitle';
      subtitle.textContent = `${letter} is for...`;
      bodyEl.appendChild(subtitle);

      const grid = document.createElement('div'); grid.className = 'starts-grid';
      items.forEach(item => {
        const tile = document.createElement('div'); tile.className = 'start-tile';
        tile.innerHTML = wordHintsOn
          ? `<span class="start-emoji">${item.e}</span><span class="start-name">${item.w}</span>`
          : `<span class="start-emoji">${item.e}</span>`;
        tile.addEventListener('pointerdown', () => {
          speak(item.w);
          playChime();
        });
        grid.appendChild(tile);
      });
      bodyEl.appendChild(grid);

      const nav = document.createElement('div'); nav.className = 'nav-row';
      const prev = document.createElement('button');
      prev.className = 'pager-btn secondary'; prev.textContent = '← Back';
      prev.addEventListener('pointerdown', () => { idx = (idx + 25) % 26; nextRound(); });
      const next = document.createElement('button');
      next.className = 'pager-btn'; next.textContent = 'Next →';
      next.addEventListener('pointerdown', () => { if (window.vbProgress) vbProgress.record('abcs'); idx = (idx + 1) % 26; nextRound(); });
      nav.appendChild(prev); nav.appendChild(next);
      bodyEl.appendChild(nav);

      // Say the letter on landing — no auto-advance
      speak(letter);
    }
    nextRound();
    })();
  </script>
</body>
</html>
