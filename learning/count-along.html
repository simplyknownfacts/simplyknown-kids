<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Count Along</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #1a1a4e, #2d1b5e); }
    .screen { justify-content: flex-start !important;
              padding-top: calc(70px + env(safe-area-inset-top));
              padding-bottom: 200px;
              overflow-y: auto; }

    .dot {
      width: 96px; height: 96px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 4px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 52px; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      position: relative;
    }
    .dot.counted { background: #FFD93D; border-color: #FFD93D; }
    .dot:active { transform: scale(0.88); }
    .count-badge {
      position: absolute; bottom: -28px; left: 50%;
      transform: translateX(-50%);
      background: #1a1a2e; color: #FFD93D;
      font-size: 18px; font-weight: 900;
      padding: 2px 10px; border-radius: 12px;
      border: 2px solid #FFD93D;
      white-space: nowrap;
      pointer-events: none;
    }
    .row.with-badges { row-gap: 36px; }
    .number-big { font-size: clamp(80px, 22vw, 140px); font-weight: 900; color: white; line-height: 1; }
    .thing-label { font-size: clamp(18px, 5vw, 28px); font-weight: 800; color: rgba(255,255,255,0.7); }
    .num-btn {
      min-width: 70px; min-height: 70px; border-radius: 20px;
      background: rgba(255,255,255,0.15);
      border: 3px solid rgba(255,255,255,0.25);
      font-size: 28px; font-weight: 900; color: white;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s;
    }
    .num-btn:active { transform: scale(0.9); }

    /* Younger ages (tier <= 3): bigger icons + more breathing room so small
       fingers can hit them and the screen feels less cluttered. */
    body.young-icons .dot {
      width: 128px; height: 128px; font-size: 72px; border-width: 5px;
    }
    body.young-icons .row { gap: 28px 40px; }
    body.young-icons .row.with-badges { row-gap: 56px; }
    body.young-icons .count-badge { font-size: 22px; bottom: -32px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="title">🔢 Count Along</div>
    <div class="subtitle" id="instruction"></div>
    <div id="stage" class="col" style="gap:20px;"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'count-along');
    if (tier <= 3) document.body.classList.add('young-icons');
    renderBackBtn('index.html');
    gameSettings.attach('count-along');
    if (window.vbProgress) { vbProgress.firstPlay('count-along'); vbProgress.touchStreak(); }

    const quizOn = tier >= 5 || getProfileFeature(profile, 'count-along', 'quizMode');

    const THINGS = [
      {e:'🦆', s:'duck',       p:'ducks'},
      {e:'🐴', s:'horse',      p:'horses'},
      {e:'🐷', s:'pig',        p:'pigs'},
      {e:'🚗', s:'car',        p:'cars'},
      {e:'🐱', s:'cat',        p:'cats'},
      {e:'🍕', s:'pizza',      p:'pizzas'},
      {e:'🌸', s:'flower',     p:'flowers'},
      {e:'🦋', s:'butterfly',  p:'butterflies'},
      {e:'🍦', s:'ice cream',  p:'ice creams'},
      {e:'🐟', s:'fish',       p:'fish'},
      {e:'🎈', s:'balloon',    p:'balloons'},
      {e:'🍎', s:'apple',      p:'apples'},
      {e:'🐶', s:'dog',        p:'dogs'},
      {e:'⭐',  s:'star',       p:'stars'},
    ];

    let lastThingIdx = -1;
    function pickThing() {
      let i;
      do { i = Math.floor(Math.random() * THINGS.length); } while (i === lastThingIdx);
      lastThingIdx = i;
      return THINGS[i];
    }

    function countWord(n, thing) {
      return n === 1 ? `1 ${thing.s}` : `${n} ${thing.p}`;
    }

    const stage = document.getElementById('stage');
    const instruction = document.getElementById('instruction');

    let autoTimer;
    function clearAuto() { clearTimeout(autoTimer); }
    window.addEventListener('beforeunload', clearAuto);

    let currentCount = 0;
    function nextRound() {
      stage.innerHTML = ''; clearAuto();
      const thing = pickThing();
      const maxCount = tier <= 4 ? 10 : tier <= 6 ? 20 : 50;
      currentCount = (currentCount % maxCount) + 1;
      const count = currentCount;

      if (tier <= 2) {
        instruction.textContent = '👆 Tap to count!';
        const numEl = document.createElement('div');
        numEl.className = 'number-big'; numEl.textContent = count;
        stage.appendChild(numEl);
        const thingEl = document.createElement('div');
        thingEl.className = 'thing-label';
        thingEl.textContent = count === 1 ? thing.s : thing.p;
        stage.appendChild(thingEl);

        const row = document.createElement('div'); row.className = 'row with-badges';
        stage.appendChild(row);
        let tapped = 0;
        // Show empty dots — child taps each one to count
        for (let i = 0; i < count; i++) {
          const d = document.createElement('div');
          d.className = 'dot'; d.textContent = thing.e;
          d.addEventListener('pointerdown', () => {
            if (d.classList.contains('counted')) return;
            d.classList.add('counted');
            tapped++;
            if (tapped === count) {
              // Final item: speak the total ("3 ducks") directly. Do NOT speak
              // the bare number first — the old code spoke "3" then 350ms later
              // "3 ducks", replaying the "3" clip and stuttering ("three…
              // three ducks"). speak() already cancels any in-flight clip.
              speak(countWord(count, thing));
              playSuccess();
              if (window.vbProgress) vbProgress.record('count-along');
              autoTimer = setTimeout(nextRound, 2200);
            } else {
              // Snappy: just the number on each tap, interrupting prior speech.
              speak(String(tapped));
            }
          });
          row.appendChild(d);
        }
        // Tap the big number to skip to next round
        numEl.style.cursor = 'pointer';
        numEl.addEventListener('pointerdown', () => { clearAuto(); nextRound(); });

      } else if (tier <= 4) {
        instruction.textContent = `Tap each ${thing.s} to count!`;
        const row = document.createElement('div'); row.className = 'row with-badges';
        let tapped = 0;
        for (let i = 0; i < count; i++) {
          const d = document.createElement('div');
          d.className = 'dot'; d.textContent = thing.e;
          d.addEventListener('pointerdown', () => {
            if (d.classList.contains('counted')) return;
            d.classList.add('counted');
            tapped++;
            const badge = document.createElement('span');
            badge.className = 'count-badge';
            badge.textContent = tapped;
            d.appendChild(badge);
            cancelSpeak();
            if (tapped === count) {
              // Final tap: skip the lone number — go straight to "N items".
              speak(countWord(count, thing));
              playSuccess();
              if (window.vbProgress) vbProgress.record('count-along');
              autoTimer = setTimeout(nextRound, 2200);
            } else {
              speak(String(tapped));
            }
          });
          row.appendChild(d);
        }
        stage.appendChild(row);

      } else if (quizOn && tier <= 6) {
        // "How many?" of 1 is trivial and reads like a glitch — bump to 2+.
        const quizCount = count < 2 ? 2 : count;
        instruction.textContent = `How many ${thing.p}?`;
        speak(`How many ${thing.p}?`);
        const row = document.createElement('div'); row.className = 'row';
        for (let i = 0; i < quizCount; i++) {
          const d = document.createElement('div');
          d.className = 'dot counted'; d.textContent = thing.e;
          row.appendChild(d);
        }
        stage.appendChild(row);

        const numMax = tier === 5 ? 5 : 10;
        const choices = new Set([quizCount]);
        while (choices.size < Math.min(3, numMax)) choices.add(Math.floor(Math.random() * numMax) + 1);
        const numRow = document.createElement('div'); numRow.className = 'row';
        [...choices].sort((a, b) => a - b).forEach(n => {
          const btn = document.createElement('div');
          btn.className = 'num-btn'; btn.textContent = n;
          btn.addEventListener('click', () => {
            if (n === quizCount) {
              playSuccess(); speak(`Yes! ${countWord(quizCount, thing)}!`);
              if (window.vbProgress) { vbProgress.record('count-along'); vbProgress.mastery('count-along.mastery'); }
              btn.style.background = 'rgba(168,230,207,0.5)';
              autoTimer = setTimeout(nextRound, 1500);
            } else {
              playBoop();
              btn.style.background = 'rgba(255,107,107,0.4)';
              autoTimer = setTimeout(() => btn.style.background = '', 500);
            }
          });
          numRow.appendChild(btn);
        });
        stage.appendChild(numRow);

      } else if (tier <= 6) {
        // No quiz yet — tap-to-count mode at tier 5-6 without flag
        instruction.textContent = `Tap each ${thing.s} to count!`;
        const row = document.createElement('div'); row.className = 'row';
        let tapped = 0;
        for (let i = 0; i < count; i++) {
          const d = document.createElement('div');
          d.className = 'dot'; d.textContent = thing.e;
          d.addEventListener('pointerdown', () => {
            if (d.classList.contains('counted')) return;
            d.classList.add('counted');
            tapped++;
            const badge = document.createElement('span');
            badge.className = 'count-badge';
            badge.textContent = tapped;
            d.appendChild(badge);
            cancelSpeak();
            if (tapped === count) {
              // Final tap: skip the lone number — go straight to "N items".
              speak(countWord(count, thing));
              playSuccess();
              if (window.vbProgress) vbProgress.record('count-along');
              autoTimer = setTimeout(nextRound, 2200);
            } else {
              speak(String(tapped));
            }
          });
          row.appendChild(d);
        }
        stage.appendChild(row);

      } else {
        // Tier 7+: skip-counting (by 2s, 5s, or 10s). Keeps the card focused on
        // counting rather than arithmetic. "What number comes next: 2, 4, 6, …?"
        const step = [2, 5, 10][Math.floor(Math.random() * 3)];
        const length = 4; // how many terms to show before the blank
        const start = step * (Math.floor(Math.random() * 4) + 1);
        const sequence = [];
        for (let i = 0; i < length; i++) sequence.push(start + step * i);
        const ans = start + step * length;

        instruction.textContent = `Counting by ${step}s — what comes next?`;
        speak(`Counting by ${step}s. What number comes next?`);

        const seqEl = document.createElement('div');
        seqEl.className = 'number-big';
        seqEl.style.fontSize = 'clamp(48px, 12vw, 90px)';
        seqEl.textContent = sequence.join(', ') + ', ?';
        stage.appendChild(seqEl);

        const choices = new Set([ans]);
        while (choices.size < 3) {
          const off = (Math.floor(Math.random() * 3) + 1) * step;
          choices.add(Math.random() < 0.5 ? ans + off : Math.max(step, ans - off));
        }
        const numRow = document.createElement('div'); numRow.className = 'row';
        [...choices].sort((a, b) => a - b).forEach(n => {
          const btn = document.createElement('div');
          btn.className = 'num-btn'; btn.textContent = n;
          btn.addEventListener('click', () => {
            if (n === ans) {
              playSuccess(); speak(`Yes! ${ans}.`);
              if (window.vbProgress) vbProgress.record('count-along');
              btn.style.background = 'rgba(168,230,207,0.5)';
              autoTimer = setTimeout(nextRound, 1800);
            } else {
              playBoop();
              btn.style.background = 'rgba(255,107,107,0.4)';
              autoTimer = setTimeout(() => btn.style.background = '', 500);
            }
          });
          numRow.appendChild(btn);
        });
        stage.appendChild(numRow);
      }
    }

    nextRound();
    })();
  </script>
</body>
</html>
