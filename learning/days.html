<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Days of the Week</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes.css">
  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #2d5a87, #1a3a5e); }
    .screen { justify-content: flex-start !important;
              padding-top: calc(70px + env(safe-area-inset-top));
              padding-bottom: 200px;
              overflow-y: auto; }

    .day-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
    .day-tile {
      min-width: 110px; padding: 18px 14px; border-radius: 18px;
      background: rgba(255,255,255,0.12); border: 3px solid rgba(255,255,255,0.2);
      color: white; font-weight: 900; font-size: 17px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer; transition: transform 0.12s;
    }
    .day-tile:active { transform: scale(0.92); }
    .day-tile.today  { border-color: #FFD93D; background: rgba(255,217,61,0.2); }
    .day-tile.matched{ border-color: #a8e6cf; background: rgba(168,230,207,0.25); }
    .day-tile.wrong  { animation: shake 0.3s; }
    .day-emoji { font-size: 38px; line-height: 1; }
    @keyframes shake {0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  </style>
</head>
<body>
  <div class="screen" id="stage" style="gap:24px;">
    <div class="title">📅 Days of the Week</div>
    <div class="subtitle" id="hint"></div>
    <div id="body" class="col" style="gap:24px;"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sleep-timer.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'days');
    renderBackBtn('index.html');
    gameSettings.attach('days');
    if (window.vbProgress) { vbProgress.firstPlay('days'); vbProgress.touchStreak(); }

    const quizOn = tier >= 5 || getProfileFeature(profile, 'days', 'quizMode');

    // Kid-recognizable pictures (not adult mnemonics like 🐪 "hump day" / 🎉 TGIF).
    // Sun/Moon anchor Sun-day / Mon-day; the rest are bright, distinct things a
    // toddler can instantly name. (Days have no inherent picture — these are just
    // friendly, memorable anchors per day.)
    const DAYS = [
      { n:'Sunday',    e:'🌞' },
      { n:'Monday',    e:'🌙' },
      { n:'Tuesday',   e:'🌈' },
      { n:'Wednesday', e:'🌷' },
      { n:'Thursday',  e:'🦋' },
      { n:'Friday',    e:'⭐' },
      { n:'Saturday',  e:'🎈' },
    ];
    const todayIdx = new Date().getDay(); // 0 = Sun

    // School age: the YEAR is the next step up from the week. Only the month name
    // + "What month comes after ___?" are spoken (both are recorded clips); the
    // correct-answer feedback speaks the bare month name (we never recorded
    // "Yes! <month>."), so it stays all-recorded-voice.
    const MONTHS = ['January','February','March','April','May','June','July',
                    'August','September','October','November','December'];

    const bodyEl = document.getElementById('body');
    const hint   = document.getElementById('hint');
    let roundTimer = null;
    window.addEventListener('beforeunload', () => clearTimeout(roundTimer));

    function renderMonthRound() {
      const mi = Math.floor(Math.random() * 12);
      const target = (mi + 1) % 12;
      const promptText = `What month comes after ${MONTHS[mi]}?`;
      hint.textContent = promptText;
      setTimeout(() => speak(promptText), 400);
      const row = document.createElement('div'); row.className = 'day-row';
      MONTHS.forEach((m, i) => {
        const tile = document.createElement('div');
        tile.className = 'day-tile';
        tile.innerHTML = `<span class="day-emoji">📅</span><span>${m}</span>`;
        tile.addEventListener('pointerdown', () => {
          if (i === target) {
            tile.classList.add('matched'); playSuccess();
            if (window.vbProgress) { vbProgress.record('days'); vbProgress.mastery('days.mastery'); }
            speak(MONTHS[target]);
            roundTimer = setTimeout(nextRound, 1800);
          } else {
            tile.classList.add('wrong'); playBoop();
            setTimeout(() => tile.classList.remove('wrong'), 350);
            speak('Try again!');
          }
        });
        row.appendChild(tile);
      });
      bodyEl.appendChild(row);
    }

    function nextRound() {
      bodyEl.innerHTML = ''; clearTimeout(roundTimer);

      if (tier <= 4 && !quizOn) {
        // Tap each day to hear its name. Today is highlighted.
        hint.textContent = '👆 Tap a day to hear it!';
        const row = document.createElement('div'); row.className = 'day-row';
        DAYS.forEach((d, i) => {
          const tile = document.createElement('div');
          tile.className = 'day-tile' + (i === todayIdx ? ' today' : '');
          tile.innerHTML = `<span class="day-emoji">${d.e}</span><span>${d.n}</span>${i === todayIdx ? '<span style="font-size:11px;opacity:0.8;">TODAY</span>' : ''}`;
          tile.addEventListener('pointerdown', () => {
            speak(i === todayIdx ? `Today is ${d.n}!` : d.n);
            playChime();
          });
          row.appendChild(tile);
        });
        bodyEl.appendChild(row);
        setTimeout(() => speak(`Today is ${DAYS[todayIdx].n}!`), 400);

      } else if (tier >= 6 && Math.random() < 0.4) {
        // T6+: mix in months of the year (recorded prompts).
        renderMonthRound();

      } else if (tier <= 6) {
        // "What comes after Monday?" / "What was the day before Monday?"
        const isAfter = Math.random() < 0.5;
        const baseIdx = Math.floor(Math.random() * 7);
        const target  = isAfter ? (baseIdx + 1) % 7 : (baseIdx + 6) % 7;
        const promptText = isAfter
          ? `What day comes after ${DAYS[baseIdx].n}?`
          : `What was the day before ${DAYS[baseIdx].n}?`;
        hint.textContent = promptText;
        setTimeout(() => speak(promptText), 400);
        const row = document.createElement('div'); row.className = 'day-row';
        DAYS.forEach((d, i) => {
          const tile = document.createElement('div');
          tile.className = 'day-tile';
          tile.innerHTML = `<span class="day-emoji">${d.e}</span><span>${d.n}</span>`;
          tile.addEventListener('pointerdown', () => {
            if (i === target) {
              tile.classList.add('matched');
              playSuccess();
              if (window.vbProgress) { vbProgress.record('days'); vbProgress.mastery('days.mastery'); }
              speak(`Yes! ${d.n}.`);
              roundTimer = setTimeout(nextRound, 1800);
            } else {
              tile.classList.add('wrong');
              playBoop();
              setTimeout(() => tile.classList.remove('wrong'), 350);
              speak('Try again!');
            }
          });
          row.appendChild(tile);
        });
        bodyEl.appendChild(row);

      } else {
        // School age: ordinal questions — "What's the 3rd day?" / "How many days until Friday?"
        const ordinals = ['first','second','third','fourth','fifth','sixth','seventh'];
        const useOrdinal = Math.random() < 0.5;
        let promptText, target;
        if (useOrdinal) {
          target = Math.floor(Math.random() * 7);
          promptText = `Tap the ${ordinals[target]} day of the week.`;
        } else {
          target = Math.floor(Math.random() * 7);
          const diff = (target - todayIdx + 7) % 7;
          promptText = diff === 0
            ? 'Tap today.'
            : `What day is ${diff} day${diff === 1 ? '' : 's'} from today?`;
        }
        hint.textContent = promptText;
        setTimeout(() => speak(promptText), 400);
        const row = document.createElement('div'); row.className = 'day-row';
        DAYS.forEach((d, i) => {
          const tile = document.createElement('div');
          tile.className = 'day-tile';
          tile.innerHTML = `<span class="day-emoji">${d.e}</span><span>${d.n}</span>`;
          tile.addEventListener('pointerdown', () => {
            if (i === target) {
              tile.classList.add('matched');
              playSuccess();
              if (window.vbProgress) { vbProgress.record('days'); vbProgress.mastery('days.mastery'); }
              speak(`Yes! ${d.n}.`);
              roundTimer = setTimeout(nextRound, 1800);
            } else {
              tile.classList.add('wrong');
              playBoop();
              setTimeout(() => tile.classList.remove('wrong'), 350);
              speak('Try again!');
            }
          });
          row.appendChild(tile);
        });
        bodyEl.appendChild(row);
      }
    }
    nextRound();
    })();
  </script>
</body>
</html>
