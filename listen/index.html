<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>SimplyKnown Kids — Listen</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .listen-screen {
      min-height: 100vh;
      padding: calc(100px + env(safe-area-inset-top)) 24px 140px;
      display: flex; flex-direction: column; align-items: center;
      overflow-y: auto;
    }
    .hub-title {
      font-family: var(--font-display); font-style: italic; font-weight: 600;
      font-size: clamp(40px, 7vw, 56px);
      color: var(--text); text-align: center; letter-spacing: -0.5px;
    }
    .hub-subtitle {
      font-family: var(--font-hand); font-size: 22px;
      color: var(--text-soft); margin-top: 4px; margin-bottom: 24px;
      text-align: center;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 22px; max-width: 800px; width: 100%;
    }
    .card-tile {
      background: linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
      border-radius: 22px;
      padding: 14px 12px 16px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      cursor: pointer; box-shadow: var(--paper-shadow);
      transition: transform 0.15s;
    }
    .card-tile:active { transform: scale(0.96); }
    .card-cover {
      width: 100%; aspect-ratio: 1;
      border-radius: 14px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--c-listen) 30%, var(--ink)), var(--ink));
      display: flex; align-items: center; justify-content: center;
      font-size: 56px; overflow: hidden;
      box-shadow: inset 0 -6px 18px rgba(0,0,0,0.25);
    }
    .card-cover img { width: 100%; height: 100%; object-fit: cover; }
    .card-title {
      font-family: var(--font-display); font-style: italic; font-weight: 500;
      font-size: 16px; color: var(--ink); text-align: center; line-height: 1.25;
    }
    .empty {
      color: var(--text-soft); font-size: 15px; line-height: 1.6;
      padding: 60px 30px; text-align: center;
      background: var(--chip-bg); border: 1px solid var(--chip-border);
      border-radius: 22px; max-width: 460px;
    }
    .empty .big { font-size:60px; margin-bottom:14px; }
    .empty .heading {
      color: var(--text); font-family: var(--font-display); font-style: italic;
      font-weight: 500; font-size: 22px; margin-bottom: 10px;
    }

    /* Mini player */
    #player {
      position: fixed; left: 12px; right: 12px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      padding: 12px 16px; border-radius: 18px;
      background: rgba(10,8,30,0.85); backdrop-filter: blur(16px);
      border: 1px solid var(--chip-border);
      display: none; align-items: center; gap: 10px;
      z-index: 100;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.45);
    }
    #player.active { display: flex; }
    #player .cover-mini {
      width: 56px; height: 56px; border-radius: 12px;
      background: rgba(255,255,255,0.1); overflow: hidden; flex-shrink: 0;
      display:flex; align-items:center; justify-content:center; font-size:30px;
    }
    #player .cover-mini img { width:100%; height:100%; object-fit:cover; }
    #player .info { flex: 1; min-width: 0; }
    #player .info .now {
      font-family: var(--font-display); font-style: italic; font-weight: 500;
      color: white; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #player .info .chap { color: rgba(255,255,255,0.6); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #player .btn-pp {
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: var(--c-listen); color: #1a1a2e; font-size: 24px;
      cursor: pointer; flex-shrink: 0; font-weight: 900;
      box-shadow: 0 6px 16px rgba(255,159,107,0.4);
    }
    #player .btn-skip {
      width: 46px; height: 46px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.12); color: #fff; font-size: 18px;
      cursor: pointer; flex-shrink: 0; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      transition: transform .07s ease;
    }
    #player .btn-skip:active { transform: scale(0.9); }
    #player .btn-skip:disabled { opacity: 0.3; pointer-events: none; }

    /* Chapter picker */
    .chapters-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 200; display: flex; align-items: flex-end; justify-content: center;
      padding: 20px;
    }
    .chapters-panel {
      background: #1a1a2e; border-radius: 22px 22px 0 0; padding: 18px;
      max-width: 520px; width: 100%; max-height: 75vh; overflow-y: auto;
      color: white;
    }
    .chapters-panel h3 {
      margin: 0 0 14px; font-size: 22px; font-family: var(--font-display);
      font-style: italic; font-weight: 500;
    }
    .chap-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; border-radius: 14px; cursor: pointer;
      background: rgba(255,255,255,0.06); margin-bottom: 8px;
    }
    .chap-row:active { background: color-mix(in srgb, var(--c-listen) 25%, transparent); }
    .chap-row .num {
      width:30px; height:30px; border-radius:50%;
      background: var(--c-listen); color:#1a1a2e;
      font-weight:900; display:flex; align-items:center;
      justify-content:center; font-size:14px; flex-shrink:0;
    }
    .chap-row .t { flex:1; font-weight:700; font-size:15px; }
    .chap-close {
      width:100%; padding:14px; border-radius:14px;
      background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
      color:white; font-weight:800; font-size:15px; margin-top:8px;
      cursor:pointer; font-family: var(--font-ui);
    }
  </style>
</head>
<body class="section-listen">
  <div class="listen-screen">
    <h1 class="hub-title">Listen</h1>
    <div class="hub-subtitle" id="subtitle"></div>
    <div id="grid" class="cards-grid"></div>
  </div>

  <div id="player">
    <div class="cover-mini" id="playerCover">🎧</div>
    <div class="info">
      <div class="now" id="playerTitle">—</div>
      <div class="chap" id="playerChap"></div>
    </div>
    <audio id="audio" preload="auto"></audio>
    <button class="btn-skip" id="prevChap" aria-label="Previous chapter">⏮</button>
    <button class="btn-pp" id="playPause" aria-label="Play or pause">▶</button>
    <button class="btn-skip" id="nextChap" aria-label="Next chapter">⏭</button>
  </div>

  <script src="../js/atmosphere.js"></script>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/mascot.js"></script>
  <script src="../js/yoto-config.js"></script>
  <script src="../js/yoto.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script>
    (async function() {
      const profile = getActiveProfile();
      if (!profile) { goProfiles(); return; }
      renderBackBtn('../home.html');

      const grid = document.getElementById('grid');
      const subtitle = document.getElementById('subtitle');

      function emptyState(big, heading, body) {
        grid.outerHTML = `<div class="empty">
          <div class="big">${big}</div>
          <div class="heading">${heading}</div>
          <div>${body}</div>
        </div>`;
      }

      if (!yoto.isConfigured()) {
        emptyState('🎧', 'Listen tab not set up yet',
          'A grown-up needs to add a Yoto client ID in:<br>' +
          '<strong style="color:var(--text);">⚙️ Parent Settings → 🎧 Yoto</strong>');
        return;
      }
      if (!yoto.isConnected()) {
        emptyState('🎧', 'Not connected to Yoto',
          'A grown-up can connect in:<br>' +
          '<strong style="color:var(--text);">⚙️ Parent Settings → 🎧 Yoto</strong>');
        return;
      }

      subtitle.textContent = `${profile.name}'s tapes`;
      const r = await yoto.listContent();
      if (r.error) {
        emptyState('⚠️', "Couldn't load Yoto library", r.error);
        return;
      }
      if (!r.cards.length) {
        emptyState('🎧', 'Quiet for now',
          'No cards in your Yoto library yet.');
        return;
      }

      r.cards.forEach(c => {
        const tile = document.createElement('div');
        tile.className = 'card-tile';
        const coverUrl = (c.metadata && c.metadata.cover && c.metadata.cover.imageL) || c.coverImage || c.cover || null;
        const title = (c.metadata && c.metadata.title) || c.title || 'Untitled';
        tile.innerHTML = `
          <div class="card-cover">${coverUrl ? `<img src="${coverUrl}" alt="">` : '🎧'}</div>
          <div class="card-title">${title}</div>
        `;
        tile.addEventListener('pointerdown', () => openCard(c.cardId || c.id));
        grid.appendChild(tile);
      });

      const audio = document.getElementById('audio');
      const playerEl = document.getElementById('player');
      const playerCover = document.getElementById('playerCover');
      const playerTitle = document.getElementById('playerTitle');
      const playerChap = document.getElementById('playerChap');
      const playPauseBtn = document.getElementById('playPause');
      const prevBtn = document.getElementById('prevChap');
      const nextBtn = document.getElementById('nextChap');

      let currentCard = null;
      let currentChapters = [];
      let currentIdx = 0;

      playPauseBtn.addEventListener('pointerdown', () => {
        if (audio.paused) { audio.play().catch(()=>{}); playPauseBtn.textContent = '⏸'; }
        else { audio.pause(); playPauseBtn.textContent = '▶'; }
      });
      prevBtn.addEventListener('pointerdown', () => { if (currentIdx > 0) playChapter(currentIdx - 1); });
      nextBtn.addEventListener('pointerdown', () => { if (currentIdx + 1 < currentChapters.length) playChapter(currentIdx + 1); });
      function updateSkipDisabled() {
        prevBtn.disabled = currentIdx <= 0;
        nextBtn.disabled = currentIdx + 1 >= currentChapters.length;
      }
      audio.addEventListener('ended', () => {
        if (currentIdx + 1 < currentChapters.length) playChapter(currentIdx + 1);
        else { playPauseBtn.textContent = '▶'; }
      });

      async function openCard(cardId) {
        const r2 = await yoto.getCard(cardId);
        if (r2.error) { alert('Could not load card: ' + r2.error); return; }
        const card = r2.card;
        currentCard = card;
        const chapters = (card.content && card.content.chapters) || card.chapters || [];
        if (!chapters.length) { alert('No chapters on this card.'); return; }
        currentChapters = chapters;
        if (chapters.length === 1) { playChapter(0); return; }
        showChapterPicker(card, chapters);
      }

      function showChapterPicker(card, chapters) {
        const ov = document.createElement('div');
        ov.className = 'chapters-overlay';
        ov.innerHTML = `<div class="chapters-panel">
          <h3>${(card.metadata && card.metadata.title) || 'Pick a chapter'}</h3>
          <div id="chapList"></div>
          <button class="chap-close">Close</button>
        </div>`;
        ov.querySelector('.chap-close').addEventListener('pointerdown', () => ov.remove());
        const list = ov.querySelector('#chapList');
        chapters.forEach((ch, i) => {
          const row = document.createElement('div');
          row.className = 'chap-row';
          row.innerHTML = `<div class="num">${i+1}</div><div class="t">${ch.title || ch.name || ('Chapter ' + (i+1))}</div>`;
          row.addEventListener('pointerdown', () => { ov.remove(); playChapter(i); });
          list.appendChild(row);
        });
        document.body.appendChild(ov);
      }

      async function playChapter(idx) {
        currentIdx = idx;
        const ch = currentChapters[idx];
        const tracks = ch.tracks || (ch.track ? [ch.track] : []);
        const track = tracks[0] || ch;
        const url = await yoto.getStreamUrl(track);
        if (!url) { alert('Could not get stream URL for this chapter.'); return; }
        audio.src = url;
        audio.play().catch(()=>{});
        playPauseBtn.textContent = '⏸';
        playerEl.classList.add('active');
        const card = currentCard;
        const coverUrl = (card.metadata && card.metadata.cover && card.metadata.cover.imageL) || card.coverImage || null;
        const cardTitle = (card.metadata && card.metadata.title) || 'Playing';
        const chapTitle = ch.title || ch.name || ('Chapter ' + (idx + 1));
        playerCover.innerHTML = coverUrl ? `<img src="${coverUrl}" alt="">` : '🎧';
        playerTitle.textContent = cardTitle;
        playerChap.textContent = chapTitle;
        updateSkipDisabled();
        if (window.yotoPlayer) {
          window.yotoPlayer.publish({
            src: url, position: 0, playing: true,
            title: cardTitle + ' — ' + chapTitle,
            cover: coverUrl || null,
          });
        }
      }
      audio.addEventListener('timeupdate', () => {
        const s = window.yotoPlayer && window.yotoPlayer.getState();
        if (!s) return;
        s.position = audio.currentTime;
        s.playing = !audio.paused;
        window.yotoPlayer.publish(s);
      });
      audio.addEventListener('ended', () => {
        if (currentIdx + 1 >= currentChapters.length && window.yotoPlayer) window.yotoPlayer.clear();
      });
    })();
  </script>
</body>
</html>
