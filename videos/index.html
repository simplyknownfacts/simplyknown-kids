<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>SimplyKnown Kids — Videos</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: linear-gradient(160deg, #2d1b5e, #1a1a4e); overflow-y: auto; }
    .channels-screen { min-height: 100vh; padding: 80px 24px 60px; }
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px; max-width: 720px; margin: 24px auto;
    }
    .channel-tile {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 24px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .channel-tile:active { transform: scale(0.94); }
    .channel-tile .ct-emoji { font-size: 56px; line-height: 1; }
    .channel-tile .ct-label { color:white; font-weight: 900; font-size: 16px; text-align:center; }
    .empty-state {
      color: rgba(255,255,255,0.5); font-size: 15px;
      text-align: center; padding: 60px 20px; line-height: 1.5;
    }
    #playerWrap {
      position: fixed; inset: 0; background: #000;
      display: none; flex-direction: column; z-index: 100;
    }
    #playerWrap.active { display: flex; }
    #playerFrame { flex: 1; width: 100%; border: 0; }
    #playerBack {
      position: absolute; top: 16px; left: 16px;
      background: rgba(0,0,0,0.6); color: white;
      border: 2px solid rgba(255,255,255,0.4);
      width: 56px; height: 56px; border-radius: 50%;
      font-size: 24px; cursor: pointer; z-index: 102;
      display: flex; align-items: center; justify-content: center;
    }
    /* Cover YouTube branding / "Watch on YouTube" link in bottom-right of player.
       Belt + suspenders: sandbox blocks the click target's navigation too. */
    .yt-cover-br {
      position: absolute; right: 0; bottom: 0;
      width: 160px; height: 56px; background: #000;
      pointer-events: auto; z-index: 101;
    }
    .yt-cover-tr {
      position: absolute; right: 0; top: 0;
      width: 56px; height: 56px; background: #000;
      pointer-events: auto; z-index: 101;
    }
  </style>
</head>
<body>
  <div class="channels-screen" id="channelsScreen">
    <div class="title">📺 Watch</div>
    <div class="subtitle" id="subtitle"></div>
    <div class="channels-grid" id="channelsGrid"></div>
  </div>

  <div id="playerWrap">
    <button id="playerBack" aria-label="Back">←</button>
    <div id="playerHost" style="flex:1;width:100%;"></div>
    <div class="yt-cover-tr"></div>
    <div class="yt-cover-br"></div>
  </div>

  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/mascot.js"></script>
  <script>
    if (window.mascot) setTimeout(() => mascot.play('watch_intro'), 400);
    (function() {
      const profile = getActiveProfile();
      if (!profile) { goProfiles(); return; }
      renderBackBtn('../home.html');

      const channels = profile.youtube || [];
      const subtitle = document.getElementById('subtitle');
      const grid = document.getElementById('channelsGrid');

      if (!channels.length) {
        subtitle.textContent = '';
        grid.outerHTML = `<div class="empty-state" style="font-size:17px;line-height:1.6;padding:80px 30px;">
          <div style="font-size:60px;margin-bottom:16px;">📺</div>
          <div style="color:white;font-weight:800;font-size:20px;margin-bottom:12px;">
            No YouTube channels yet
          </div>
          <div style="color:rgba(255,255,255,0.65);">
            A grown-up can add channels in:<br><br>
            <strong style="color:white;">⚙️ Parent Settings → 📺 YouTube Channels</strong>
          </div>
        </div>`;
        return;
      }

      subtitle.textContent = `${profile.name}'s shows`;

      channels.forEach(ch => {
        const tile = document.createElement('div');
        tile.className = 'channel-tile';
        tile.innerHTML = `
          <span class="ct-emoji">${ch.emoji || '📺'}</span>
          <span class="ct-label">${ch.label}</span>
        `;
        tile.addEventListener('click', () => openChannel(ch));
        grid.appendChild(tile);
      });

      const FEED_WORKER = 'https://simplyknown-kids-sync.simplyknownfacts.workers.dev/yt-feed';

      // Load the YouTube IFrame Player API once
      let ytApiReady = new Promise(resolve => {
        if (window.YT && window.YT.Player) return resolve();
        window.onYouTubeIframeAPIReady = () => resolve();
        const s = document.createElement('script');
        s.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(s);
      });

      let _player = null;
      let _queue = [];   // ordered list of video IDs to try
      let _idx = 0;

      function _tryNext() {
        _idx++;
        if (_idx >= _queue.length) {
          // Out of options — kid sees a friendly message in the player area
          if (_player) { try { _player.destroy(); } catch {} _player = null; }
          document.getElementById('playerHost').innerHTML =
            '<div style="color:#fff;display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:24px;font-size:18px;">All caught up! Tap ← to pick another show.</div>';
          return;
        }
        _player.loadVideoById(_queue[_idx]);
      }

      async function openChannel(ch) {
        const wrap = document.getElementById('playerWrap');
        const host = document.getElementById('playerHost');
        host.innerHTML = '<div id="ytTarget" style="width:100%;height:100%;"></div>';
        wrap.classList.add('active');
        let ids = [];
        try {
          const res = await fetch(`${FEED_WORKER}?channel=${ch.channelId}`);
          const data = await res.json();
          if (data && data.videos && data.videos.length) {
            ids = data.videos.map(v => v.id);
          }
        } catch (e) {}
        if (!ids.length) {
          host.innerHTML = '<div style="color:#fff;display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:24px;font-size:18px;">Couldn\'t load shows right now. Tap ← and try again.</div>';
          return;
        }
        _queue = ids;
        _idx = 0;
        await ytApiReady;
        if (_player) { try { _player.destroy(); } catch {} _player = null; }
        _player = new YT.Player('ytTarget', {
          host: 'https://www.youtube-nocookie.com',
          videoId: _queue[0],
          playerVars: {
            autoplay: 1, modestbranding: 1, rel: 0, playsinline: 1,
            controls: 1, fs: 0, iv_load_policy: 3,
          },
          events: {
            // Auto-skip on error codes: 2 (bad id), 5 (HTML5 player), 100 (removed),
            // 101 / 150 / 153 (embed not allowed).
            onError: () => _tryNext(),
            // Auto-advance to next show when current ends.
            onStateChange: e => { if (e.data === YT.PlayerState.ENDED) _tryNext(); },
          },
        });
      }

      document.getElementById('playerBack').addEventListener('pointerdown', () => {
        if (_player) { try { _player.stopVideo(); _player.destroy(); } catch {} _player = null; }
        document.getElementById('playerHost').innerHTML = '';
        document.getElementById('playerWrap').classList.remove('active');
      });
    })();
  </script>
</body>
</html>
