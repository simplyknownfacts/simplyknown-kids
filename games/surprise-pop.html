<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Surprise Pop</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #2a2160, #141033 70%); touch-action: manipulation; }
    #stage { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; }
    #egg { font-size: 140px; line-height: 1; background: none; border: none; cursor: pointer;
      filter: drop-shadow(0 14px 18px rgba(0,0,0,0.4)); animation: wobble 1.6s ease-in-out infinite; }
    #egg:active { transform: scale(0.94); }
    @keyframes wobble { 0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(7deg)} }
    #reveal { display: none; flex-direction: column; align-items: center; gap: 14px; }
    #surprise { font-size: 150px; line-height: 1; animation: pop 0.5s cubic-bezier(0.22,1,0.36,1) both;
      filter: drop-shadow(0 14px 18px rgba(0,0,0,0.4)); }
    /* Guess clue: the surprise shown as a black silhouette to match against the choices. */
    #surprise.shadow { filter: brightness(0); opacity: 0.9; animation: jiggle 0.7s ease-in-out infinite; }
    @keyframes jiggle { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
    @keyframes pop { 0%{transform:scale(0.1) rotate(-30deg);opacity:0} 60%{transform:scale(1.2) rotate(8deg);opacity:1} 100%{transform:scale(1) rotate(0)} }
    #name { font-family: var(--font-display, sans-serif); font-weight: 800; font-size: 40px; color: #fff;
      text-shadow: 0 3px 12px rgba(0,0,0,0.5); text-align: center; }
    #sub { font-family: var(--font-ui, sans-serif); font-weight: 700; font-size: 20px; color: rgba(255,255,255,0.85); }
    /* Guess choices (tier 5+) */
    #choices { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
    .choice { font-size: 60px; line-height: 1; background: rgba(255,255,255,0.10);
      border: 3px solid rgba(255,255,255,0.25); border-radius: 24px; padding: 10px 16px; cursor: pointer;
      transition: transform .12s ease; }
    .choice:active { transform: scale(0.9); }
    .choice:disabled { opacity: 0.45; }
    /* Collection strip (tier 3+) — pointer-events:none so taps fall through to Back. */
    #collection { position: fixed; top: 58px; left: 0; right: 0; display: flex; flex-wrap: wrap;
      gap: 5px 7px; justify-content: center; align-items: center; padding: 0 12px; pointer-events: none; }
    .col-count { font-family: var(--font-ui, sans-serif); font-weight: 800; font-size: 15px; color: #fff;
      background: rgba(255,255,255,0.16); padding: 3px 11px; border-radius: 999px; margin-right: 4px; }
    .col-item { font-size: 22px; line-height: 1; opacity: 0.3; filter: grayscale(1); transition: opacity .3s; }
    .col-item.got { opacity: 1; filter: none; }
    #hint { position: fixed; left: 0; right: 0; bottom: 30px; text-align: center; pointer-events: none;
      font-family: var(--font-ui, sans-serif); font-weight: 800; font-size: 17px; color: rgba(255,255,255,0.85);
      text-shadow: 0 2px 8px rgba(0,0,0,0.5); transition: opacity .4s; }
    .confetti { position: fixed; width: 12px; height: 12px; border-radius: 2px; pointer-events: none;
      animation: fly 1s ease-out forwards; }
    @keyframes fly { 0%{opacity:1;transform:translate(0,0) rotate(0)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--r))} }
    @media (prefers-reduced-motion: reduce) { #egg,#surprise{animation:none} .confetti{display:none} }
  </style>
</head>
<body>
  <div id="collection"></div>
  <div id="stage">
    <button id="egg" aria-label="Tap the egg">🥚</button>
    <div id="reveal">
      <div id="surprise"></div>
      <div id="name"></div>
      <div id="sub"></div>
      <div id="choices"></div>
    </div>
  </div>
  <div id="hint">👆 Tap the egg!</div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
  (function () {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'surprise-pop');

    renderBackBtn('index.html');
    gameSettings.attach('surprise-pop');
    if (window.vbProgress) { vbProgress.firstPlay('surprise-pop'); vbProgress.touchStreak(); }

    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const showName       = tier >= 3;  // toddlers+ see what popped out (first words)
    const showCollection = tier >= 3;  // toddlers+ fill a collection of all 16
    const showGuess      = tier >= 5;  // big kids guess from a silhouette clue before it pops

    // Broad mix (animals + objects + magic) on purpose — keeps this game's content
    // distinct from Peek-a-boo, which is the find-the-hidden-ANIMAL game.
    const SURPRISES = [
      { e: '🐤', n: 'Chick' }, { e: '🐶', n: 'Puppy' }, { e: '🐱', n: 'Kitten' }, { e: '🐰', n: 'Bunny' },
      { e: '🦆', n: 'Duck' }, { e: '🐸', n: 'Frog' }, { e: '🐢', n: 'Turtle' }, { e: '🐝', n: 'Bee' },
      { e: '🦄', n: 'Unicorn' }, { e: '⭐', n: 'Star' }, { e: '🌈', n: 'Rainbow' }, { e: '🌸', n: 'Flower' },
      { e: '🎈', n: 'Balloon' }, { e: '🧸', n: 'Teddy' }, { e: '🚂', n: 'Train' }, { e: '🍎', n: 'Apple' },
    ];
    const EGGS = ['🥚', '🎁', '🫧'];
    const CC = ['#FF6B6B', '#FFE66D', '#4ECDC4', '#a86cdb', '#FF9F43', '#45B7D1', '#FF69B4'];

    const eggEl = document.getElementById('egg');
    const revealEl = document.getElementById('reveal');
    const surpriseEl = document.getElementById('surprise');
    const nameEl = document.getElementById('name');
    const subEl = document.getElementById('sub');
    const choicesEl = document.getElementById('choices');
    const hintEl = document.getElementById('hint');
    const colEl = document.getElementById('collection');
    let busy = false, pops = 0, lastIdx = -1;

    // ── Collection (persisted per child) ──────────────────────────────────────
    const FKEY = 'vb_sppop_' + profile.id;
    let found = {};
    try { found = JSON.parse(localStorage.getItem(FKEY) || '{}'); } catch (e) { found = {}; }
    const saveFound = () => { try { localStorage.setItem(FKEY, JSON.stringify(found)); } catch (e) {} };
    const foundCount = () => SURPRISES.filter(s => found[s.n]).length;

    function renderCollection() {
      if (!showCollection) return;
      colEl.innerHTML = `<span class="col-count">✨ ${foundCount()} / ${SURPRISES.length}</span>` +
        SURPRISES.map(s => `<span class="col-item ${found[s.n] ? 'got' : ''}">${found[s.n] ? s.e : '❔'}</span>`).join('');
    }

    function confetti() {
      if (reduce) return;
      const cx = window.innerWidth / 2, cy = window.innerHeight * 0.4;
      for (let i = 0; i < 16; i++) {
        const d = document.createElement('div'); d.className = 'confetti';
        d.style.left = cx + 'px'; d.style.top = cy + 'px';
        d.style.background = CC[i % CC.length];
        const a = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 150;
        d.style.setProperty('--tx', Math.cos(a) * dist + 'px');
        d.style.setProperty('--ty', (Math.sin(a) * dist - 40) + 'px');
        d.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
        document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
      }
    }

    function resetEgg() {
      revealEl.style.display = 'none';
      choicesEl.innerHTML = '';
      surpriseEl.className = '';
      eggEl.textContent = EGGS[pops % EGGS.length];
      eggEl.style.display = '';
      busy = false;
    }

    // correct: true = guessed right, false = guessed wrong, null = no guess (just tapped)
    function finishReveal(s, correct) {
      surpriseEl.className = '';
      surpriseEl.textContent = s.e;
      nameEl.textContent = showName ? s.n + '!' : '';
      subEl.textContent = correct === true ? 'Yes!' : correct === false ? ('It was a ' + s.n + '!') : '';
      revealEl.style.display = 'flex';
      confetti();
      if (typeof playSuccess === 'function') { try { playSuccess(); } catch (e) {} }
      if (typeof haptic === 'function') haptic(24);
      if (window.vbProgress) vbProgress.record('surprise-pop');
      // Only speak phrases that have a recorded clip — surprise NAMES aren't recorded,
      // so we keep naming visual-only (no robotic TTS). "Yes!" is recorded.
      if (correct === true) { try { speak('Yes!'); } catch (e) {} }

      const wasNew = showCollection && !found[s.n];
      if (wasNew) { found[s.n] = 1; saveFound(); }
      renderCollection();
      pops++;

      if (showCollection && foundCount() === SURPRISES.length) {
        setTimeout(celebrateComplete, 1700);
      } else {
        setTimeout(resetEgg, showGuess ? 2100 : 1700);
      }
    }

    function celebrateComplete() {
      surpriseEl.className = '';
      surpriseEl.textContent = '🏆';
      nameEl.textContent = 'You found them all!';
      subEl.textContent = '✨ New set ✨';
      choicesEl.innerHTML = '';
      revealEl.style.display = 'flex';
      confetti(); setTimeout(confetti, 250); setTimeout(confetti, 500);
      if (typeof playSuccess === 'function') { try { playSuccess(); } catch (e) {} }
      found = {}; saveFound(); renderCollection();
      pops++;
      setTimeout(resetEgg, 2600);
    }

    function showGuessStep(s) {
      surpriseEl.className = 'shadow';      // black silhouette clue
      surpriseEl.textContent = s.e;
      nameEl.textContent = "What's inside?";
      subEl.textContent = '🤔 Guess!';
      // 3 choices: the answer + 2 distractors, shuffled
      const others = SURPRISES.filter(x => x.n !== s.n).sort(() => Math.random() - 0.5).slice(0, 2);
      const opts = [s, ...others].sort(() => Math.random() - 0.5);
      choicesEl.innerHTML = '';
      opts.forEach(o => {
        const b = document.createElement('button');
        b.className = 'choice'; b.textContent = o.e; b.setAttribute('aria-label', 'Guess ' + o.n);
        b.addEventListener('pointerdown', (ev) => {
          ev.preventDefault();
          choicesEl.querySelectorAll('button').forEach(x => x.disabled = true);
          const ok = o.n === s.n;
          if (!ok && typeof playBoop === 'function') { try { playBoop(); } catch (e) {} }
          choicesEl.innerHTML = '';
          finishReveal(s, ok);
        });
        choicesEl.appendChild(b);
      });
      revealEl.style.display = 'flex';
    }

    function pop() {
      if (busy) return;
      busy = true;
      hintEl.style.opacity = '0';
      let idx; do { idx = Math.floor(Math.random() * SURPRISES.length); } while (idx === lastIdx && SURPRISES.length > 1);
      lastIdx = idx;
      const s = SURPRISES[idx];
      eggEl.style.display = 'none';
      if (showGuess) showGuessStep(s);
      else finishReveal(s, null);
    }

    eggEl.addEventListener('pointerdown', (e) => { e.preventDefault(); pop(); });
    renderCollection();
  })();
  </script>
</body>
</html>
