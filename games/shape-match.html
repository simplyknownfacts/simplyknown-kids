<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Shape Match</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #1a1a2e, #16213e); }
    svg.shape { overflow: visible; cursor: grab; touch-action: none; }
    svg.shape:active { cursor: grabbing; }
    /* Push the (title + hint + shapes) block to the top half so that targets
       (position:fixed below, calculated from shapesBottom) live in the bottom
       half. Prevents the source shape from overlapping a drop target. */
    .screen {
      justify-content: flex-start !important;
      padding-top: calc(90px + env(safe-area-inset-top));
    }
    .shapes-row {
      display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;
    }
    /* Targets in drag mode are pinned to viewport pixels so they can't overflow */
    #targetsRow { position: relative; width: 100%; height: 1px; }
    .target {
      position: fixed; /* viewport-anchored; left/top set in JS as px */
      width: 130px; height: 130px;
      border: 4px dashed currentColor;
      border-radius: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px;
      z-index: 5;
    }
    .target svg.shape { opacity: 0.45; }
    .target-label {
      font-size: 26px; font-weight: 800; color: currentColor; opacity: 0.85;
      line-height: 1;
    }
    .target.matched { border-style: solid; opacity: 1; }
    .target.matched svg.shape { opacity: 1; }
    .drag-hint { font-size: 24px; color: rgba(255,255,255,0.5); margin: 4px 0; }
    /* "How many sides?" number choices (tier 7+) */
    .num-choice {
      min-width: 74px; min-height: 74px; border-radius: 18px; border: 3px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.12); color: #fff; font-size: 30px; font-weight: 900;
      cursor: pointer; transition: transform .1s;
    }
    .num-choice:active { transform: scale(0.92); }
    .num-choice.ok  { background: rgba(168,230,207,0.55); border-color: #a8e6cf; }
    .num-choice.bad { background: rgba(255,107,107,0.45); }
  </style>
</head>
<body>
  <div class="screen">
    <div class="title">🔷 Shape Match</div>
    <div class="subtitle" id="hint"></div>
    <div class="shapes-row" id="shapesRow"></div>
    <div class="targets-row" id="targetsRow"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'shape-match');
    renderBackBtn('index.html');
    gameSettings.attach('shape-match');
    if (window.vbProgress) { vbProgress.firstPlay('shape-match'); vbProgress.touchStreak(); }

    // Drag-and-drop needs a pincer grab + aimed release — that's ~3yr+ motor
    // skill. Sensory babies (T1) AND Explore toddlers (T2, ~1-2yr, e.g. Noah)
    // get the simpler single-shape tap-to-name mode; drag starts at T3 (2-3yr).
    // A parent can still force drag earlier via the dragMode feature toggle.
    const dragOn = tier >= 3 || getProfileFeature(profile, 'shape-match', 'dragMode');
    let shapeTimer = null;
    window.addEventListener('beforeunload', () => clearTimeout(shapeTimer));

    const SHAPES = [
      { name: 'Circle',   color: '#FF6B6B', path: (s) => `<circle cx="50" cy="50" r="${s*0.45}" fill="currentColor"/>` },
      { name: 'Square',   color: '#FFE66D', path: (s) => `<rect x="${s*0.1}" y="${s*0.1}" width="${s*0.8}" height="${s*0.8}" fill="currentColor"/>` },
      { name: 'Triangle', color: '#4ECDC4', path: (s) => `<polygon points="${s/2},${s*0.1} ${s*0.9},${s*0.9} ${s*0.1},${s*0.9}" fill="currentColor"/>` },
      { name: 'Star',     color: '#FF9F43', path: (s) => {
        const pts = [];
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? s * 0.45 : s * 0.2;
          const a = (Math.PI * 2 * i) / 10 - Math.PI / 2;
          pts.push(`${50 + r * Math.cos(a)},${50 + r * Math.sin(a)}`);
        }
        return `<polygon points="${pts.join(' ')}" fill="currentColor"/>`;
      }},
      { name: 'Heart',    color: '#c8b8f0', path: () => `<text x="50" y="72" text-anchor="middle" font-size="72">❤️</text>` },
      { name: 'Diamond',  color: '#45B7D1', path: (s) => `<polygon points="${s/2},${s*0.08} ${s*0.92},${s/2} ${s/2},${s*0.92} ${s*0.08},${s/2}" fill="currentColor"/>` },
    ];

    // Polygons for the tier-7+ "How many sides?" round (kept separate from the
    // drag pool so toddler drag mode is unchanged). Square uses an axis-aligned
    // rect; the rest are regular polygons.
    function regPoly(n, r) {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n - Math.PI / 2;
        pts.push(`${(50 + r * Math.cos(a)).toFixed(1)},${(50 + r * Math.sin(a)).toFixed(1)}`);
      }
      return pts.join(' ');
    }
    const POLY = [
      { name: 'Triangle', sides: 3, color: '#4ECDC4', path: () => `<polygon points="${regPoly(3, 44)}" fill="currentColor"/>` },
      { name: 'Square',   sides: 4, color: '#FFE66D', path: () => `<rect x="14" y="14" width="72" height="72" fill="currentColor"/>` },
      { name: 'Pentagon', sides: 5, color: '#FF9F43', path: () => `<polygon points="${regPoly(5, 45)}" fill="currentColor"/>` },
      { name: 'Hexagon',  sides: 6, color: '#a86cdb', path: () => `<polygon points="${regPoly(6, 45)}" fill="currentColor"/>` },
      { name: 'Octagon',  sides: 8, color: '#45B7D1', path: () => `<polygon points="${regPoly(8, 45)}" fill="currentColor"/>` },
    ];
    const sidesOn = tier >= 7;

    // 3D shapes (tier 8+): join the drag pool so big kids match + name them.
    const SHAPES3D = [
      { name: 'Cube',   color: '#FF6B6B', path: () => `<g fill="currentColor"><polygon points="26,42 54,42 54,80 26,80"/><polygon points="26,42 46,26 74,26 54,42" opacity="0.7"/><polygon points="54,42 74,26 74,64 54,80" opacity="0.5"/></g>` },
      { name: 'Sphere', color: '#4ECDC4', path: () => `<circle cx="50" cy="52" r="34" fill="currentColor"/><ellipse cx="40" cy="41" rx="11" ry="8" fill="rgba(255,255,255,0.55)"/>` },
      { name: 'Cone',   color: '#FF9F43', path: () => `<ellipse cx="50" cy="80" rx="28" ry="9" fill="currentColor" opacity="0.65"/><polygon points="50,18 78,82 22,82" fill="currentColor"/>` },
    ];
    const threeDOn = tier >= 8;
    const oddOn = tier >= 8;

    function makeSVG(shape, size, useColor = true) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', size); svg.setAttribute('height', size);
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.classList.add('shape');
      svg.style.color = useColor ? shape.color : 'rgba(255,255,255,0.2)';
      svg.innerHTML = shape.path(100);
      return svg;
    }

    // Tier 7+: "How many sides?" — show a polygon, tap the right side count.
    function sidesRound() {
      const shapesRow = document.getElementById('shapesRow');
      const targetsRow = document.getElementById('targetsRow');
      const hint = document.getElementById('hint');
      shapesRow.innerHTML = ''; targetsRow.innerHTML = '';
      document.querySelectorAll('.target').forEach(t => t.remove());

      const s = POLY[Math.floor(Math.random() * POLY.length)];
      const svg = makeSVG(s, 170); svg.classList.add('pulse');
      shapesRow.appendChild(svg);
      hint.textContent = 'How many sides?';
      speak('How many sides?');

      const choices = new Set([s.sides]);
      while (choices.size < 3) {
        const off = Math.floor(Math.random() * 3) + 1;
        choices.add(Math.max(3, Math.min(8, s.sides + (Math.random() < 0.5 ? off : -off))));
      }
      const row = document.createElement('div'); row.className = 'shapes-row'; row.style.marginTop = '24px';
      [...choices].sort((a, b) => a - b).forEach(n => {
        const btn = document.createElement('button');
        btn.className = 'num-choice'; btn.textContent = n;
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (n === s.sides) {
            btn.classList.add('ok'); playSuccess(); speak(String(s.sides));
            if (window.vbProgress) { vbProgress.record('shape-match'); vbProgress.mastery('shape-match.mastery'); }
            clearTimeout(shapeTimer); shapeTimer = setTimeout(nextRound, 1500);
          } else {
            btn.classList.add('bad'); playBoop();
            setTimeout(() => btn.classList.remove('bad'), 400);
          }
        });
        row.appendChild(btn);
      });
      targetsRow.appendChild(row);
    }

    // Tier 8+: odd-one-out — three of one shape + one different; tap the different.
    function oddRound() {
      const shapesRow = document.getElementById('shapesRow');
      const targetsRow = document.getElementById('targetsRow');
      const hint = document.getElementById('hint');
      shapesRow.innerHTML = ''; targetsRow.innerHTML = '';
      document.querySelectorAll('.target').forEach(t => t.remove());
      const pool = SHAPES.concat(SHAPES3D);
      const pick = [...pool].sort(() => Math.random() - 0.5).slice(0, 2);
      const majority = pick[0], odd = pick[1];
      const items = [odd, majority, majority, majority].sort(() => Math.random() - 0.5);
      hint.textContent = 'Which one is different?'; speak('Which one is different?');
      const row = document.createElement('div'); row.className = 'shapes-row'; row.style.gap = '20px';
      items.forEach(s => {
        const svg = makeSVG(s, 92); svg.style.cursor = 'pointer'; svg.style.transition = 'transform .12s, opacity .2s';
        svg.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (s === odd) {
            playSuccess(); speak(s.name);
            if (window.vbProgress) { vbProgress.record('shape-match'); vbProgress.mastery('shape-match.mastery'); }
            svg.style.transform = 'scale(1.2)';
            clearTimeout(shapeTimer); shapeTimer = setTimeout(nextRound, 1500);
          } else {
            playBoop(); svg.style.opacity = '0.35';
            setTimeout(() => { svg.style.opacity = '1'; }, 500);
          }
        });
        row.appendChild(svg);
      });
      shapesRow.appendChild(row);
    }

    function nextRound() {
      if (sidesOn && Math.random() < 0.33) { sidesRound(); return; }
      if (oddOn && Math.random() < 0.33) { oddRound(); return; }
      const shapesRow = document.getElementById('shapesRow');
      const targetsRow = document.getElementById('targetsRow');
      const hint = document.getElementById('hint');
      shapesRow.innerHTML = ''; targetsRow.innerHTML = '';
      // Clean up any prior round's targets that were attached to body (drag mode)
      document.querySelectorAll('.target').forEach(t => t.remove());

      // Tap-to-identify mode (!dragOn): always 1 shape (single shape named on tap).
      // Drag mode: toddler starts at 2, count grows with age.
      //   tier 2 -> 2, tier 3 -> 2, tier 4 -> 3, tier 5 -> 3,
      //   tier 6 -> 4, tier 7 -> 5, tier 8 -> 6
      const DRAG_COUNT = { 2: 2, 3: 2, 4: 3, 5: 3, 6: 4, 7: 5, 8: 6 };
      const count = !dragOn ? 1 : (DRAG_COUNT[tier] || 2);
      const pool = threeDOn ? SHAPES.concat(SHAPES3D) : SHAPES;
      const selected = [...pool].sort(() => Math.random() - 0.5).slice(0, count);

      if (!dragOn) {
        const s = selected[0];
        const svg = makeSVG(s, tier <= 2 ? 200 : 180);
        svg.classList.add('pulse');
        svg.style.transition = 'transform 0.15s ease';
        let done = false;
        const reveal = (e) => {
          if (e) { e.preventDefault(); e.stopPropagation(); }
          if (done) return; // one reaction per shape
          done = true;
          // Immediate, obvious feedback so a tap never feels dead:
          hint.textContent = s.name;            // show the name big
          svg.classList.remove('pulse');
          svg.style.transform = 'scale(1.18)';  // quick bounce
          setTimeout(() => { svg.style.transform = 'scale(1)'; }, 160);
          playChime();
          if (window.vbProgress) vbProgress.record('shape-match');
          speak(s.name);
          clearTimeout(shapeTimer);
          shapeTimer = setTimeout(nextRound, 1600);
        };
        // pointerdown = no 300ms tap delay, fires reliably on touch + mouse.
        svg.addEventListener('pointerdown', reveal);
        shapesRow.appendChild(svg);
        hint.textContent = tier <= 2 ? '👆 Tap the shape!' : `Tap the ${s.name}!`;
        speak(s.name);
        return;
      }

      hint.textContent = '👆 Drag each shape to its matching box!';
      let matched = 0;

      const shuffledTargets = [...selected].sort(() => Math.random() - 0.5);
      const targetEls = {};

      // Create + append the SOURCE shapes FIRST so .shapes-row has its real
      // (possibly wrapped) height before we place the targets. Otherwise targets
      // are positioned against an EMPTY row and the shapes then expand down into
      // them and overlap — worst for older kids (up to 6 shapes) on a narrow
      // phone. Shrink the source shapes on narrow viewports so the row wraps less
      // and leaves room for the drop boxes.
      const narrowVp = window.innerWidth < 480;
      const srcSize = tier <= 4 ? (narrowVp ? 92 : 120) : (narrowVp ? 60 : 90);
      selected.forEach(s => {
        const svg = makeSVG(s, srcSize);
        svg.classList.add('pulse');
        svg.dataset.shape = s.name;
        let dragging = false, startX, startY, origX, origY;
        svg.addEventListener('pointerdown', e => {
          svg.classList.remove('pulse');
          dragging = true;
          const r = svg.getBoundingClientRect();
          startX = e.clientX; startY = e.clientY;
          origX = r.left; origY = r.top;
          svg.style.position = 'fixed';
          svg.style.zIndex = 999;
          svg.style.left = r.left + 'px'; svg.style.top = r.top + 'px';
          try { svg.setPointerCapture(e.pointerId); } catch {}
        });
        svg.addEventListener('pointermove', e => {
          if (!dragging) return;
          svg.style.left = (origX + e.clientX - startX) + 'px';
          svg.style.top  = (origY + e.clientY - startY)  + 'px';
        });
        svg.addEventListener('pointerup', e => {
          dragging = false;
          const target = targetEls[s.name];
          if (!target) return;
          const tr = target.getBoundingClientRect();
          if (e.clientX > tr.left && e.clientX < tr.right &&
              e.clientY > tr.top  && e.clientY < tr.bottom) {
            target.classList.add('matched');
            svg.style.display = 'none';
            playSuccess(); speak(s.name);
            if (typeof haptic === 'function') haptic(25); // satisfying correct-match tick
            if (window.vbProgress) vbProgress.record('shape-match');
            matched++;
            if (matched === count) {
              if (count === 6 && window.vbProgress) vbProgress.mastery('shape-match.mastery');
              setTimeout(nextRound, 1500);
            }
          } else {
            playBoop();
            svg.style.position = ''; svg.style.left = ''; svg.style.top = '';
          }
        });
        shapesRow.appendChild(svg);
      });

      // Safe play area = viewport rectangle minus reserved zones for chrome/UI.
      // Targets are position:fixed so they can't overflow document below the fold.
      const MARGIN = 16;
      const TARGET_MAX = 130;  // roomy boxes when space allows
      const TARGET_MIN = 76;   // never shrink below an easy drop target for little fingers
      const safeBottomCSS = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue('--sai-b').trim()) || 0;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const shapesBottom = shapesRow.getBoundingClientRect().bottom;
      const reserveTop    = shapesBottom + MARGIN; // never let targets ride up under the source shapes
      const reserveBottom = 120 + safeBottomCSS; // gear (48) + safe-area + app drawer breathing room
      // Side reserves clear the back-btn (left) and gear (right). On narrow
      // phones the full reserves leave almost no width, forcing a 1-col stack
      // that overlaps — so shrink them when the viewport is tight. The chrome
      // sits at the very top/bottom corners, and the play grid is vertically
      // centered between shapesBottom and the gear, so trimming the side gutters
      // here doesn't actually collide with that chrome.
      const narrow = vw < 480;
      const reserveLeft  = narrow ? 24 : 110;
      const reserveRight = narrow ? 24 : 90;

      // Outer box the grid must fit inside (full target width before sizing).
      const fieldW = Math.max(0, vw - reserveLeft - reserveRight);
      const fieldH = Math.max(0, vh - reserveTop - reserveBottom);

      // Deterministic grid: pick a column count that fits using the SMALLEST
      // acceptable box, then derive the actual box size so every row AND column
      // fits with no overlap. We size to fit instead of capping the row step
      // (which previously let rows slide on top of each other).
      const n = shuffledTargets.length;
      const cellMin = TARGET_MIN + MARGIN;
      const colsFit = Math.max(1, Math.floor((fieldW + MARGIN) / cellMin));
      const cols = Math.max(1, Math.min(n, colsFit));
      const rows = Math.ceil(n / cols);
      // Largest box that fits both axes given this col/row count, clamped.
      const fitByW = (fieldW - (cols - 1) * MARGIN) / cols;
      const fitByH = (fieldH - (rows - 1) * MARGIN) / rows;
      const TARGET = Math.max(TARGET_MIN, Math.min(TARGET_MAX, fitByW, fitByH));

      const minX = reserveLeft + TARGET / 2;
      const maxX = vw - reserveRight - TARGET / 2;
      const minY = reserveTop + TARGET / 2;
      const maxY = vh - reserveBottom - TARGET / 2;
      const safeW = Math.max(0, maxX - minX);
      const safeH = Math.max(0, maxY - minY);

      // Row pitch = exactly what a non-overlapping row needs (box + margin),
      // but spread out to fill the safe height if there's room to spare.
      const rowPitch = rows > 1
        ? Math.max(TARGET + MARGIN, Math.min(safeH / (rows - 1), TARGET + MARGIN + 24))
        : 0;
      // Center the grid block vertically inside the safe area
      const gridH = rowPitch * (rows - 1);
      const yOrigin = minY + (safeH - gridH) / 2;
      const jitter = TARGET >= 110 ? 8 : 0; // no jitter on tight grids — keep clearance honest
      const positions = shuffledTargets.map((_, i) => {
        const r = Math.floor(i / cols);
        const c = i % cols;
        // Last row may be partial — center its cells
        const colsInRow = (r === rows - 1) ? (n - r * cols) : cols;
        const rowColStep = colsInRow > 1 ? safeW / (colsInRow - 1) : 0;
        const rowXOrigin = colsInRow > 1 ? minX : (minX + maxX) / 2;
        const x = rowXOrigin + c * rowColStep + (Math.random() - 0.5) * jitter;
        const y = yOrigin + r * rowPitch + (Math.random() - 0.5) * jitter;
        return { x, y };
      });

      // Inner shape/label scale with the box so small boxes don't look cramped.
      const innerSize = Math.round(TARGET * 0.42);
      shuffledTargets.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'target';
        div.dataset.shape = s.name;
        const spot = positions[i];
        // center coordinates; translate to top-left for position:fixed
        div.style.width = TARGET + 'px';
        div.style.height = TARGET + 'px';
        div.style.left = (spot.x - TARGET / 2) + 'px';
        div.style.top  = (spot.y - TARGET / 2) + 'px';
        div.style.color = s.color;
        div.style.background = s.color + '20';
        div.appendChild(makeSVG(s, innerSize, true));
        const lbl = document.createElement('div');
        lbl.className = 'target-label';
        lbl.style.fontSize = Math.round(TARGET * 0.2) + 'px';
        lbl.textContent = '⬇';  // pre-reader-friendly cue instead of "DROP HERE" caps
        div.appendChild(lbl);
        document.body.appendChild(div); // attach to body, not targetsRow (target uses position:fixed)
        targetEls[s.name] = div;
      });

      // (source shapes are created above, before the targets, so .shapes-row has
      // its real height when the target positions are computed)
    }

    nextRound();
    })();
  </script>
</body>
</html>
