<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Tap &amp; Pop</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #canvas { position: fixed; inset: 0; }
    #score {
      position: fixed; top: 16px; right: 16px;
      font-size: 28px; font-weight: 900; color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="score">⭐ <span id="scoreVal">0</span></div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'tap-pop');

    renderBackBtn('index.html');
    gameSettings.attach('tap-pop');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const COLORS = ['#FF6B6B','#FFE66D','#4ECDC4','#a86cdb','#FF9F43','#45B7D1'];
    let bubbles = [], score = 0, animId;

    // Score counter is always on now (every age), no parent toggle.
    const scoreOn = true;
    const startedAt = Date.now();

    const scoreEl = document.getElementById('score');
    const scoreVal = document.getElementById('scoreVal');
    scoreEl.style.display = 'block';

    function randColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

    // Movement modes by tier (per Scott's spec):
    //   1 — 2-3 slow floaters, varying speeds, no auto-pop
    //   2 — multiple float-up bubbles, varying speeds
    //   3 — wiggle + drift, varying drift speeds
    //   4 — wiggle/drift but some bubbles fade out partway through
    //   5+ — MIX: some wiggle, some flash in/out, some edge-cross; many vanish randomly
    //
    // Shiny bubbles (~10% spawn rate) appear at every tier. They're 30%
    // smaller (harder to tap), move/fade faster, and pop for 3 points
    // instead of 1. Golden gradient + animated sparkles distinguish them.
    function spawnBubble() {
      const shiny = Math.random() < 0.10;
      const baseR = tier <= 2 ? 90 : tier <= 4 ? 70 : 55;
      const r = shiny ? Math.round(baseR * 0.7) : baseR;
      const b = {
        r, color: randColor(), born: Date.now(),
        popping: false, popProgress: 0,
        shiny,
      };

      // Age-based speed scaling: younger tiers move noticeably slower, older
      // faster. tier3=0.70 ... tier8=1.15. (tiers 1-2 use their own slow float.)
      const speedMul = tier <= 2 ? 1 : (0.70 + (tier - 3) * 0.09);

      // Pick movement mode for THIS bubble.
      let mode;
      if (tier <= 2) {
        mode = 'float';
      } else {
        // tier 3+: weighted mix so the screen is never uniform — some rise
        // (straight OR wiggling), some flash in/out, some cross from an edge.
        const pick = Math.random();
        if (pick < 0.55) {
          mode = 'wiggle'; // "rise" — wiggle amp varies, incl. ~straight
          if (Math.random() < 0.35) b.lifespan = 1800 + Math.random() * 3000; // some fade out
        } else if (pick < 0.80) {
          mode = 'flash';  // appear then disappear in place (reappear feel)
          b.lifespan = 900 + Math.random() * 700;
        } else {
          mode = 'random'; // cross from a random edge
          if (Math.random() < 0.4) b.lifespan = 1500 + Math.random() * 1800;
        }
      }
      b.mode = mode;

      const shinyMult = shiny ? 1.6 : 1;

      if (mode === 'float') {
        b.x = r + Math.random() * (canvas.width - r * 2);
        b.y = canvas.height + r;
        b.vy = (tier === 1
          ? -(0.25 + Math.random() * 1.0)
          : -(0.8  + Math.random() * 2.5)) * shinyMult;
      } else if (mode === 'wiggle') {
        b.baseX = r + Math.random() * (canvas.width - r * 2);
        b.baseY = canvas.height + r;
        b.x = b.baseX; b.y = b.baseY;
        b.phase   = Math.random() * Math.PI * 2;
        b.phaseY  = Math.random() * Math.PI * 2;
        // ~30% go essentially straight up (tiny amp); the rest vary narrow↔wide.
        b.wiggleAmp = (Math.random() < 0.3 ? Math.random() * 12 : 25 + Math.random() * 65) * (shiny ? 1.3 : 1);
        b.wigSpeed  = 0.018 + Math.random() * 0.06;        // varied wiggle frequency (some fast, some slow)
        b.bobAmp    = 6 + Math.random() * 24;              // varied vertical bob
        b.driftUp   = (0.5 + Math.random() * 1.8) * speedMul * shinyMult;
        if (shiny && b.lifespan) b.lifespan *= 0.6;
      } else if (mode === 'random') {
        const edge = Math.floor(Math.random() * 4);
        const spd  = (1.8 + Math.random() * 2.6) * speedMul * shinyMult;
        if      (edge === 0) { b.x = Math.random()*canvas.width;  b.y = -r;              b.vx = (Math.random()-0.5)*2; b.vy = spd;  }
        else if (edge === 1) { b.x = canvas.width + r;            b.y = Math.random()*canvas.height; b.vx = -spd; b.vy = (Math.random()-0.5)*2; }
        else if (edge === 2) { b.x = Math.random()*canvas.width;  b.y = canvas.height+r; b.vx = (Math.random()-0.5)*2; b.vy = -spd; }
        else                 { b.x = -r;                          b.y = Math.random()*canvas.height; b.vx = spd;  b.vy = (Math.random()-0.5)*2; }
        if (shiny && b.lifespan) b.lifespan *= 0.6;
      } else { // flash
        b.x = r + Math.random() * (canvas.width - r * 2);
        b.y = r + Math.random() * (canvas.height - r * 2);
        if (shiny) b.lifespan *= 0.6;
      }
      bubbles.push(b);
    }

    const POP_TYPES = ['classic', 'fireworks', 'glitter', 'confetti', 'hearts', 'stars'];
    const SHINY_COLORS = ['#FFD700', '#FFF8B0', '#FFA500', '#FFEC8B'];
    function popBubble(b) {
      if (b.popping) return;
      b.popping = true;
      // Shiny bubbles always pop as 'shiny' (golden fireworks); regular bubbles
      // randomise. The 'shiny' style uses glitter geometry with gold particles.
      b.popType = b.shiny ? 'shiny' : POP_TYPES[Math.floor(Math.random() * POP_TYPES.length)];
      b.particles = [];
      const cnt = b.popType === 'shiny' ? 20 : b.popType === 'glitter' ? 16 : b.popType === 'confetti' ? 10 : 8;
      for (let i = 0; i < cnt; i++) {
        const a = (Math.PI * 2 * i) / cnt + (Math.random() - 0.5) * 0.4;
        const speed = (b.popType === 'shiny' ? 7 : 6) + Math.random() * 5;
        b.particles.push({
          dx: Math.cos(a) * speed,
          dy: Math.sin(a) * speed,
          rot: Math.random() * Math.PI * 2,
          rotV: (Math.random() - 0.5) * 0.3,
          color: b.popType === 'shiny'
            ? SHINY_COLORS[Math.floor(Math.random() * SHINY_COLORS.length)]
            : (b.popType === 'fireworks' || b.popType === 'confetti'
                ? COLORS[Math.floor(Math.random() * COLORS.length)]
                : b.color),
          size: b.r * (0.18 + Math.random() * 0.12),
        });
      }
      playPop();
      if (scoreOn) { score += b.shiny ? 3 : 1; scoreVal.textContent = score; }
    }

    function drawPop(b) {
      b.popProgress += 0.12;
      const t = b.popProgress;
      if (t >= 1) return false;
      const alpha = 1 - t;

      if (b.popType === 'shiny') {
        // Golden firework — same geometry as fireworks but gold particles + a
        // central +3 "burst" ring expanding outward.
        ctx.globalAlpha = alpha;
        // Outer ring expansion
        ctx.strokeStyle = `rgba(255, 215, 0, ${alpha * 0.6})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * (1 + t * 1.2), 0, Math.PI * 2);
        ctx.stroke();
        // Streak particles
        for (const p of b.particles) {
          const px = b.x + p.dx * t * 14;
          const py = b.y + p.dy * t * 14;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(Math.atan2(p.dy, p.dx));
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-p.size, 0);
          ctx.lineTo(p.size, 0);
          ctx.stroke();
          ctx.restore();
        }
        // +3 label floats upward
        ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
        ctx.strokeStyle = `rgba(80, 40, 0, ${alpha * 0.8})`;
        ctx.lineWidth = 3;
        ctx.font = `900 ${Math.round(b.r * 0.9)}px "Inter", sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const ly = b.y - 30 - t * 50;
        ctx.strokeText('+3', b.x, ly);
        ctx.fillText('+3', b.x, ly);
        ctx.globalAlpha = 1;
        return true;
      }

      if (b.popType === 'classic') {
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * (1 + t * 0.5), 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
        ctx.globalAlpha = 1;
        return true;
      }

      ctx.globalAlpha = alpha;
      for (const p of b.particles) {
        const px = b.x + p.dx * t * 12;
        const py = b.y + p.dy * t * 12 + (b.popType === 'hearts' ? -t * 30 : t * t * 40);
        p.rot += p.rotV;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(p.rot);
        if (b.popType === 'fireworks') {
          ctx.strokeStyle = p.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(-p.size, 0); ctx.lineTo(p.size, 0); ctx.stroke();
        } else if (b.popType === 'glitter') {
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-p.size, 0); ctx.lineTo(p.size, 0);
          ctx.moveTo(0, -p.size); ctx.lineTo(0, p.size);
          ctx.stroke();
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(0, 0, p.size * 0.3, 0, Math.PI * 2); ctx.fill();
        } else if (b.popType === 'confetti') {
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size, -p.size * 0.4, p.size * 2, p.size * 0.8);
        } else if (b.popType === 'hearts' || b.popType === 'stars') {
          ctx.font = `${p.size * 3}px serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(b.popType === 'hearts' ? '❤️' : '⭐', 0, 0);
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      return true;
    }

    function drawBubble(b, alpha) {
      ctx.globalAlpha = alpha ?? 1;

      if (b.shiny) {
        // Golden radial gradient instead of flat color
        const grad = ctx.createRadialGradient(
          b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1,
          b.x, b.y, b.r
        );
        grad.addColorStop(0.00, '#FFFCE0');
        grad.addColorStop(0.40, '#FFD700');
        grad.addColorStop(1.00, '#C99300');
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = grad; ctx.fill();
        // Bright white rim
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.lineWidth = 4; ctx.stroke();
        // Orbiting sparkles — 4 tiny stars rotating around the bubble
        const tt = (Date.now() - b.born) / 1000;
        for (let i = 0; i < 4; i++) {
          const ang = (Math.PI * 2 * i) / 4 + tt * 1.6;
          const dist = b.r * 1.18;
          const sx = b.x + Math.cos(ang) * dist;
          const sy = b.y + Math.sin(ang) * dist;
          const ss = b.r * 0.18 * (0.7 + 0.35 * Math.sin(tt * 5 + i));
          ctx.fillStyle = 'rgba(255,255,255,0.95)';
          ctx.beginPath();
          ctx.moveTo(sx, sy - ss);
          ctx.lineTo(sx + ss * 0.3, sy - ss * 0.3);
          ctx.lineTo(sx + ss, sy);
          ctx.lineTo(sx + ss * 0.3, sy + ss * 0.3);
          ctx.lineTo(sx, sy + ss);
          ctx.lineTo(sx - ss * 0.3, sy + ss * 0.3);
          ctx.lineTo(sx - ss, sy);
          ctx.lineTo(sx - ss * 0.3, sy - ss * 0.3);
          ctx.closePath();
          ctx.fill();
        }
        // Inner highlight
        ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
        ctx.globalAlpha = 1;
        return;
      }

      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 4; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const now = Date.now();
      bubbles = bubbles.filter(b => {
        if (b.popping) return drawPop(b);

        const age = now - b.born;

        // Helper: compute alpha for bubbles with a lifespan (fade in/out)
        function lifespanAlpha(b, age, fadeIn) {
          if (age >= b.lifespan) return -1;  // expired — caller removes
          const fadeOut = 400;
          if (fadeIn && age < fadeIn) return age / fadeIn;
          if (age > b.lifespan - fadeOut) return Math.max(0, (b.lifespan - age) / fadeOut);
          return 1;
        }

        if (b.mode === 'float') {
          b.y += b.vy;
          if (b.y < -b.r) return false;
          drawBubble(b);
          return true;
        }

        if (b.mode === 'wiggle') {
          const ws = b.wigSpeed || 0.04;
          b.phase  += ws;
          b.phaseY += ws * 0.6;
          b.baseY  -= b.driftUp;
          b.x = b.baseX + Math.sin(b.phase)  * b.wiggleAmp;
          b.y = b.baseY + Math.sin(b.phaseY) * (b.bobAmp || 20);
          if (b.baseY < -b.r) return false;
          // Some tier-4+ wiggle bubbles fade out partway (random vanish)
          if (b.lifespan) {
            const a = lifespanAlpha(b, age, 0);
            if (a < 0) return false;
            drawBubble(b, a);
            return true;
          }
          drawBubble(b);
          return true;
        }

        if (b.mode === 'random') {
          b.x += b.vx; b.y += b.vy;
          if (b.x < -b.r || b.x > canvas.width  + b.r ||
              b.y < -b.r || b.y > canvas.height + b.r) return false;
          if (b.lifespan) {
            const a = lifespanAlpha(b, age, 0);
            if (a < 0) return false;
            drawBubble(b, a);
            return true;
          }
          drawBubble(b);
          return true;
        }

        if (b.mode === 'flash') {
          const a = lifespanAlpha(b, age, 250);
          if (a < 0) return false;
          drawBubble(b, a);
          return true;
        }

        return false;
      });
      animId = requestAnimationFrame(draw);
    }

    function currentLimits() {
      if (tier === 1) return { maxBubbles: 3 };   // 2-3 at a time per Scott
      if (tier === 2) return { maxBubbles: 4 };   // start with multiple, not 1
      if (tier === 3) return { maxBubbles: 4 };
      if (tier === 4) return { maxBubbles: 5 };
      return { maxBubbles: 6 }; // tier 5+ — a touch more for the mixed-mode variety
    }

    const spawnTimer = setInterval(() => {
      const { maxBubbles } = currentLimits();
      if (bubbles.filter(b => !b.popping).length < maxBubbles) spawnBubble();
    }, 500);

    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      let hit = false;
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (!b.popping && Math.hypot(x - b.x, y - b.y) < b.r) {
          popBubble(b); hit = true; break;
        }
      }
      if (!hit && tier <= 2) {
        colorBurst(ctx, x, y, randColor(), 80);
        playPop();
      }
    });

    draw();
    spawnBubble();

    window.addEventListener('beforeunload', () => {
      clearInterval(spawnTimer);
      cancelAnimationFrame(animId);
    });
    })();
  </script>
</body>
</html>
