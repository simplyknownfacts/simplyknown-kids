<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Tap &amp; Pop</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #canvas { position: fixed; inset: 0; }
    #score {
      position: fixed; top: 16px; right: 16px;
      font-size: 28px; font-weight: 900; color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="score">⭐ <span id="scoreVal">0</span></div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const profile = getActiveProfile();
    if (!profile) goProfiles();
    const tier = getActivityTier(profile, 'tap-pop');

    renderBackBtn('index.html');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const COLORS = ['#FF6B6B','#FFE66D','#4ECDC4','#a86cdb','#FF9F43','#45B7D1'];
    let bubbles = [], score = 0, animId;

    const scoreEl = document.getElementById('score');
    const scoreVal = document.getElementById('scoreVal');
    if (tier >= 5) scoreEl.style.display = 'block';

    function randColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

    function spawnBubble() {
      const r = tier <= 2 ? 80 : tier <= 4 ? 70 : 55;
      bubbles.push({
        x: r + Math.random() * (canvas.width - r * 2),
        y: canvas.height + r,
        r,
        color: randColor(),
        vy: tier >= 5 ? -(1 + Math.random() * 1.5) : 0,
        born: Date.now(),
        popping: false,
        popProgress: 0
      });
    }

    function popBubble(b) {
      if (b.popping) return;
      b.popping = true;
      playPop();
      if (tier >= 5) { score++; scoreVal.textContent = score; }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const now = Date.now();
      bubbles = bubbles.filter(b => {
        if (b.popping) {
          b.popProgress += 0.12;
          const s = 1 + b.popProgress * 0.5;
          const a = 1 - b.popProgress;
          if (a <= 0) return false;
          ctx.globalAlpha = a;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r * s, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.fill();
          ctx.globalAlpha = 1;
          return true;
        }
        // Auto-pop for T1-T2
        if (tier <= 2 && now - b.born > 2000) { popBubble(b); return true; }
        // Float upward for T5+
        if (tier >= 5) {
          b.y += b.vy;
          if (b.y < -b.r) return false; // missed
        }
        // Draw
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 4;
        ctx.stroke();
        // Shine
        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fill();
        return true;
      });
      animId = requestAnimationFrame(draw);
    }

    const spawnMs = tier <= 2 ? 1500 : tier <= 4 ? 2500 : 1000;
    const maxBubbles = tier <= 2 ? 5 : tier <= 4 ? 1 : 8;
    const spawnTimer = setInterval(() => {
      if (bubbles.filter(b => !b.popping).length < maxBubbles) spawnBubble();
    }, spawnMs);

    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      let hit = false;
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (!b.popping && Math.hypot(x - b.x, y - b.y) < b.r) {
          popBubble(b); hit = true; break;
        }
      }
      if (!hit && tier <= 2) {
        colorBurst(ctx, x, y, randColor(), 80);
        playPop();
      }
    });

    draw();
    spawnBubble();

    window.addEventListener('beforeunload', () => {
      clearInterval(spawnTimer);
      cancelAnimationFrame(animId);
    });
  </script>
</body>
</html>
