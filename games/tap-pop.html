<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Tap &amp; Pop</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #canvas { position: fixed; inset: 0; }
    #score {
      position: fixed; top: 16px; right: 16px;
      font-size: 28px; font-weight: 900; color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="score">⭐ <span id="scoreVal">0</span></div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/game-settings.js"></script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'tap-pop');

    renderBackBtn('index.html');
    gameSettings.attach('tap-pop');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const COLORS = ['#FF6B6B','#FFE66D','#4ECDC4','#a86cdb','#FF9F43','#45B7D1'];
    let bubbles = [], score = 0, animId;

    // Bubbles always float upward (toddlers love the motion). Race mode at tier 5+ is just faster spawn.
    const floatOn = true;
    const fastMode = tier >= 5 || getProfileFeature(profile, 'tap-pop', 'floatMode');
    const scoreOn = tier >= 5 || getProfileFeature(profile, 'tap-pop', 'scoreCounter');
    const startedAt = Date.now();

    const scoreEl = document.getElementById('score');
    const scoreVal = document.getElementById('scoreVal');
    if (scoreOn) scoreEl.style.display = 'block';

    function randColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

    function spawnBubble() {
      const r = tier <= 2 ? 80 : tier <= 4 ? 70 : 55;
      bubbles.push({
        x: r + Math.random() * (canvas.width - r * 2),
        y: floatOn
          ? canvas.height + r
          : r + Math.random() * (canvas.height - r * 2),
        r,
        color: randColor(),
        vy: floatOn ? -(1 + Math.random() * 1.5) : 0,
        born: Date.now(),
        popping: false,
        popProgress: 0
      });
    }

    const POP_TYPES = ['classic', 'fireworks', 'glitter', 'confetti', 'hearts', 'stars'];
    function popBubble(b) {
      if (b.popping) return;
      b.popping = true;
      b.popType = POP_TYPES[Math.floor(Math.random() * POP_TYPES.length)];
      // Pre-generate particles for the chosen type (so each frame doesn't re-randomize)
      b.particles = [];
      const cnt = b.popType === 'glitter' ? 16 : b.popType === 'confetti' ? 10 : 8;
      for (let i = 0; i < cnt; i++) {
        const a = (Math.PI * 2 * i) / cnt + (Math.random() - 0.5) * 0.4;
        const speed = 6 + Math.random() * 5;
        b.particles.push({
          dx: Math.cos(a) * speed,
          dy: Math.sin(a) * speed,
          rot: Math.random() * Math.PI * 2,
          rotV: (Math.random() - 0.5) * 0.3,
          color: b.popType === 'fireworks' || b.popType === 'confetti'
            ? COLORS[Math.floor(Math.random() * COLORS.length)]
            : b.color,
          size: b.r * (0.18 + Math.random() * 0.12),
        });
      }
      playPop();
      if (scoreOn) { score++; scoreVal.textContent = score; }
    }

    function drawPop(b) {
      b.popProgress += 0.12;
      const t = b.popProgress;
      if (t >= 1) return false;
      const alpha = 1 - t;

      if (b.popType === 'classic') {
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * (1 + t * 0.5), 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
        ctx.globalAlpha = 1;
        return true;
      }

      // Particle-based pops
      ctx.globalAlpha = alpha;
      for (const p of b.particles) {
        const px = b.x + p.dx * t * 12;
        const py = b.y + p.dy * t * 12 + (b.popType === 'hearts' ? -t * 30 : t * t * 40); // hearts rise, others slight gravity
        p.rot += p.rotV;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(p.rot);
        if (b.popType === 'fireworks') {
          // Streak: long thin line
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-p.size, 0);
          ctx.lineTo(p.size, 0);
          ctx.stroke();
        } else if (b.popType === 'glitter') {
          // Tiny sparkle: 4-point star via two crossed lines
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-p.size, 0); ctx.lineTo(p.size, 0);
          ctx.moveTo(0, -p.size); ctx.lineTo(0, p.size);
          ctx.stroke();
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(0, 0, p.size * 0.3, 0, Math.PI * 2); ctx.fill();
        } else if (b.popType === 'confetti') {
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size, -p.size * 0.4, p.size * 2, p.size * 0.8);
        } else if (b.popType === 'hearts' || b.popType === 'stars') {
          ctx.font = `${p.size * 3}px serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.popType === 'hearts' ? '❤️' : '⭐', 0, 0);
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      return true;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const now = Date.now();
      bubbles = bubbles.filter(b => {
        if (b.popping) {
          return drawPop(b);
        }
        // Auto-pop for true infants only (tier ≤ 1). Toddler taps bubbles.
        if (tier <= 1 && now - b.born > 2500) { popBubble(b); return true; }
        b.y += b.vy;
        if (b.y < -b.r) return false; // missed (floated off top)
        // Draw
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 4;
        ctx.stroke();
        // Shine
        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fill();
        return true;
      });
      animId = requestAnimationFrame(draw);
    }

    // For tier <= 2 (toddler): ramp from 1 bubble → 5 over 30s, slow spawn pace.
    // For older / fastMode: race mode with many bubbles fast.
    function currentLimits() {
      if (tier <= 2) {
        const elapsed = (Date.now() - startedAt) / 1000;
        const cap = Math.min(5, 1 + Math.floor(elapsed / 8)); // +1 every 8s, max 5
        return { spawnMs: 1500, maxBubbles: cap };
      }
      if (fastMode) return { spawnMs: 600, maxBubbles: 12 };
      return { spawnMs: 1200, maxBubbles: 4 };
    }
    const spawnTimer = setInterval(() => {
      const { maxBubbles } = currentLimits();
      if (bubbles.filter(b => !b.popping).length < maxBubbles) spawnBubble();
    }, 500); // tick frequently; spawn only when under cap

    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      let hit = false;
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (!b.popping && Math.hypot(x - b.x, y - b.y) < b.r) {
          popBubble(b); hit = true; break;
        }
      }
      if (!hit && tier <= 2) {
        colorBurst(ctx, x, y, randColor(), 80);
        playPop();
      }
    });

    draw();
    spawnBubble();

    window.addEventListener('beforeunload', () => {
      clearInterval(spawnTimer);
      cancelAnimationFrame(animId);
    });
    })();
  </script>
</body>
</html>
