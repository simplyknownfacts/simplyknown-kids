<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Memory Match</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes.css">
  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #3a2a6a, #1a1240); }
    .screen { justify-content: flex-start !important;
              padding-top: calc(70px + env(safe-area-inset-top));
              padding-bottom: 140px;
              overflow-y: auto; }
    #board {
      display: grid; gap: 10px; justify-content: center;
      width: min(94vw, 700px); margin: 0 auto;
    }
    .mm-card {
      aspect-ratio: 3 / 4; border-radius: 16px; cursor: pointer;
      perspective: 600px; -webkit-tap-highlight-color: transparent;
    }
    .mm-inner {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d; transition: transform 0.35s ease;
    }
    .mm-card.up .mm-inner { transform: rotateY(180deg); }
    .mm-face {
      position: absolute; inset: 0; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .mm-back {
      background: linear-gradient(145deg, #7c5cff, #5232d0);
      border: 3px solid rgba(255,255,255,0.25);
      font-size: clamp(22px, 5vw, 34px); color: rgba(255,255,255,0.85);
    }
    .mm-front {
      background: rgba(255,255,255,0.92);
      border: 3px solid rgba(255,255,255,0.6);
      transform: rotateY(180deg);
      font-size: clamp(34px, 9vw, 64px);
    }
    .mm-card.matched { pointer-events: none; }
    .mm-card.matched .mm-front {
      background: rgba(168,230,207,0.95);
      box-shadow: 0 0 14px rgba(168,230,207,0.8);
    }
    .mm-card.wrong .mm-inner { animation: mmShake 0.3s; }
    @keyframes mmShake {0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}
    @media (prefers-reduced-motion: reduce) { .mm-inner { transition: none; } }
  </style>
</head>
<body>
  <div class="screen" id="stage" style="gap:20px;">
    <div class="title">🃏 Memory Match</div>
    <div class="subtitle" id="hint">Find the matching pairs!</div>
    <div id="board"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function () {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'memory-match');

    renderBackBtn('index.html');
    gameSettings.attach('memory-match');
    if (window.vbProgress) { vbProgress.firstPlay('memory-match'); vbProgress.touchStreak(); }

    // Pairs per tier: tiny boards stay easy wins for toddlers; Grade-schoolers
    // get a real memory workout. COLS is the most columns we would LIKE; fitCols
    // below caps it to what the screen can afford at a finger-sized card.
    const PAIRS = tier <= 2 ? 2 : tier <= 3 ? 3 : tier <= 4 ? 4 : tier <= 6 ? 6 : tier <= 8 ? 8 : tier <= 9 ? 10 : 12;
    const COLS  = PAIRS <= 2 ? 2 : PAIRS <= 4 ? 4 : PAIRS <= 6 ? 4 : PAIRS <= 8 ? 4 : tier >= 10 ? 6 : 5;
    const FLIP_BACK_MS = tier <= 4 ? 1100 : 800;   // little kids get longer to look

    const EMOJI = ['🐶','🐱','🦊','🐼','🐸','🦁','🐷','🐰','🦋','🐢','🐙','🦄',
                   '🍎','🍌','🍓','🍉','🚗','🚀','⭐','🌈','🎈','⚽','🌻','🍦'];

    const board = document.getElementById('board');
    const hint = document.getElementById('hint');
    let first = null, lock = false, matched = 0, timer = null;
    window.addEventListener('beforeunload', () => clearTimeout(timer));

    // A card has to stay big enough for a child's finger. COLS above is what the
    // board WANTS; on a narrow phone it cannot always have it — 6 columns inside
    // min(94vw, 700px) with 10px gaps is about 42px a card on a 320px screen,
    // under the ~48px that reliably works for a small hand. So the column count
    // is capped by what the screen can actually afford. The difficulty is
    // untouched: exactly the same pairs are dealt, they just wrap onto more rows.
    const MIN_CARD_PX = 48;
    function fitCols() {
      const gap = parseFloat(getComputedStyle(board).columnGap) || 10;
      const width = board.clientWidth || Math.min(window.innerWidth * 0.94, 700);
      const afford = Math.floor((width + gap) / (MIN_CARD_PX + gap));
      return Math.max(2, Math.min(COLS, afford));
    }
    // Turning the tablet sideways changes what fits. Re-shape the grid without
    // rebuilding it, so a game in progress is not thrown away.
    window.addEventListener('resize', () => {
      board.style.gridTemplateColumns = `repeat(${fitCols()}, 1fr)`;
    });

    function buildBoard() {
      board.innerHTML = ''; first = null; lock = false; matched = 0;
      board.style.gridTemplateColumns = `repeat(${fitCols()}, 1fr)`;
      const faces = [...EMOJI].sort(() => Math.random() - 0.5).slice(0, PAIRS);
      const deck = [...faces, ...faces].sort(() => Math.random() - 0.5);
      deck.forEach(emoji => {
        const card = document.createElement('div');
        card.className = 'mm-card';
        card.dataset.face = emoji;
        card.innerHTML = `<div class="mm-inner">
          <div class="mm-face mm-back">❓</div>
          <div class="mm-face mm-front">${emoji}</div>
        </div>`;
        card.addEventListener('pointerdown', () => flip(card));
        board.appendChild(card);
      });
      hint.textContent = 'Find the matching pairs!';
      setTimeout(() => speak('Find the matching pairs!'), 400);
    }

    function flip(card) {
      if (lock || card.classList.contains('up') || card.classList.contains('matched')) return;
      card.classList.add('up');
      if (typeof haptic === 'function') haptic(10);
      if (!first) { first = card; return; }

      // second card
      if (card.dataset.face === first.dataset.face) {
        card.classList.add('matched'); first.classList.add('matched');
        first = null;
        matched++;
        playSuccess();
        speak('A match!');
        if (window.vbProgress) vbProgress.record('memory-match');
        if (matched === PAIRS) {
          hint.textContent = 'You found them all! 🎉';
          if (window.vbProgress) vbProgress.mastery('memory-match.mastery');
          timer = setTimeout(buildBoard, 2200);
        }
      } else {
        lock = true;
        const a = card, b = first; first = null;
        a.classList.add('wrong'); b.classList.add('wrong');
        playBoop();
        timer = setTimeout(() => {
          a.classList.remove('up', 'wrong'); b.classList.remove('up', 'wrong');
          lock = false;
        }, FLIP_BACK_MS);
      }
    }

    buildBoard();
    })();
  </script>
</body>
</html>
