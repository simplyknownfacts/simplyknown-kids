<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Magic Touch</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes.css">
  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; }
    #canvas { position: fixed; inset: 0; touch-action: none; }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 28px; text-align: center;
      font-family: var(--font-ui, sans-serif); font-size: 15px; font-weight: 700;
      color: rgba(255,255,255,0.82); text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      pointer-events: none; letter-spacing: 0.4px; transition: opacity 600ms ease;
    }
    #dotsBtn {
      position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
      display: none; padding: 11px 20px; border-radius: 999px; border: none; cursor: pointer;
      font-family: var(--font-ui, sans-serif); font-weight: 800; font-size: 15px; color: #fff;
      background: linear-gradient(180deg, #6fd3ff, #3aa0e0); box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }
    #dotsBtn:active { transform: translateX(-50%) translateY(1px); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button id="dotsBtn" style="display:none">🔗 Connect the dots</button>
  <div id="hint">✨ Touch the sky! ✨</div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
  (function () {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'magic-touch');

    renderBackBtn('index.html');
    gameSettings.attach('magic-touch');
    if (window.vbProgress) { vbProgress.firstPlay('magic-touch'); vbProgress.touchStreak(); }

    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    // Connect-the-dots state — declared BEFORE resize() (which calls layoutDots) to
    // avoid a temporal-dead-zone error on the first resize.
    let dotsMode = false, dots = [], dotShape = null, dotProgress = 0, dotDone = false;
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; layoutDots(); }
    resize();

    const COLORS = ['#FF6B6B', '#FFE66D', '#4ECDC4', '#a86cdb', '#FF9F43', '#45B7D1', '#FF69B4', '#7BD389'];
    const GOLD = ['#FFD700', '#FFF3B0', '#FFA500'];
    const rc = (a) => a[Math.floor(Math.random() * a.length)];

    // Tier scaling: babies get big slow gentle bursts; bigger kids get more
    // particle variety, a finger light-trail, and rising "rocket" fireworks.
    const TUNE = {
      count:    tier <= 2 ? 14 : tier <= 4 ? 22 : 30,   // particles per burst
      speed:    tier <= 2 ? 3.2 : tier <= 4 ? 5 : 6.5,
      gravity:  tier <= 2 ? 0.02 : 0.05,
      trail:    tier >= 3,                               // sparkles follow a drag
      rockets:  tier >= 5,                               // taps launch a rising firework
      shapes:   tier <= 2 ? ['star', 'heart', 'dot'] : tier <= 4 ? ['star', 'heart', 'dot', 'spark'] : ['star', 'heart', 'dot', 'spark', 'ring'],
    };

    let parts = [], rockets = [], stars = [], animId, down = false, lastTrail = 0, bursts = 0;

    // ── Connect-the-dots (tier 6+): tap numbered dots in order → reveal a shape.
    // Turns the sensory toy into a goal/sequence puzzle for school age. No voice.
    const canConnect = tier >= 6;
    const DOT_SHAPES = [
      { name: 'Triangle', pts: [[0.5,0.22],[0.8,0.76],[0.2,0.76]] },
      { name: 'Square',   pts: [[0.27,0.32],[0.73,0.32],[0.73,0.76],[0.27,0.76]] },
      { name: 'House',    pts: [[0.3,0.46],[0.5,0.26],[0.7,0.46],[0.7,0.78],[0.3,0.78]] },
      { name: 'Heart',    pts: [[0.5,0.36],[0.36,0.26],[0.23,0.4],[0.5,0.72],[0.77,0.4],[0.64,0.26]] },
      { name: 'Star',     pts: [[0.5,0.16],[0.61,0.42],[0.9,0.43],[0.67,0.6],[0.75,0.87],[0.5,0.7],[0.25,0.87],[0.33,0.6],[0.1,0.43],[0.39,0.42]] },
    ];

    function pickDotShape() {
      const pool = DOT_SHAPES.filter(s => tier >= 8 || s.pts.length <= 6);
      dotShape = pool[Math.floor(Math.random() * pool.length)];
      dotProgress = 0; dotDone = false;
      layoutDots();
    }
    function layoutDots() {
      if (!dotShape) return;
      const m = Math.min(canvas.width, canvas.height);
      const ox = (canvas.width - m) / 2, oy = (canvas.height - m) / 2;
      dots = dotShape.pts.map((p, i) => ({ x: ox + p[0] * m, y: oy + p[1] * m, n: i + 1 }));
    }
    function enterDots() {
      dotsMode = true; parts = []; rockets = [];
      document.getElementById('dotsBtn').textContent = '✨ Free play';
      pickDotShape();
      const h = document.getElementById('hint'); if (h) { h.textContent = '🔗 Tap the dots: 1 → 2 → 3 …'; h.style.opacity = '1'; }
    }
    function exitDots() {
      dotsMode = false; dots = []; dotShape = null;
      document.getElementById('dotsBtn').textContent = '🔗 Connect the dots';
      const h = document.getElementById('hint'); if (h) { h.textContent = '✨ Touch the sky! ✨'; h.style.opacity = '1'; }
    }
    function handleDotTap(x, y) {
      if (dotDone || !dots.length) return;
      const next = dots[dotProgress];
      if (Math.hypot(x - next.x, y - next.y) < 52) {
        dotProgress++;
        if (typeof playChime === 'function') { try { playChime(); } catch (e) {} }
        if (typeof haptic === 'function') haptic(12);
        if (dotProgress >= dots.length) {
          dotDone = true;
          if (window.vbProgress) vbProgress.record('magic-touch');
          burst(canvas.width / 2, canvas.height * 0.5, true);
          const h = document.getElementById('hint'); if (h) h.textContent = '✨ A ' + dotShape.name + '! ✨';
          setTimeout(() => { if (dotsMode) { pickDotShape(); const h2 = document.getElementById('hint'); if (h2) h2.textContent = '🔗 Tap the dots: 1 → 2 → 3 …'; } }, 2200);
        }
      } else if (typeof playBoop === 'function') { try { playBoop(); } catch (e) {} }
    }

    // ambient twinkling background stars (all ages — calm, never overwhelming)
    const STAR_N = reduce ? 0 : (tier <= 2 ? 26 : 40);
    for (let i = 0; i < STAR_N; i++) {
      stars.push({ x: Math.random(), y: Math.random() * 0.85, r: 0.6 + Math.random() * 1.6, ph: Math.random() * 6.28, rate: 1 + Math.random() * 2 });
    }

    function spawnParticle(x, y, color, spd) {
      const a = Math.random() * Math.PI * 2;
      const v = (0.4 + Math.random()) * (spd || TUNE.speed);
      parts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1,
        life: 0, max: 48 + Math.random() * 40, color,
        size: (tier <= 2 ? 6 : 4) + Math.random() * (tier <= 2 ? 8 : 6),
        shape: rc(TUNE.shapes), rot: Math.random() * 6.28, rotV: (Math.random() - 0.5) * 0.3,
      });
    }

    function burst(x, y, gold) {
      const palette = gold ? GOLD : COLORS;
      const base = rc(palette);
      const n = reduce ? 8 : TUNE.count + (gold ? 10 : 0);
      for (let i = 0; i < n; i++) spawnParticle(x, y, Math.random() < 0.6 ? base : rc(palette));
      if (typeof playPop === 'function') { try { playPop(); } catch (e) {} }
      if (typeof haptic === 'function') haptic(tier <= 2 ? 22 : 14);
      if (window.vbProgress) vbProgress.record('magic-touch');
      bursts++;
      if (bursts === 1) { const h = document.getElementById('hint'); if (h) h.style.opacity = '0'; }
    }

    function launchRocket(x) {
      rockets.push({ x, y: canvas.height + 10, vy: -(9 + Math.random() * 3), targetY: canvas.height * (0.18 + Math.random() * 0.3), color: rc(COLORS) });
      if (typeof playChime === 'function') { try { playChime(); } catch (e) {} }
    }

    function onDown(e) {
      const x = e.clientX, y = e.clientY;
      if (dotsMode) { handleDotTap(x, y); return; }   // connect-the-dots: no free-play burst
      down = true;
      if (TUNE.rockets && y > canvas.height * 0.6 && Math.random() < 0.6) launchRocket(x);
      else burst(x, y, Math.random() < 0.12);
    }
    function onMove(e) {
      if (!down || !TUNE.trail) return;
      const now = Date.now();
      if (now - lastTrail < 24) return;
      lastTrail = now;
      const c = rc(COLORS);
      for (let i = 0; i < 3; i++) spawnParticle(e.clientX, e.clientY, c, 1.6);
    }
    function onUp() { down = false; }

    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('resize', resize);

    function drawShape(p, alpha) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
      if (p.shape === 'dot') {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, 6.28); ctx.fill();
      } else if (p.shape === 'spark') {
        ctx.lineWidth = 2.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p.x - p.size, p.y); ctx.lineTo(p.x + p.size, p.y);
        ctx.moveTo(p.x, p.y - p.size); ctx.lineTo(p.x, p.y + p.size); ctx.stroke();
      } else if (p.shape === 'ring') {
        ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.7, 0, 6.28); ctx.stroke();
      } else {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.font = (p.size * 2.4) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.shape === 'heart' ? '❤️' : '⭐', 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function draw() {
      // deep twilight gradient sky
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#10173a'); g.addColorStop(1, '#0b1026');
      ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);

      const t = Date.now() / 1000;
      for (const s of stars) {
        const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * s.rate + s.ph));
        ctx.globalAlpha = tw; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, 6.28); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // additive glow for vivid bursts
      ctx.globalCompositeOperation = 'lighter';
      rockets = rockets.filter(r => {
        r.y += r.vy;
        ctx.globalAlpha = 0.9; ctx.fillStyle = r.color;
        ctx.beginPath(); ctx.arc(r.x, r.y, 3.5, 0, 6.28); ctx.fill();
        if (r.y <= r.targetY) { burst(r.x, r.y, Math.random() < 0.3); return false; }
        return true;
      });
      parts = parts.filter(p => {
        p.life++; if (p.life >= p.max) return false;
        p.vy += TUNE.gravity; p.x += p.vx; p.y += p.vy; p.rot += p.rotV;
        drawShape(p, 1 - p.life / p.max);
        return true;
      });
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      drawDots();
      animId = requestAnimationFrame(draw);
    }

    function drawDots() {
      if (!dotsMode || !dots.length) return;
      // completed connecting lines
      ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (dotProgress > 1) {
        ctx.beginPath(); ctx.moveTo(dots[0].x, dots[0].y);
        for (let i = 1; i < dotProgress; i++) ctx.lineTo(dots[i].x, dots[i].y);
        if (dotDone) ctx.lineTo(dots[0].x, dots[0].y);   // close the shape
        ctx.stroke();
      }
      const t = Date.now() / 1000;
      dots.forEach((d, i) => {
        const doneDot = i < dotProgress, isNext = i === dotProgress && !dotDone;
        const r = isNext ? 18 + 3 * Math.sin(t * 6) : 15;
        ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, 6.28);
        ctx.fillStyle = doneDot ? '#7BD389' : (isNext ? '#FFD93D' : 'rgba(255,255,255,0.22)');
        ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
        ctx.fillStyle = doneDot ? '#08310f' : '#0b1026';
        ctx.font = '900 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(d.n), d.x, d.y);
      });
    }

    if (canConnect) {
      const db = document.getElementById('dotsBtn');
      db.style.display = 'block';
      db.addEventListener('click', () => { if (dotsMode) exitDots(); else enterDots(); });
    }

    draw();

    window.addEventListener('beforeunload', () => cancelAnimationFrame(animId));
  })();
  </script>
</body>
</html>
