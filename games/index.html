<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Games</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: linear-gradient(160deg, #ff6b6b 0%, #ff9f43 100%); }
    .cards-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .activity-card { width: 140px; height: 140px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="title">🎮 Games</div>
    <div class="cards-row">
      <div class="activity-card" onclick="go('tap-pop.html')">
        <div class="icon">🫧</div>
        <div class="label">Tap &amp; Pop</div>
      </div>
      <div class="activity-card" onclick="go('shape-match.html')">
        <div class="icon">🔷</div>
        <div class="label">Shape Match</div>
      </div>
    </div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function go(page) { playChime(); goTo(page); }
    renderBackBtn('../home.html');
    if (!getActiveProfile()) goProfiles();
  </script>
</body>
</html>
