<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Games</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes.css">
  <script>/* apply the active kid's theme before first paint (default storybook = no attribute) */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook")document.documentElement.setAttribute("data-vbtheme",_t)}catch(e){}</script>
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    .hub-screen {
      min-height: 100vh;
      padding: calc(100px + env(safe-area-inset-top)) 24px 220px;
      display: flex; flex-direction: column; align-items: center; gap: 22px;
      overflow-y: auto;
    }
    .hub-title {
      font-family: var(--font-display); font-style: italic; font-weight: 600;
      font-size: clamp(40px, 7vw, 56px);
      color: var(--text); text-align: center; letter-spacing: -0.5px;
    }
    .cards-row { padding-bottom: 60px; }
    .activity-card { aspect-ratio: 1; min-height: 140px; }
    .empty-msg {
      color: var(--text-soft); font-size: 15px; text-align: center;
      padding: 24px; max-width: 320px; line-height: 1.5;
    }
  </style>
</head>
<body class="section-games world-page world-games" data-allow-zoom="0">
  <div class="world-decor" aria-hidden="true">
    <span class="world-spark s1"></span><span class="world-spark s2"></span><span class="world-spark s3"></span>
  </div>
  <div class="hub-screen">
    <header class="world-intro">
      <div class="world-intro-copy">
        <span class="world-kicker">Coral Clubhouse</span>
        <h1 class="hub-title">Games Clubhouse</h1>
        <p class="world-intro-text">Pick a playful challenge and jump right in.</p>
      </div>
      <div class="world-emblem" data-world-house="games" aria-hidden="true">🎮</div>
    </header>
    <div class="cards-row" id="cardsRow"></div>
    <div class="empty-msg" id="emptyMsg" style="display:none;">
      No games are turned on for this child yet.<br>
      A grown-up can enable them in ⚙️ Parent Settings → Activities.
    </div>

    <div class="world-shelf" id="vbShelfMount"></div>
  </div>

  <script src="../js/atmosphere.js"></script>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sleep-timer.js"></script>
  <script src="../js/yoto-player.js"></script>
  <script src="../js/mascot.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/shelf.js"></script>
  <script>
    window.VB_ASSET_BASE = '../';
    function go(page) { playChime(); goTo(page); }
    renderBackBtn('../home.html');
    const profile = getActiveProfile();
    if (!profile) goProfiles();
    const row = document.getElementById('cardsRow');
    const descriptions = {
      'tap-pop': 'Pop bubbles and build speedy hands.',
      'peek-a-boo': 'Find the friendly face hiding nearby.',
      'magic-touch': 'Make colors and shapes burst with every tap.',
      'tap-a-tune': 'Play bright notes and make a little song.',
      'surprise-pop': 'Crack each egg to find a surprise.',
      'shape-match': 'Find where every colorful shape belongs.',
      'tilt-drive': 'Steer a tiny car by tipping the screen.',
      'memory-match': 'Turn cards over and find matching pairs.'
    };
    const visible = ACTIVITY_FEATURES
      .filter(a => a.section === 'games')
      .filter(a => isActivityVisible(profile, a.id));
    if (!visible.length) {
      row.style.display = 'none';
      document.getElementById('emptyMsg').style.display = 'block';
    } else {
      visible.forEach(a => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'activity-card';
        card.dataset.activity = a.id;
        card.setAttribute('aria-label', a.name + '. ' + (descriptions[a.id] || 'Open activity.'));
        card.onclick = () => go(a.file);
        const icon = document.createElement('span');
        icon.className = 'icon'; icon.setAttribute('aria-hidden', 'true'); icon.textContent = a.icon;
        const label = document.createElement('span');
        label.className = 'label'; label.textContent = a.name;
        const note = document.createElement('span');
        note.className = 'activity-note'; note.textContent = descriptions[a.id] || 'Open activity.';
        const arrow = document.createElement('span');
        arrow.className = 'activity-go'; arrow.setAttribute('aria-hidden', 'true'); arrow.textContent = '›';
        card.append(icon, label, note, arrow);
        row.appendChild(card);
      });
    }
    // Mascot intentionally NOT shown on the section menu (its fixed bottom-left
    // float covered a tile / the ribbons footer on the dense phone grid).
    if (window.vbShelf) vbShelf.mount(document.getElementById('vbShelfMount'), { section: 'games', title: '🎮 Games Ribbons' });
  </script>
</body>
</html>
