<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hide &amp; Seek</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes.css">
  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body.seek-game { color:#184d4a; background:#dff3ee !important; touch-action:manipulation; }
    .seek-screen { height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; padding:calc(88px + env(safe-area-inset-top)) 12px calc(76px + env(safe-area-inset-bottom)); gap:6px; box-sizing:border-box; }
    .seek-heading { text-align:center; z-index:2; color:#184d4a; background:#dff3ee; border-radius:18px; }
    .seek-heading h1 { margin:0 0 6px; font:900 clamp(26px,5vw,44px)/1.1 var(--font-display); color:#184d4a; }
    #hint { margin:0 auto; min-height:2.5em; max-width:500px; font:800 clamp(15px,2.8vw,20px)/1.3 var(--font-ui); }
    #stage { position:relative; min-height:0; width:min(100%,850px); justify-self:center; border-radius:42px; isolation:isolate; overflow:hidden; background:linear-gradient(#b8e7f0 0 34%,#aad78b 34%); box-shadow:inset 0 0 0 2px #ffffff60,0 12px 30px #286d5d20; }
    #stage > canvas { position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:inherit; }
    .hiding-spot { position:absolute; z-index:2; padding:0; background:transparent; border:3px solid transparent; border-radius:38%; color:#184d4a; cursor:pointer; opacity:1; -webkit-tap-highlight-color:transparent; }
    .hiding-spot:disabled { cursor:default; opacity:1; }
    .hiding-spot:focus-visible { outline:5px solid #fff5a4; outline-offset:-3px; box-shadow:0 0 0 3px #255552; }
    .hiding-spot.empty::after { content:'Nobody here'; position:absolute; bottom:12%; left:0; right:0; padding:6px 2px; border-radius:20px; background:#fff9e9ed; font:800 13px var(--font-ui); }
    #friendIntro,#hideCover { position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; pointer-events:none; }
    #friendIntro { background:#edf9f1e8; }
    #seekCompanion { pointer-events:none; flex:none; width:min(230px,50vw,40dvh); aspect-ratio:1; }
    #seekCompanion .companion-actor-canvas { display:block; width:100%; height:100%; }
    #stage > #seekCompanion { position:absolute; z-index:3; }
    #seekCompanion[data-pose="found"] { filter:drop-shadow(0 5px 3px #304e4430); }
    @media(orientation:landscape) and (max-height:550px) { #friendIntro{gap:2px} #friendIntro #seekCompanion{width:min(130px,28dvh)} #friendIntro .intro-name{font-size:18px} #friendIntro .intro-message{font-size:12px} }
    .intro-name { font:900 clamp(22px,4vw,36px) var(--font-display); color:#184d4a; }
    .intro-message { font:700 clamp(15px,2.5vw,20px) var(--font-ui); color:#184d4a; }
    #hideCover { background:#dff3ee; color:#184d4a; font:900 clamp(22px,4vw,36px) var(--font-display); }
    #hideCover span { font-size:clamp(60px,12vw,110px); }
    .rustle-clue { display:none; position:absolute; top:30%; right:12%; font-size:clamp(28px,5vw,48px); pointer-events:none; }
    #stage:not([data-renderer="webgl"]) .rustle-clue { display:block; }
    .clue-rustle .fallback-bush { animation:seek-rustle .24s ease-in-out infinite alternate; }
    @keyframes seek-rustle { from{transform:rotate(-3deg)} to{transform:rotate(3deg)} }
    .clue-glow { border-color:#ffd84f; box-shadow:0 0 0 7px #fff3a3aa,0 0 30px 15px #ffd84faa; animation:seek-glow .8s ease-in-out infinite alternate; }
    @keyframes seek-glow { from{filter:brightness(1)} to{filter:brightness(1.18)} }
    .peek-piece { display:none; position:absolute; z-index:-1; left:var(--peek-x,50%); transform:translateX(-50%); pointer-events:none; filter:drop-shadow(0 3px 2px #173f3638); }
    .has-peek .peek-piece { display:block; }
    .peek-piece[data-part="ears"] { top:10%; width:56px; height:70px; }
    .peek-piece[data-part="ears"]::before,.peek-piece[data-part="ears"]::after { content:''; position:absolute; top:0; width:21px; height:66px; border:4px solid #ffffffcc; border-radius:70% 70% 42% 42%; background:linear-gradient(90deg,var(--peek-fur),var(--peek-inner)); }
    .peek-piece[data-part="ears"]::before { left:4px; transform:rotate(-11deg); }
    .peek-piece[data-part="ears"]::after { right:4px; transform:rotate(11deg); }
    .peek-piece[data-part="ears"][data-animal="panda"]::before,.peek-piece[data-part="ears"][data-animal="panda"]::after { top:28px; width:24px; height:24px; border-radius:50%; background:#30363f; border-color:#f5f1e8; }
    .peek-piece[data-part="ears"][data-animal="tabby"]::before,.peek-piece[data-part="ears"][data-animal="tabby"]::after { top:24px; width:25px; height:30px; border-radius:70% 15% 55% 35%; }
    .peek-piece[data-part="face"] { top:13%; font-size:clamp(40px,8vw,66px); line-height:1; }
    .peek-piece[data-part="paw"] { top:25%; font-size:clamp(34px,7vw,56px); line-height:1; transform:translateX(-50%) rotate(-16deg); }
    .peek-piece[data-part="tail"] { top:30%; width:30px; height:30px; border:3px solid #ffffffc7; border-radius:50%; background:radial-gradient(circle at 35% 30%,var(--peek-inner),var(--peek-fur) 68%); }
    .peek-piece[data-part="tail"][data-animal="tabby"] { width:50px; height:22px; border-radius:80% 42% 42% 80%; transform:translateX(-50%) rotate(-24deg); }
    .fallback-bush { display:none; position:absolute; inset:35% 4% 12%; border-radius:48% 54% 35% 40%; background:radial-gradient(ellipse at 40% 15%,#9aca69,#468659 70%); box-shadow:inset -9px -10px 0 #25614150,0 9px 0 #2b60472b; }
    .fallback-bush::after { content:'✿'; position:absolute; right:12%; top:25%; color:var(--flower); font-size:35px; }
    #stage:not([data-renderer="webgl"]) > canvas { display:none; }
    #stage:not([data-renderer="webgl"]) .fallback-bush { display:block; }
    .seek-controls { display:grid; grid-template-columns:1fr 1fr; width:min(100%,480px); justify-self:center; align-items:center; gap:12px; padding-top:12px; z-index:3; }
    .seek-controls button { min-height:56px; padding:11px 20px; border:3px solid #ffffffc0; border-radius:22px; font:900 clamp(15px,2.6vw,20px) var(--font-ui); color:#184d4a; cursor:pointer; box-shadow:0 5px 0 #367b683d; }
    #roundAction { grid-column:1; grid-row:1; background:#ffe18b; min-width:128px; }
    #playAgain { grid-column:2; grid-row:1; background:#ffe18b; visibility:hidden; }
    #showAgain { grid-column:2; grid-row:1; background:#ffffffd9; }
    .seek-controls button:disabled { cursor:default; }
    .seek-controls button:focus-visible { outline:3px solid #184d4a; outline-offset:3px; }
    .seek-controls button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 2px 0 #367b683d; }
    [hidden] { display:none !important; }
    /* Hide & Seek's centered phone heading occupies the shared notice offset.
       Keep this activity's notice in the safe gap between top navigation. */
    @media(max-width:600px) {
      .vb-celebrate {
        top:calc(2px + env(safe-area-inset-top));
        right:calc(72px + env(safe-area-inset-right));
      }
      /* The reward temporarily replaces the replay prompt in this crowded
         phone header; dismissal restores the prompt immediately. */
      body:has(.vb-celebrate.in) .vb-replay-instruction {
        visibility:hidden;
        pointer-events:none;
      }
    }
    @media(max-width:350px) {
      .vb-celebrate {
        right:calc(48px + env(safe-area-inset-right));
        width:136px;
        min-height:58px;
        grid-template-columns:32px minmax(0,1fr);
        gap:4px;
        padding:5px;
      }
      .vb-celebrate .cele-ribbon { width:32px; max-height:44px; }
      .vb-celebrate .cele-title { font-size:10px; }
      .vb-celebrate .cele-hint { margin-top:2px; font-size:9px; }
    }
    @media(max-height:650px) { .seek-screen { padding-top:82px; gap:2px; padding-bottom:68px; } .seek-heading h1{font-size:26px;margin-bottom:3px} #hint{font-size:14px;min-height:2.5em} .seek-controls{padding-top:5px;gap:8px} .seek-controls button{min-height:48px;padding:7px 12px;font-size:14px} #roundAction{min-width:128px} #stage{border-radius:24px} .peek-piece[data-part="ears"]{transform:translateX(-50%) scale(.72);transform-origin:bottom center}.peek-piece[data-part="face"],.peek-piece[data-part="paw"]{font-size:34px}.peek-piece[data-part="tail"]{width:24px;height:24px}.peek-piece[data-part="tail"][data-animal="tabby"]{width:42px;height:18px} }
    @media(orientation:landscape) and (max-height:550px) { .seek-screen { grid-template-columns:210px minmax(0,1fr);grid-template-rows:1fr auto;padding:90px 16px 58px;gap:4px 18px} .seek-heading{grid-column:1;align-self:center} #stage{grid-column:2;grid-row:1/3;height:100%} .seek-controls{grid-column:1;grid-template-columns:1fr;grid-template-rows:44px 44px;gap:7px} #showAgain,#playAgain{grid-column:1;grid-row:2} .seek-controls button{width:100%;min-height:44px;padding:5px 8px} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important;transition:none !important; } }
  </style>
</head>
<body class="seek-game">
  <main class="seek-screen">
    <header class="seek-heading"><h1>Hide &amp; Seek</h1><p id="hint" role="status" aria-live="polite"></p></header>
    <div id="stage" role="group" aria-label="Hide-and-seek garden" data-renderer="loading"><canvas aria-hidden="true"></canvas>
      <div id="friendIntro"><div id="seekCompanion" aria-hidden="true"></div><strong class="intro-name"></strong><span class="intro-message">Ready to find me?</span></div>
      <div id="hideCover" hidden><span aria-hidden="true">🙈</span>No peeking…</div>
    </div>
    <div class="seek-controls">
      <button type="button" id="roundAction">🔎 Find our friend</button>
      <button type="button" id="playAgain" disabled>↻ Play again</button>
      <button type="button" id="showAgain" hidden>👀 A little hint</button>
    </div>
  </main>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sleep-timer.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script src="../js/mascot.js"></script>
  <script src="../js/hide-seek.js"></script>
</body>
</html>
