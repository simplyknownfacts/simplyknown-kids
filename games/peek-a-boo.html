<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hide &amp; Seek</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/themes.css">
  <script>/* apply the active kid's theme before first paint (default storybook = no attribute); activity pages also stamp data-tod (shell pages get it from atmosphere.js) so theme tokens resolve */try{var _p=JSON.parse(localStorage.vb_profiles||"[]"),_a=localStorage.vb_active_id,_t=((_p.find(function(x){return x.id===_a})||_p[0])||{}).theme;if(_t&&_t!=="storybook"){document.documentElement.setAttribute("data-vbtheme",_t);var _h=new Date().getHours();document.documentElement.setAttribute("data-tod",_h>=5&&_h<10?"morning":_h>=10&&_h<17?"afternoon":_h>=17&&_h<20?"evening":"night")}}catch(e){}</script>
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body.seek-game { color:#184d4a; background:#c5eaf1; touch-action:manipulation; }
    .seek-screen { height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; padding:calc(88px + env(safe-area-inset-top)) 12px calc(52px + env(safe-area-inset-bottom)); gap:6px; box-sizing:border-box; }
    .seek-heading { text-align:center; z-index:2; }
    .seek-heading h1 { margin:0 0 6px; font:900 clamp(26px,5vw,44px)/1.1 var(--font-display); color:#184d4a; }
    #hint { margin:0 auto; min-height:2.5em; max-width:500px; font:800 clamp(15px,2.8vw,20px)/1.3 var(--font-ui); }
    #stage { position:relative; min-height:0; width:min(100%,850px); justify-self:center; border-radius:42px; isolation:isolate; overflow:hidden; background:linear-gradient(#b8e7f0 0 34%,#aad78b 34%); box-shadow:inset 0 0 0 2px #ffffff60,0 12px 30px #286d5d20; }
    #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:inherit; }
    .hiding-spot { position:absolute; z-index:2; padding:0; background:transparent; border:3px solid transparent; border-radius:38%; color:#184d4a; cursor:pointer; opacity:1; -webkit-tap-highlight-color:transparent; }
    .hiding-spot:disabled { cursor:default; opacity:1; }
    .hiding-spot:focus-visible { outline:5px solid #fff5a4; outline-offset:-3px; box-shadow:0 0 0 3px #255552; }
    .hiding-spot.guide { border-color:#fff5a4; box-shadow:0 0 0 4px #fff5a440; }
    .hiding-spot.empty::after { content:'Nobody here'; position:absolute; bottom:12%; left:0; right:0; padding:6px 2px; border-radius:20px; background:#fff9e9ed; font:800 13px var(--font-ui); }
    .peek-marker { position:absolute; bottom:0; left:50%; transform:translateX(-50%); padding:5px 12px; border-radius:20px; background:#fff9e9; box-shadow:0 3px 0 #265f4930; font:900 clamp(14px,2vw,20px) var(--font-ui); white-space:nowrap; pointer-events:none; }
    .fallback-bush { display:none; position:absolute; inset:35% 4% 12%; border-radius:48% 54% 35% 40%; background:radial-gradient(ellipse at 40% 15%,#9aca69,#468659 70%); box-shadow:inset -9px -10px 0 #25614150,0 9px 0 #2b60472b; }
    .fallback-bush::after { content:'✿'; position:absolute; right:12%; top:25%; color:var(--flower); font-size:35px; }
    .fallback-animal { display:none; position:absolute; inset:0 0 35%; font-size:clamp(46px,12vw,100px); line-height:1.2; text-align:center; }
    #stage:not([data-renderer="webgl"]) canvas { display:none; }
    #stage:not([data-renderer="webgl"]) .fallback-bush, #stage:not([data-renderer="webgl"]) .fallback-animal { display:block; }
    .seek-controls { display:flex; justify-content:center; align-items:center; gap:12px; padding-top:12px; z-index:3; }
    .seek-controls button { min-height:56px; padding:11px 20px; border:3px solid #ffffffc0; border-radius:22px; font:900 clamp(15px,2.6vw,20px) var(--font-ui); color:#184d4a; cursor:pointer; box-shadow:0 5px 0 #367b683d; }
    #roundAction { background:#ffe18b; min-width:160px; }
    #showAgain { background:#ffffffd9; }
    .seek-controls button:disabled { cursor:default; }
    .seek-controls button:focus-visible { outline:3px solid #184d4a; outline-offset:3px; }
    .seek-controls button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 2px 0 #367b683d; }
    [hidden] { display:none !important; }
    @media(max-height:650px) { .seek-screen { padding-top:82px; gap:2px; padding-bottom:44px; } .seek-heading h1{font-size:26px;margin-bottom:3px} #hint{font-size:14px;min-height:2.5em} .seek-controls{padding-top:5px;gap:8px} .seek-controls button{min-height:48px;padding:7px 12px;font-size:14px} #roundAction{min-width:128px} #stage{border-radius:24px} }
    @media(orientation:landscape) and (max-height:550px) { .seek-screen { grid-template-columns:210px minmax(0,1fr);grid-template-rows:1fr auto;padding:90px 16px 38px;gap:4px 18px} .seek-heading{grid-column:1;align-self:center} #stage{grid-column:2;grid-row:1/3;height:100%} .seek-controls{grid-column:1;flex-direction:column;gap:7px} .seek-controls button{width:100%;min-height:44px;padding:5px 8px} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important;transition:none !important; } }
  </style>
</head>
<body class="seek-game">
  <main class="seek-screen">
    <header class="seek-heading"><h1>Hide &amp; Seek</h1><p id="hint" role="status" aria-live="polite"></p></header>
    <div id="stage" role="group" aria-label="Hide-and-seek garden" data-renderer="loading"><canvas aria-hidden="true"></canvas></div>
    <div class="seek-controls">
      <button type="button" id="roundAction">🙈 Hide!</button>
      <button type="button" id="showAgain" hidden>👀 Show me again</button>
    </div>
  </main>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/voice-manifest.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sleep-timer.js"></script>
  <script src="../js/game-settings.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script src="../js/hide-seek.js"></script>
</body>
</html>
