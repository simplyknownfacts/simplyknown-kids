<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Peek-a-Boo</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/achievements.css">
  <style>
    body { background: linear-gradient(160deg, #1a1a2e, #2d1b69); }
    .stage { display:flex; align-items:center; justify-content:center; gap:32px; flex-wrap:wrap; }
    .curtain-wrap { position:relative; width:160px; height:160px; }
    .animal {
      width:160px; height:160px; border-radius:24px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-size:72px; background:rgba(255,255,255,0.12);
    }
    .curtain-wrap .animal { position:absolute; inset:0; }
    .animal-solo {
      font-size: clamp(100px, 28vw, 200px);
      line-height: 1;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.4));
      text-align: center;
    }
    .animal-solo .animal-name {
      font-size: clamp(20px, 5vw, 36px);
      font-weight: 900; color: white; display: block; margin-top: 8px;
    }
    .animal .animal-name { font-size:16px; font-weight:800; color:white; margin-top:4px; }
    .curtain {
      position:absolute; inset:0; border-radius:24px;
      background:linear-gradient(160deg,#4ECDC4,#45B7D1);
      display:flex; align-items:center; justify-content:center;
      font-size:48px; cursor:pointer;
      transition:transform 0.4s ease;
      transform-origin:top center;
    }
    .curtain.open { transform:scaleY(0); }
    /* Littles (tier ≤2): a bigger, friendlier curtain that wiggles to invite the tap. */
    .curtain-wrap.big { width:240px; height:240px; }
    .curtain-wrap.big .animal { width:240px; height:240px; }
    .curtain-wrap.big .animal > span:first-child { font-size:120px; }
    .curtain-wrap.big .curtain { font-size:72px; }
    .curtain.wiggle { animation:cwiggle 1.1s ease-in-out infinite; }
    .curtain.open { animation:none; }
    @keyframes cwiggle { 0%,100%{transform:rotate(-3deg) scale(1)} 50%{transform:rotate(3deg) scale(1.04)} }
    @media (prefers-reduced-motion: reduce) { .curtain.wiggle { animation:none; } }
    .hint { font-size:18px; font-weight:800; color:white; text-align:center; min-height:28px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="title">👀 Peek-a-Boo!</div>
    <div class="hint" id="hint"></div>
    <div class="stage" id="stage"></div>
  </div>
  <script src="../js/tiers.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/achievement-defs.js"></script>
  <script src="../js/achievement-logic.js"></script>
  <script src="../js/ribbon.js"></script>
  <script src="../js/celebrate.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/sync.js"></script>
  <script>window.VB_ASSET_BASE='../';</script>
  <script>
    (function() {
    const profile = getActiveProfile();
    if (!profile) { goProfiles(); return; }
    const tier = getActivityTier(profile, 'peek-a-boo');
    renderBackBtn('index.html');
    if (window.vbProgress) { vbProgress.firstPlay('peek-a-boo'); vbProgress.touchStreak(); }

    let roundTimer = null;
    window.addEventListener('beforeunload', () => clearTimeout(roundTimer));

    const ANIMALS = [
      { emoji:'🐮', name:'Cow',      sound:'Moo' },
      { emoji:'🐶', name:'Dog',      sound:'Woof' },
      { emoji:'🐱', name:'Cat',      sound:'Meow' },
      { emoji:'🐸', name:'Frog',     sound:'Ribbit' },
      { emoji:'🦁', name:'Lion',     sound:'Roar' },
      { emoji:'🐘', name:'Elephant', sound:'Trumpet' },
    ];

    const multiOn = tier >= 5 || getProfileFeature(profile, 'peek-a-boo', 'multiChoice');
    let answerIdx = 0;

    function pickRandom(n) {
      const shuffled = [...ANIMALS].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, n);
    }

    function reveal(wrap, onDone) {
      const curtain = wrap.querySelector('.curtain');
      curtain.classList.add('open');
      playSuccess();
      if (window.vbProgress) vbProgress.record('peek-a-boo');
      setTimeout(onDone, 1800);
    }

    function nextRound() {
      const stage = document.getElementById('stage');
      const hint  = document.getElementById('hint');
      stage.innerHTML = '';

      if (!multiOn) {
        // Tiers 1-4: ONE hidden animal, TAP the curtain to reveal it. (Littles
        // used to auto-cycle with no tap — but a baby should still tap to make
        // the animal pop out; that's the whole point of peek-a-boo.)
        const little = tier <= 2;
        const a = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
        hint.textContent = little ? '👆 Tap to peek!' : 'Who is hiding? Tap to see!';
        const wrap = document.createElement('div');
        wrap.className = 'curtain-wrap' + (little ? ' big' : '');
        wrap.innerHTML = `
          <div class="animal"><span>${a.emoji}</span><span class="animal-name">${a.name}</span></div>
          <div class="curtain wiggle">🎀</div>`;
        wrap.querySelector('.curtain').addEventListener('click', () => {
          reveal(wrap, () => {
            speak(little ? `${a.name}! ${a.sound}` : a.name);
            setTimeout(nextRound, little ? 1900 : 1500);
          });
        });
        stage.appendChild(wrap);

      } else {
        const count = tier <= 6 ? 2 : 3;
        const animals = pickRandom(count);
        answerIdx = Math.floor(Math.random() * count);
        const target = animals[answerIdx];

        if (tier >= 7) {
          hint.textContent = `Tap the ${target.name}!`;
        } else {
          hint.textContent = '🔊 Listen...';
          setTimeout(() => speak(`${target.sound}! ${target.sound}! Who am I?`), 400);
        }

        animals.forEach((a, i) => {
          const wrap = document.createElement('div');
          wrap.className = 'curtain-wrap';
          wrap.innerHTML = `
            <div class="animal"><span>${a.emoji}</span><span class="animal-name">${a.name}</span></div>
            <div class="curtain">🎀</div>`;
          wrap.querySelector('.curtain').addEventListener('click', () => {
            if (i === answerIdx) {
              reveal(wrap, () => { speak(`Yes! ${a.name}!`); setTimeout(nextRound, 1500); });
            } else {
              playBoop();
              wrap.querySelector('.curtain').style.background = '#FF6B6B';
              setTimeout(() => {
                wrap.querySelector('.curtain').style.background = '';
                speak(`Try again!`);
              }, 600);
            }
          });
          stage.appendChild(wrap);
        });
      }
    }

    nextRound();
    })();
  </script>
</body>
</html>
